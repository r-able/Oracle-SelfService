---
# JIRA_PDB_create_pluggable_database.yml
# Released under the MIT license. Copyright (c) 2026, Vlad von Grigorian <
#
# NEW (Aug 2026) - this project never actually had a JIRA-side playbook;
# JIRA_PDB_cron_wrapper.sh existed and pointed at this filename, but nothing
# was ever built to match it (it was found accidentally pointing at the PAT
# playbook, a leftover copy-paste from whoever scaffolded it). Ported from
# SNOW_PDB_create_pluggable_database.yml - the Oracle-side logic (container
# pre-check, CREATE PLUGGABLE DATABASE, OMF/FILE_NAME_CONVERT handling,
# v$pdbs verification) is copied essentially verbatim, since none of that
# cares which ticketing system originated the request. Only the intake,
# approval gating, and outcome-posting are Jira-native, matching the house
# conventions already established in JIRA_DCR_data_change.yml and
# JIRA_REF_oracle_schema_refresh.yml.
#
# Workflow:
#   0. Pre-flight  : validate Jira API token via /rest/api/2/myself
#   0b. Resolve    : the 2 field IDs (Target Host & Container (CDB), New
#                    pluggable database name)
#   0c. Shepherd   : promote To Do -> Pending Approval -> In Progress
#                    (same COMMON_jira_shepherd_statuses.yml gate as REF -
#                    the ServiceNow side requires "Full" approval for PDB,
#                    matched here rather than reinventing ServiceNow's
#                    multi-state change-model walk)
#   1. Search      : find all "In Progress" PDB issues matching the JQL
#   2. Fetch       : retrieve each issue and parse both fields; drop issues
#                    with missing fields, an unknown host, or an invalid
#                    PDB name (must be a valid Oracle identifier)
#   3. Pre-check   : per job - is the target container actually a CDB? does
#                    the PDB already exist (idempotent skip)? is OMF in use?
#   4. Create      : CREATE PLUGGABLE DATABASE, open READ WRITE, grant the
#                    admin user CONNECT/RESOURCE, SAVE STATE - skipped
#                    entirely if the PDB already exists
#   5. Verify      : capture v$pdbs afterward as evidence
#   6. Evidence    : written to a local log file (admin password deliberately
#                    excluded), then posted as a Jira comment
#   7. Credentials : posted as a SEPARATE Jira comment, clearly marked
#                    confidential - never mixed into the evidence comment,
#                    matching ServiceNow's "password in work notes only,
#                    never in the attached log" separation
#   8. Transition  : move issue to "Done" on success, "Failed" on error
#                    ("Failed" also opens a DBA repair follow-up task)
#   9. Summary     : print final outcome table
#
# FIELD FORMAT:
#   Target Host & Container (CDB) : "lnx001:CDB1"  (from JIRA_sync_oracle_hosts.yml)
#   New pluggable database name   : free text, e.g. "SALESPDB" - validated
#                                    against a valid-Oracle-identifier pattern,
#                                    NOT synced from anywhere (the whole point
#                                    of this field is a name that doesn't
#                                    exist yet)
#
# Required vars (vars/main.yml -- vault-encrypt sensitive values):
#   # Jira
#   jira_url, jira_user, jira_api_token
#   jira_jql_pdb, jira_max_results, jira_cloud
#   jira_status_done, jira_status_failed, jira_status_todo,
#   jira_status_pending_approval, jira_status_in_progress
#   jira_pdb_host_field_name : "Target Host & Container (CDB)"
#   jira_pdb_name_field_name : "New pluggable database name"
#
#   # Oracle
#   oracle_instance_map : { <host>: { oracle_sid, oracle_home, oracle_user }, ... }
#   followup_log_dir
#
# NEEDS VALIDATION before trusting this against a real request - not yet
# live-tested end-to-end (the ServiceNow version this was ported from IS
# confirmed working in production).
#
# Usage:
#   ansible-playbook JIRA_PDB_create_pluggable_database.yml --ask-vault-pass

- name: "Jira -> Create Oracle pluggable database -> Close issue"
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    pdb_admin_user: "PDBADMIN"
    pdb_log_dir: "/tmp/jira_pdb_logs"
    # A PDB name must be a valid Oracle identifier: start with a letter, then
    # letters/digits/underscore, 30 characters or fewer.
    pdb_name_pattern: '^[A-Za-z][A-Za-z0-9_]{0,29}$'

  tasks:

  - name: "PRE-FLIGHT | Validate Jira API token via /rest/api/2/myself"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/myself"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      status_code: 200
      return_content: true
    register: jira_auth_check
    no_log: true

  - name: "PRE-FLIGHT | Confirm authenticated identity"
    ansible.builtin.debug:
      msg: >-
        Jira authentication OK -- connected as '{{ jira_auth_check.json.displayName }}' ({{ jira_auth_check.json.emailAddress }})

  - name: "PRE-FLIGHT | Remove stale outcomes file from any aborted previous run"
    ansible.builtin.file:
      path: "/tmp/jira_pdb_outcomes.json"
      state: absent

  # -- 0b. Resolve the two REF field IDs by name -----------------------------
  - name: "0b | Resolve 'Target Host & Container (CDB)' field ID"
    ansible.builtin.include_tasks: COMMON_jira_resolve_field.yml
    vars:
      resolve_field_name: "{{ jira_pdb_host_field_name }}"

  - name: "0b | Set jira_pdb_host_field from the resolved ID"
    ansible.builtin.set_fact:
      jira_pdb_host_field: "{{ resolved_field_id }}"

  - name: "0b | Resolve 'New pluggable database name' field ID"
    ansible.builtin.include_tasks: COMMON_jira_resolve_field.yml
    vars:
      resolve_field_name: "{{ jira_pdb_name_field_name }}"

  - name: "0b | Set jira_pdb_name_field from the resolved ID"
    ansible.builtin.set_fact:
      jira_pdb_name_field: "{{ resolved_field_id }}"

  # -- 0c. Shepherd the intake queue toward 'In Progress' --------------------
  # PDB requires full approval per the ServiceNow-side product definition
  # ("Approval requirements: Full") - matched here with the same shepherd
  # gate already used by REF, rather than reinventing ServiceNow's
  # assess/authorize/scheduled/implement change-model walk.
  - name: "0c | Shepherd PDB intake queue toward 'In Progress'"
    ansible.builtin.include_tasks: COMMON_jira_shepherd_statuses.yml
    vars:
      shepherd_project: "PDB"

  # -- 1. Search for issues genuinely at 'In Progress' now --------------------
  - name: "1 | Search for open Jira PDB issues matching JQL"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: search
      jql: "{{ jira_jql_pdb }}"
      maxresults: "{{ jira_max_results }}"
      cloud: "{{ jira_cloud }}"
    register: jira_search

  - name: "1 | Show 'No Tasks Found' and exit cleanly when queue is empty"
    ansible.builtin.debug:
      msg: "No Tasks Found -- no Jira issues currently match JQL: {{ jira_jql_pdb }}. Nothing to process; exiting cleanly."
    when: jira_search.meta.issues | default([]) | length == 0

  - name: "1 | End play gracefully when no issues are found"
    ansible.builtin.meta: end_play
    when: jira_search.meta.issues | default([]) | length == 0

  - name: "1 | Show issues found"
    ansible.builtin.debug:
      msg: "Found {{ jira_search.meta.issues | length }} PDB issue(s): {{ jira_search.meta.issues | map(attribute='key') | list | join(', ') }}"

  - name: "2 | Fetch full details for each issue"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: fetch
      issue: "{{ item.key }}"
      cloud: "{{ jira_cloud }}"
    loop: "{{ jira_search.meta.issues }}"
    loop_control:
      label: "{{ item.key }}"
    register: jira_issue_details

  # -- Parse and validate the two fields --------------------------------------
  - name: "2 | WARN and skip issues with an unusable host or PDB name"
    ansible.builtin.debug:
      msg:
      - >-
        WARNING: {{ item.meta.key }} has an unusable spec
        (Host: '{{ p_host_db }}', New PDB name: '{{ p_new }}') -- skipping.
        {% if p_host not in oracle_instance_map %}Unknown host '{{ p_host }}' (known: {{ oracle_instance_map.keys() | list | join(', ') }}). {% endif %}
        {% if p_new | length > 0 and p_new is not match(pdb_name_pattern) %}'{{ p_new }}' is not a valid PDB name (letter first, then letters/digits/underscore, max 30). {% endif %}
      - "Populated custom fields on {{ item.meta.key }}:"
      - "{{ item.meta.fields | dict2items | selectattr('key', 'match', '^customfield_') | rejectattr('value', 'none') | items2dict }}"
    loop: "{{ jira_issue_details.results }}"
    loop_control:
      label: "{{ item.meta.key }}"
    vars:
      p_host_db: "{{ (item.meta.fields[jira_pdb_host_field] | default({})).value | default('') }}"
      p_host: "{{ p_host_db.split(':')[0] | default('') | trim }}"
      p_new: "{{ item.meta.fields[jira_pdb_name_field] | default('', true) | trim | upper }}"
    when: >-
      p_host_db | length == 0 or p_new | length == 0
      or p_host not in oracle_instance_map
      or p_new is not match(pdb_name_pattern)

  - name: "2 | Build the PDB creation job list"
    ansible.builtin.set_fact:
      pdb_jobs: >-
        {{
          pdb_jobs | default([]) + [{
            'issue_key':  item.meta.key,
            'target_host': p_host,
            'cdb_name':    p_cdb,
            'pdb_name':    p_new,
            'oracle_sid':  oracle_instance_map[p_host].oracle_sid,
            'oracle_home': oracle_instance_map[p_host].oracle_home,
            'oracle_user': oracle_instance_map[p_host].oracle_user
          }]
        }}
    loop: "{{ jira_issue_details.results }}"
    loop_control:
      label: "{{ item.meta.key }}"
    vars:
      p_host_db: "{{ (item.meta.fields[jira_pdb_host_field] | default({})).value | default('') }}"
      p_host: "{{ p_host_db.split(':')[0] | default('') | trim }}"
      p_cdb: "{{ p_host_db.split(':')[1] | default('') | trim | upper }}"
      p_new: "{{ item.meta.fields[jira_pdb_name_field] | default('', true) | trim | upper }}"
    when: >-
      p_host_db | length > 0 and p_new | length > 0
      and p_host in oracle_instance_map
      and p_new is match(pdb_name_pattern)

  - name: "2 | Nothing valid to process"
    ansible.builtin.meta: end_play
    when: pdb_jobs | default([]) | length == 0

  - name: "2 | Jobs queued"
    ansible.builtin.debug:
      msg: "{{ item.issue_key }} -- create PDB {{ item.pdb_name }} in {{ item.cdb_name }} on {{ item.target_host }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # =========================================================================
  # 3. Inspect the container database
  # =========================================================================

  - name: "3 | Capture container state, OMF setting and seed datafile path"
    ansible.builtin.shell:
      cmd: |
        set -o pipefail
        export ORACLE_SID={{ item.oracle_sid }}
        export ORACLE_HOME={{ item.oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOSQL'
        SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO OFF LINESIZE 400 TRIMSPOOL ON
        SELECT 'CDB=' || CDB FROM v$database;
        SELECT 'DBNAME=' || name FROM v$database;
        SELECT 'PDBEXISTS=' || COUNT(*) FROM v$pdbs WHERE UPPER(name) = UPPER('{{ item.pdb_name }}');
        SELECT 'OMF=' || NVL(MAX(value),'NONE') FROM v$parameter WHERE name = 'db_create_file_dest';
        SELECT 'SEEDFILE=' || MIN(name) FROM v$datafile WHERE con_id = 2;
        EXIT;
        EOSQL
      executable: /bin/bash
    delegate_to: "{{ item.target_host }}"
    become: true
    become_user: "{{ item.oracle_user }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.cdb_name }}"
    register: pdb_precheck
    changed_when: false
    failed_when: false

  - name: "3 | Fold the pre-check results into each job"
    ansible.builtin.set_fact:
      pdb_jobs: >-
        {{
          pdb_jobs
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [ item.item | combine({
                'precheck_rc':     item.rc,
                'precheck_out':    item.stdout | default(''),
                'is_cdb':          ('CDB=YES' in (item.stdout | default(''))),
                'already_exists':  (((item.stdout | default('')).splitlines() | select('match', 'PDBEXISTS=') | map('regex_replace', '^PDBEXISTS=', '') | list | first | default('0') | int) > 0),
                'omf_dest':        ((item.stdout | default('')).splitlines() | select('match', 'OMF=') | map('regex_replace', '^OMF=', '') | list | first | default('NONE') | trim),
                'seed_file':       ((item.stdout | default('')).splitlines() | select('match', 'SEEDFILE=') | map('regex_replace', '^SEEDFILE=', '') | list | first | default('') | trim)
              }) ]
        }}
    loop: "{{ pdb_precheck.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }}"

  - name: "3 | Show what the pre-check found"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }}: container is CDB? {{ item.is_cdb }} | {{ item.pdb_name }} already exists? {{ item.already_exists }} | OMF: {{ item.omf_dest }} | {{ 'Will SKIP creation and close successful.' if item.already_exists
           else ('Will create the PDB.' if item.is_cdb else 'NOT a container database -- will fail for DBA review.') }}
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # =========================================================================
  # 4. Create the PDB (only where needed)
  # =========================================================================

  - name: "4 | Generate a PDB admin password for each job"
    ansible.builtin.set_fact:
      pdb_jobs: >-
        {{
          pdb_jobs
          | rejectattr('issue_key', 'equalto', item.issue_key)
          | list
          + [ item | combine({
                'admin_password': lookup('password', '/dev/null length=16 chars=ascii_letters,digits') + 'Ab1_'
              }) ]
        }}
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    no_log: true

  # With FILE_NAME_CONVERT the destination directory must already exist;
  # under OMF Oracle places the files itself and this is skipped.
  - name: "4 | Create the datafile directory when OMF is not in use"
    ansible.builtin.file:
      path: "{{ (item.seed_file | dirname | dirname) + '/' + item.pdb_name }}"
      state: directory
      owner: "{{ item.oracle_user }}"
      mode: '0750'
    delegate_to: "{{ item.target_host }}"
    become: true
    become_user: root
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when:
    - item.is_cdb
    - not item.already_exists
    - item.omf_dest in ['NONE', '']
    - item.seed_file | length > 0
    failed_when: false

  - name: "4 | Create, open and save the state of the pluggable database"
    ansible.builtin.shell:
      cmd: |
        set -o pipefail
        export ORACLE_SID={{ item.oracle_sid }}
        export ORACLE_HOME={{ item.oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOSQL'
        WHENEVER SQLERROR EXIT SQL.SQLCODE
        SET ECHO ON FEEDBACK ON LINESIZE 400 PAGESIZE 200
        SET SQLBLANKLINES ON
        CREATE PLUGGABLE DATABASE "{{ item.pdb_name }}" ADMIN USER "{{ pdb_admin_user }}" IDENTIFIED BY "{{ item.admin_password }}"{{ pdb_storage_clause }};
        ALTER PLUGGABLE DATABASE "{{ item.pdb_name }}" OPEN READ WRITE;
        ALTER SESSION SET CONTAINER = "{{ item.pdb_name }}";
        GRANT CONNECT, RESOURCE, CREATE SESSION TO "{{ pdb_admin_user }}";
        ALTER SESSION SET CONTAINER = CDB$ROOT;
        ALTER PLUGGABLE DATABASE "{{ item.pdb_name }}" SAVE STATE;
        EXIT;
        EOSQL
      executable: /bin/bash
    delegate_to: "{{ item.target_host }}"
    become: true
    become_user: "{{ item.oracle_user }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.pdb_name }}"
    vars:
      # Emit FILE_NAME_CONVERT ONLY when we positively know OMF is off AND we
      # have a real seed path. If omf_dest is empty/NONE, or seed_file is
      # empty (a parse miss), emit NO clause -- on an OMF database Oracle
      # names the files itself, and emitting a bogus convert pair produces
      # ORA-01276. Fail safe toward "let Oracle decide".
      pdb_storage_clause: >-
        {{ (" FILE_NAME_CONVERT = ('" + (item.seed_file | dirname) + "/', '"
            + (item.seed_file | dirname | dirname) + "/" + item.pdb_name + "/')")
           if (item.omf_dest in ['NONE', ''] and (item.seed_file | default('') | length) > 0
               and (item.seed_file | dirname | dirname | length) > 1)
           else '' }}
    register: pdb_create
    when:
    - item.is_cdb
    - not item.already_exists
    failed_when: false
    no_log: true # the CREATE statement contains the admin password

  - name: "4 | Show the creation outcome (no credentials)"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.issue_key }} / {{ item.item.pdb_name }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }}
    loop: "{{ pdb_create.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key | default('skipped') }}"
    when: item is not skipped

  # =========================================================================
  # 5. Verify -- capture v$pdbs afterwards as evidence
  # =========================================================================

  - name: "5 | Capture v$pdbs after the operation"
    ansible.builtin.shell:
      cmd: |
        set -o pipefail
        export ORACLE_SID={{ item.oracle_sid }}
        export ORACLE_HOME={{ item.oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOSQL'
        SET HEADING ON FEEDBACK OFF PAGESIZE 200 LINESIZE 200
        COLUMN name FORMAT A30
        COLUMN open_mode FORMAT A12
        COLUMN restricted FORMAT A10
        SELECT con_id, name, open_mode, restricted FROM v$pdbs ORDER BY con_id;
        EXIT;
        EOSQL
      executable: /bin/bash
    delegate_to: "{{ item.target_host }}"
    become: true
    become_user: "{{ item.oracle_user }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    register: pdb_postcheck
    changed_when: false
    failed_when: false

  - name: "5 | Determine the outcome for each issue"
    ansible.builtin.set_fact:
      pdb_outcomes: >-
        {{
          pdb_outcomes | default({}) | combine({
            item.issue_key: (
              'done' if (
                item.already_exists
                or (
                  item.is_cdb
                  and ((pdb_create.results | default([])
                        | selectattr('item.issue_key', 'defined')
                        | selectattr('item.issue_key', 'equalto', item.issue_key)
                        | map(attribute='rc') | list | first | default(1)) == 0)
                )
              ) else 'failed'
            )
          })
        }}
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"

  - name: "5 | Per-issue outcome"
    ansible.builtin.debug:
      msg: "{{ item.key }} -> {{ item.value | upper }}"
    loop: "{{ pdb_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  # =========================================================================
  # 6. Evidence log -- written locally, posted as a Jira comment
  #    The admin password is deliberately NOT included here.
  # =========================================================================

  - name: "6 | Ensure the log directory exists"
    ansible.builtin.file:
      path: "{{ pdb_log_dir }}"
      state: directory
      mode: '0750'

  - name: "6 | Set the run timestamp"
    ansible.builtin.set_fact:
      pdb_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"

  - name: "6 | Write the evidence log for each issue"
    ansible.builtin.copy:
      dest: "{{ pdb_log_dir }}/PDB_{{ item.issue_key }}_{{ pdb_run_ts }}.log"
      mode: '0640'
      content: |
        Automated Oracle Pluggable Database creation -- evidence log
        ======================================================================
        Issue            : {{ item.issue_key }}
        Host             : {{ item.target_host }}
        Container (CDB)  : {{ item.cdb_name }}  (ORACLE_SID {{ item.oracle_sid }})
        New PDB          : {{ item.pdb_name }}
        Oracle home      : {{ item.oracle_home }}
        Executed by      : {{ jira_user }} (Ansible automation)
        Timestamp        : {{ ansible_date_time.iso8601 }}
        Outcome          : {{ pdb_outcomes[item.issue_key] | upper }}
        Already existed  : {{ item.already_exists }}
        Storage          : {{ 'OMF (' + item.omf_dest + ')' if item.omf_dest not in ['NONE',''] else 'FILE_NAME_CONVERT from ' + (item.seed_file | dirname) }}
        ======================================================================
        -- Container pre-check --------------------------------------------
        {{ item.precheck_out | trim }}

        -- Creation output -------------------------------------------------
        {% for r in pdb_create.results | default([]) if (r.item.issue_key | default('')) == item.issue_key and r.rc is defined %}
        rc={{ r.rc }}
        {{ (r.stdout | default('(no output)')) | trim }}
        {% if r.rc != 0 %}
        stderr:
        {{ (r.stderr | default('(none)')) | trim }}
        {% endif %}
        {% else %}
        (creation skipped -- {{ 'the PDB already existed' if item.already_exists else 'the container check failed' }})
        {% endfor %}

        -- v$pdbs after the operation --------------------------------------
        {% for r in pdb_postcheck.results | default([]) if (r.item.issue_key | default('')) == item.issue_key %}
        {{ (r.stdout | default('(no output)')) | trim }}
        {% endfor %}
        ======================================================================
        NOTE: the PDB admin password is intentionally omitted from this log
        and from this comment. It is posted in a SEPARATE comment on this
        issue, clearly marked confidential.
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"

  - name: "6 | Post the evidence as a Jira comment (no credentials)"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: comment
      issue: "{{ item.issue_key }}"
      comment: |-
        Automated Oracle PDB creation - {{ ansible_date_time.iso8601 }}

        Host           : {{ item.target_host }}
        Container      : {{ item.cdb_name }}
        Pluggable DB   : {{ item.pdb_name }}
        Overall result : {{ pdb_outcomes[item.issue_key] | upper }}
        {% if item.already_exists %}
        The pluggable database {{ item.pdb_name }} already existed in {{ item.cdb_name }};
        no creation was attempted and nothing was changed.
        {% elif pdb_outcomes[item.issue_key] == 'done' %}
        The pluggable database was created, opened READ WRITE and its state
        saved so it re-opens automatically when the container restarts.
        Admin credentials are posted in a separate, confidential comment on
        this issue.
        {% else %}
        The creation FAILED. See the evidence below for the full SQL*Plus
        output. A DBA repair follow-up issue is being raised.
        {% endif %}

        -- Full evidence log --
        {{ lookup('file', pdb_log_dir + '/PDB_' + item.issue_key + '_' + pdb_run_ts + '.log') }}

        Performed by : {{ jira_user }} (Ansible automation)
      cloud: "{{ jira_cloud }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    failed_when: false

  # =========================================================================
  # 7. Credentials -- posted as a SEPARATE, clearly-marked comment
  #    Only for successful, freshly-created PDBs (not "already existed").
  # =========================================================================

  - name: "7 | Post PDB admin credentials as a separate confidential comment"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: comment
      issue: "{{ item.issue_key }}"
      comment: |-
        CONFIDENTIAL - PDB Admin Credentials (do not forward outside the DBA team)

        PDB admin user     : {{ pdb_admin_user }}
        Temporary password : {{ item.admin_password }}

        Please change this password immediately after first use.
      cloud: "{{ jira_cloud }}"
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when:
    - pdb_outcomes[item.issue_key] == 'done'
    - not item.already_exists
    failed_when: false
    no_log: true

  - name: "7 | Confirm comments were posted"
    ansible.builtin.debug:
      msg: "Evidence + credentials comments posted for {{ pdb_jobs | length }} issue(s)."

  # =========================================================================
  # 8. Transition issues based on outcome
  # =========================================================================

  - name: "8 | Get available transitions for SUCCESSFUL issues"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.issue_key }}/transitions"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: pdb_outcomes[item.issue_key] == 'done'
    register: done_transitions
    failed_when: false

  - name: "8 | Match and apply the 'Done' transition"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.item.issue_key }}/transitions"
      method: POST
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      body_format: json
      body:
        transition:
          id: >-
            {{
              (item.json.transitions
               | selectattr('to.name', 'equalto', jira_status_done)
               | map(attribute='id') | list
               + item.json.transitions
               | selectattr('name', 'equalto', jira_status_done)
               | map(attribute='id') | list) | first
            }}
      status_code: 204
    loop: "{{ done_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key | default('skipped') }}"
    when:
    - item is not skipped
    - (item.json.transitions | selectattr('to.name', 'equalto', jira_status_done) | list
       + item.json.transitions | selectattr('name', 'equalto', jira_status_done) | list) | length > 0
    register: done_transition_result
    failed_when: false

  - name: "8 | WARN when no 'Done' transition is available"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.item.issue_key }} succeeded but could NOT be
        transitioned to '{{ jira_status_done }}' -- the workflow only offers:
        {{ item.json.transitions | map(attribute='name') | list | join(', ') }}.
        Check jira_status_done in vars/main.yml against the project workflow.
    loop: "{{ done_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key | default('skipped') }}"
    when:
    - item is not skipped
    - (item.json.transitions | selectattr('to.name', 'equalto', jira_status_done) | list
       + item.json.transitions | selectattr('name', 'equalto', jira_status_done) | list) | length == 0

  - name: "8 | Get available transitions for FAILED issues"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.issue_key }}/transitions"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ pdb_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: pdb_outcomes[item.issue_key] == 'failed'
    register: failed_transitions
    failed_when: false

  - name: "8 | Match and apply the 'Failed' transition"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.item.issue_key }}/transitions"
      method: POST
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      body_format: json
      body:
        transition:
          id: >-
            {{
              (item.json.transitions
               | selectattr('to.name', 'equalto', jira_status_failed)
               | map(attribute='id') | list
               + item.json.transitions
               | selectattr('name', 'equalto', jira_status_failed)
               | map(attribute='id') | list) | first
            }}
      status_code: 204
    loop: "{{ failed_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key | default('skipped') }}"
    when:
    - item is not skipped
    - (item.json.transitions | selectattr('to.name', 'equalto', jira_status_failed) | list
       + item.json.transitions | selectattr('name', 'equalto', jira_status_failed) | list) | length > 0
    register: failed_transition_result
    failed_when: false

  - name: "8 | WARN when no 'Failed' transition is available"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.item.issue_key }} failed but could NOT be
        transitioned to '{{ jira_status_failed }}' -- the workflow only offers:
        {{ item.json.transitions | map(attribute='name') | list | join(', ') }}.
        Check jira_status_failed in vars/main.yml against the project workflow.
    loop: "{{ failed_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key | default('skipped') }}"
    when:
    - item is not skipped
    - (item.json.transitions | selectattr('to.name', 'equalto', jira_status_failed) | list
       + item.json.transitions | selectattr('name', 'equalto', jira_status_failed) | list) | length == 0

  # =========================================================================
  # 9. DBA repair follow-up for failures
  # =========================================================================

  - name: "9 | Create a DBA repair follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_jira_create_followup_task.yml
    loop: "{{ pdb_jobs }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.issue_key }}"
    when: pdb_outcomes[fu_item.issue_key] == 'failed'
    vars:
      fu_original_key: "{{ fu_item.issue_key }}"
      fu_summary: "DBA repair required: could not create PDB {{ fu_item.pdb_name }} in {{ fu_item.cdb_name }} on {{ fu_item.target_host }}"
      fu_description: |-
        Automated Oracle pluggable database creation FAILED and the original
        issue has been transitioned to "{{ jira_status_failed }}". Please
        investigate and repair.

        Host             : {{ fu_item.target_host }}
        Container (CDB)  : {{ fu_item.cdb_name }} (ORACLE_SID {{ fu_item.oracle_sid }})
        New PDB          : {{ fu_item.pdb_name }}
        Container is CDB : {{ fu_item.is_cdb }}
        PDB pre-existed  : {{ fu_item.already_exists }}

        See the evidence comment on {{ fu_item.issue_key }} for the full
        SQL*Plus output and the v$pdbs listing.

  # =========================================================================
  # 10. Summary
  # =========================================================================

  - name: "10 | Final summary"
    ansible.builtin.debug:
      msg:
      - "======================================================"
      - "  Jira PDB Creation Summary"
      - "======================================================"
      - "  Run timestamp   : {{ ansible_date_time.iso8601 }}"
      - "  Issues found    : {{ pdb_jobs | length }}"
      - "  Created         : {{ pdb_jobs | rejectattr('already_exists') | selectattr('issue_key', 'in', pdb_outcomes | dict2items | selectattr('value', 'equalto', 'done') | map(attribute='key') | list) | list | length }}"
      - "  Already existed : {{ pdb_jobs | selectattr('already_exists') | list | length }}"
      - "  Failed          : {{ pdb_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length }}"
      - "  Evidence logs   : {{ pdb_log_dir }}"
      - "======================================================"
