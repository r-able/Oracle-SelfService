---
# SNOW_CDP_reset_own_oracle_password.yml
#
# Workflow:
#   0. Pre-flight : validate Jira API token via /rest/api/2/myself
#   1. Search     : find all open issues matching the configured JQL
#   2. Fetch      : retrieve each issue to extract the reporter's username
#   3. Generate   : create one random password per issue (shared across all
#                   target databases, matching the CNU provisioning model)
#   4. Reset      : connect to EVERY environment database (oracle_databases)
#                   and ALTER USER ... IDENTIFIED BY ... in each
#   5. Comment    : post the temporary password back to the Jira issue
#                   (only when ALL databases succeeded)
#   6. Transition : "Done" if ALL databases succeeded, "Failed" if ANY failed
#   7. Summary    : print a final outcome table
#
# NOTE: users are per-PDB. The previous version reset only in
# {{ oracle_service }} (ORCLPDB), where CNU-provisioned users do not exist.
# This version loops over oracle_databases (DEV/UAT/SIT/STG/CER/PRO), the
# same set CNU provisions into.
#
# Required vars (vars/main.yml -- vault-encrypt sensitive values):
#   jira_url, jira_user, jira_api_token
#   jira_jql_cdp, jira_max_results, jira_cloud
#   jira_status_done, jira_status_failed
#   oracle_host, oracle_port, oracle_dba_user, oracle_dba_pass
#   oracle_databases: { DEV: "DEV", UAT: "UAT", ... }   # env -> service name
#
# Usage:
#   ansible-playbook SNOW_CDP_reset_own_oracle_password.yml --ask-vault-pass
#
# Requirements:
#   ansible-galaxy collection install community.general
#   pip install oracledb          # thin driver, no Oracle Client needed

- name: ServiceNow -> Parse change -> Reset Oracle password in all databases -> Close change
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    # Built at runtime -- do not edit
    issue_outcomes: {} # { "CDP-123": "done" | "failed" }

  # ===========================================================================
  tasks:

  # -- PRE-FLIGHT: validate API token ---------------------------------------
  # ServiceNow intake + shepherd: finds "CDP | ..." change requests, promotes
  # eligible new ones to implement, returns the executable queue in snow_work.
  - name: "0-1 | ServiceNow intake and shepherd for CDP"
    ansible.builtin.include_tasks: COMMON_snow_intake.yml
    vars:
      snow_tag: "CDP"
      sn_type: "standard"

  - name: "1 | Abort if no work found"
    ansible.builtin.debug:
      msg: "No ServiceNow change requests tagged 'CDP |' are ready to execute. Exiting cleanly."
    when: snow_work | length == 0

  - name: "1 | End play gracefully when queue is empty"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  # Parse "CDP | Full Name" from short_description.
  # Oracle username convention (matches CAU provisioning): first letter of
  # first name + entire last name, upper-cased ("Vlad Grigorian" ->
  # VGRIGORIAN); single-word names are used as-is. Spaces are never valid
  # in Oracle usernames.
  - name: "2 | WARN and skip changes with a missing user name"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.number }} has no user name after the tag
        (short_description: '{{ item.short_description }}') -- skipping.
        Expected 'CDP | Full Name'.
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_name: "{{ item.short_description.split('|')[1] | default('') | trim }}"
    when: cdp_name | length == 0

  - name: "2 | Build change -> Oracle user mapping"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([]) + [{
            'issue_key':    item.number,
            'sys_id':       item.sys_id,
            'display_name': cdp_name,
            'oracle_user': (
              (cdp_name.split(' ')[0][0] + cdp_name.split(' ')[-1])
              if (cdp_name.split(' ') | length) > 1
              else cdp_name
            ) | upper
          }]
        }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_name: "{{ item.short_description.split('|')[1] | default('') | trim }}"
    when: cdp_name | length > 0
  - name: "2 | Show reporter -> Oracle user mapping"
    ansible.builtin.debug:
      msg: "{{ item.issue_key }} -> Oracle user: {{ item.oracle_user }} | databases: {{ oracle_databases.keys() | list | join(', ') }}"
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # -- ITIL classification (CI link, risk/impact, change schedule) --------
  # CI is the Oracle user account itself, since a password reset applies
  # universally across all environment databases, not one specific target.
  - name: "2b | ITIL | Classify each password reset (CI link, risk, impact, schedule)"
    ansible.builtin.include_tasks: COMMON_snow_itil_classify.yml
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    vars:
      itil_primary_key: "{{ item.issue_key }}"
      itil_sys_id: "{{ item.sys_id }}"
      itil_ci_name: "{{ item.oracle_user }}"
      itil_risk: "low"
      itil_impact: "low"
      itil_planned_duration_hours: 1
  # -- END ITIL classification ----------------------------------------------

  # -- 3. Generate one random password per issue -----------------------------
  # One password per issue, applied to ALL databases (matches CNU: the user
  # has one credential set across environments).

  - name: "3 | Generate random password for each Oracle user"
    ansible.builtin.shell:
      cmd: |
        upper=$(tr -dc 'A-Z'    </dev/urandom | head -c 1)
        lower=$(tr -dc 'a-z'    </dev/urandom | head -c 1)
        digit=$(tr -dc '0-9'    </dev/urandom | head -c 1)
        spec=$(tr  -dc '@#$%'   </dev/urandom | head -c 1)
        rest=$(tr  -dc 'A-Za-z0-9@#$%' </dev/urandom | head -c 12)
        pw="${upper}${lower}${digit}${spec}${rest}"
        echo "$pw" | fold -w1 | shuf | tr -d '\n'
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.oracle_user }}"
    register: generated_passwords
    no_log: true

  - name: "3 | Attach generated password to each issue entry"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([])
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [ item.item | combine({ 'new_password': item.stdout }) ]
        }}
    loop: "{{ generated_passwords.results }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.oracle_user }}"
    no_log: true

  # -- 4. Reset the password in EVERY environment database ------------------
  # product() builds every (issue, database) pair -- item.0 is the issue
  # entry, item.1 is the environment key (DEV/UAT/...). Each pair succeeds
  # or fails independently, exactly like the CNU create-user step.

  - name: "4 | Reset Oracle password for each user in each database"
    ansible.builtin.shell:
      cmd: |
        python3 - << 'PYEOF'
        import sys, os
        try:
            import oracledb
            def connect(user, password, host, port, service):
                dsn = f"{host}:{port}/{service}"
                return oracledb.connect(user=user, password=password, dsn=dsn)
        except ImportError:
            import cx_Oracle
            def connect(user, password, host, port, service):
                dsn = cx_Oracle.makedsn(host, int(port), service_name=service)
                return cx_Oracle.connect(user=user, password=password, dsn=dsn)

        host        = os.environ["ORA_HOST"]
        port        = os.environ["ORA_PORT"]
        service     = os.environ["ORA_SERVICE"]
        dba_user    = os.environ["ORA_DBA_USER"]
        dba_pass    = os.environ["ORA_DBA_PASS"]
        target_user = os.environ["ORA_TARGET_USER"]
        new_pass    = os.environ["ORA_NEW_PASS"]
        db_name     = os.environ["ORA_DB_NAME"]

        try:
            conn = connect(dba_user, dba_pass, host, port, service)
        except Exception as e:
            print(f"ERROR: [{db_name}] Could not connect to Oracle service "
                  f"'{service}': {e}", file=sys.stderr)
            sys.exit(1)

        cur = conn.cursor()

        # Verify the target user exists in THIS database before resetting
        cur.execute(
            "SELECT COUNT(*) FROM dba_users WHERE username = :uname",
            uname=target_user
        )
        if cur.fetchone()[0] == 0:
            print(f"ERROR: [{db_name}] Oracle user '{target_user}' does not "
                  f"exist in this database.", file=sys.stderr)
            sys.exit(1)

        # ALTER USER does not support bind variables for identifiers;
        # values come from env vars (not raw shell input) so this is safe.
        cur.execute(f'ALTER USER "{target_user}" IDENTIFIED BY "{new_pass}"')
        conn.commit()
        print(f"OK: [{db_name}] password reset for {target_user}")
        cur.close()
        conn.close()
        PYEOF
    environment:
      ORA_HOST: "{{ oracle_host }}"
      ORA_PORT: "{{ oracle_port | string }}"
      ORA_SERVICE: "{{ oracle_databases[item.1] }}"
      ORA_DBA_USER: "{{ oracle_dba_user }}"
      ORA_DBA_PASS: "{{ oracle_dba_pass }}"
      ORA_TARGET_USER: "{{ item.0.oracle_user }}"
      ORA_NEW_PASS: "{{ item.0.new_password }}"
      ORA_DB_NAME: "{{ item.1 }}"
    loop: "{{ issues_to_reset | default([]) | product(oracle_databases.keys() | list) | list }}"
    loop_control:
      label: "{{ item.0.issue_key }} | {{ item.0.oracle_user }} -> {{ item.1 }}"
    register: oracle_reset_results
    ignore_errors: true
    no_log: true # keeps DBA password and new password out of Ansible logs

  # -- 4b. Show sanitised per-database outcome (no passwords) ---------------

  - name: "4b | Show password-reset outcome per issue per database"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.0.issue_key }} | {{ item.item.0.oracle_user }} -> {{ item.item.1 }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }} {% if item.rc != 0 %}| stderr: {{ item.stderr | default('(none)') | trim }}{% endif %}
    loop: "{{ oracle_reset_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.0.issue_key }} / {{ item.item.1 }}"

  # -- 5. Post temporary password as a Jira comment (all-success only) ------
  # One comment per issue, only when EVERY database reset succeeded, so a
  # user never receives a password that only works in some environments.

  - name: "5 | Post new temporary password as a work note (all databases succeeded)"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ item.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |
          Automated password reset completed successfully in all databases.

          Oracle User        : {{ item.oracle_user }}
          Temporary Password : {{ item.new_password }}
          Databases          : {{ oracle_databases.keys() | list | join(', ') }}
          Reset By           : {{ sn_username }} (Ansible automation)
          Timestamp          : {{ ansible_date_time.iso8601 }}

          Please change this password immediately after your first login.
          Do not share this password.
      status_code: 200
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0
    register: cdp_password_note
    no_log: true
    ignore_errors: true

  - name: "5 | WARN if the password work note could not be posted"
    ansible.builtin.debug:
      msg: >-
        WARNING: the temporary password work note failed to post for one or
        more changes (HTTP status other than 200). The password reset itself
        succeeded, but the requester will not see the new password on the
        change. Check sn_instance / credentials and the change sys_id.
    when: cdp_password_note is defined and (cdp_password_note.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0)

  # -- 6. Compute per-issue outcome and transition ---------------------------
  # done   -> ALL databases succeeded for the issue
  # failed -> ANY database failed

  - name: "6 | Mark issues DONE (all databases succeeded)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'done' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0

  - name: "6 | Mark issues FAILED (one or more databases failed)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'failed' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) > 0
  - name: "6 | Move SUCCESSFUL changes to review"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: review
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Close SUCCESSFUL changes (close_code successful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: closed
      close_code: successful
      close_notes: |-
        Automated Oracle password reset COMPLETED in all databases - {{ ansible_date_time.iso8601 }}
        The temporary password is in the work notes on this change.
        Please change it immediately after first login.
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Post failure work note and close FAILED changes"
    block:
    - name: "6a | Post failure work note (per-database breakdown)"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ snow_cr_map[item.key] }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            Automated password reset FAILED in one or more databases.

            Per-database outcome:
            {% for r in oracle_reset_results.results | default([])
                  if r.item.0.issue_key == item.key %}
            * {{ r.item.1 }}: {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }}
            {% endfor %}

            No temporary password has been issued. A DBA repair follow-up
            change request is being raised.

            Timestamp: {{ ansible_date_time.iso8601 }}
        status_code: 200
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      ignore_errors: true
    - name: "6b | Close FAILED changes (close_code unsuccessful)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ snow_cr_map[item.key] }}"
        state: closed
        close_code: unsuccessful
        close_notes: "Automated password reset failed; see work notes and the DBA repair follow-up change. No temporary password was issued."
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      failed_when: false

  - name: "6c | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: snow_followup_enabled | default(true) | bool

  - name: "6c | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - snow_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "6c | Write failure report per FAILED issue (no stdout -- may contain credentials)"
    ansible.builtin.copy:
      content: |
        Automated Oracle Password Reset FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue : {{ item.key }}

        Per-database results (stdout intentionally omitted -- it may contain
        credentials; see rc and stderr only):
        {% for r in oracle_reset_results.results | default([]) if r.item.0.issue_key == item.key %}
        --- {{ r.item.1 }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ---
        {% if r.rc != 0 %}
        stderr: {{ r.stderr | default('(none)') | trim }}
        {% endif %}
        {% endfor %}

        No temporary password has been issued to the requester.
      dest: "{{ followup_log_dir }}/CDP_{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "6c | Create DBA follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_tag: "CDP"
      fu_original_number: "{{ fu_item.key }}"
      fu_original_sys_id: "{{ snow_cr_map[fu_item.key] }}"
      fu_summary: "DBA repair required: Oracle password reset failed for {{ fu_item.key }}"
      fu_description: |-
        Automated Oracle password reset FAILED in one or more databases and
        the change request has been closed unsuccessful.
        Please investigate and repair, then reset the user's password manually.

        Databases attempted : {{ oracle_reset_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | list | length }}
        Databases failed    : {{ oracle_reset_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | selectattr('rc', 'ne', 0) | list | length }}

        No temporary password was issued to the requester. The per-database
        failure report (rc/stderr only) is attached to this change.
      fu_attach_files:
      - "{{ followup_log_dir }}/CDP_{{ fu_item.key }}_failure_{{ fu_run_ts }}.log"

  # -- 7. Final summary ------------------------------------------------------

  - name: "7 | Build summary outcome lines"
    ansible.builtin.set_fact:
      summary_lines: >-
        {{
          summary_lines | default([]) + [
            '  ' + item.key
            + '   ->   ' + (item.value | upper)
            + '   (Oracle user: '
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='oracle_user')
                | first
                | default('unknown')
              )
            + ')'
          ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "7 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '======================================================',
          '  ServiceNow Oracle Password-Reset Summary',
          '======================================================',
          '  Run timestamp   : ' + ansible_date_time.iso8601,
          '  Changes found   : ' + (snow_work | length | string),
          '  DB resets tried : ' + (oracle_reset_results.results | default([]) | length | string),
          '  DB resets OK    : ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length | string),
          '  DB resets FAILED: ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length | string),
          '  --------------------------------------------------',
          '  Per-issue outcomes:'
        ]
        + (summary_lines | default(['  (none)']))
        + ['======================================================']
      }}
    loop_control:
      label: "summary"
