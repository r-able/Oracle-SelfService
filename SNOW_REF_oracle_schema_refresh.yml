---
# SNOW_REF_oracle_schema_refresh.yml
#
# REWRITTEN (August 2026) for genuine cross-host refreshes, now that the
# demo fleet is two real hosts (lnx001, lnx002) instead of one. The old
# version's Play 2 ran against a single shared `oracle_host` and imported
# from a LOCAL dump file at DIRECTORY=REFRESH - this only ever worked
# because source and target were really just two SERVICES reachable from
# the SAME shared filesystem path, never two genuinely independent hosts.
#
# NEW MECHANISM: Oracle Network Link import (Oracle's own recommended
# pattern for cross-instance refreshes). The target host creates a
# database link back to the source host, then runs a SINGLE
# `impdp ... NETWORK_LINK=...` that pulls data directly over the network
# - no dump file, no expdp step, no file transfer between hosts at all.
# This is simpler than the old two-step expdp/impdp, not more complex.
#
# NEW SPEC FORMAT (replaces both the old "new" and "legacy" formats -
# one format now, used for both same-host and cross-host refreshes):
#   "REF | SRC_HOST:SRC_SERVICE:SRC_SCHEMA=>TGT_HOST:TGT_SERVICE:TGT_SCHEMA"
#   Example (cross-host): "REF | lnx001:PRO:HR=>lnx002:OLTP1_PERF:HR_COPY"
#   Example (same-host):  "REF | lnx001:PRO:HR=>lnx001:UAT:HR_COPY"
#   Both hosts must be present in oracle_instance_map. Host names are
#   also used to resolve each side's real oracle_home/oracle_user, since
#   the two hosts are not assumed to share identical paths (confirmed
#   different from lnx001's in this fleet).
#
# NEEDS VALIDATION before trusting this against a real cross-host run:
#   - This is a first build against the newly-confirmed lnx001<->lnx002
#     TNS connectivity - not yet live-tested end-to-end.
#   - The database link is created and dropped per-job, named uniquely
#     per issue to avoid collision if jobs ever run concurrently in a
#     future version - current sequential loop makes collision unlikely
#     regardless, but the naming is defensive either way.
#
# Required vars (vars/main.yml):
#   oracle_instance_map: { <host>: { oracle_sid, oracle_home, oracle_user }, ... }
#   oracle_dba_user, oracle_dba_pass (unchanged from before)
#   sn_instance, sn_username, sn_password, followup_log_dir
#
# Usage:
#   ansible-playbook SNOW_REF_oracle_schema_refresh.yml --ask-vault-pass

# -- PLAY 1: Ansible controller -- fetch changes, parse the new spec --------
- name: "PLAY 1 | Fetch ServiceNow refresh changes and parse the host-qualified spec"
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  tasks:
  - name: "PRE-FLIGHT | Remove stale outcomes file from any aborted previous run"
    ansible.builtin.file:
      path: /tmp/snow_refresh_outcomes.json
      state: absent

  - name: "0-1 | ServiceNow intake and shepherd for REF"
    ansible.builtin.include_tasks: COMMON_snow_intake.yml
    vars:
      snow_tag: "REF"
      sn_type: "standard"

  - name: "1 | Show 'No Tasks Found' and exit cleanly when queue is empty"
    ansible.builtin.debug:
      msg: "No Tasks Found -- no ServiceNow change requests tagged 'REF |' are ready to execute."
    when: snow_work | length == 0

  - name: "1 | End play gracefully when no work is found"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  - name: "2 | Warn and skip change requests with a missing or invalid refresh spec"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.number }} has an unusable refresh spec
        (short_description: '{{ item.short_description }}') -- skipping.
        Expected 'REF | SRC_HOST:SRC_SERVICE:SRC_SCHEMA=>TGT_HOST:TGT_SERVICE:TGT_SCHEMA'.
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      ref_spec: "{{ item.short_description.split('|')[1:] | join('|') | trim }}"
    when: >-
      '=>' not in ref_spec
      or (ref_spec.split('=>')[0].split(':') | length) != 3
      or (ref_spec.split('=>')[1].split(':') | length) != 3

  - name: "2 | Parse the host-qualified refresh spec"
    ansible.builtin.set_fact:
      refresh_jobs: >-
        {{
          refresh_jobs | default([]) + [{
            'issue_key':      item.number,
            'sys_id':         item.sys_id,
            'raw_spec':       ref_spec,
            'source_host':    ref_src_parts[0] | trim,
            'source_service': ref_src_parts[1] | trim | upper,
            'source_schema':  ref_src_parts[2] | trim | upper,
            'target_host':    ref_tgt_parts[0] | trim,
            'target_service': ref_tgt_parts[1] | trim | upper,
            'target_schema':  ref_tgt_parts[2] | trim | upper
          }]
        }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      ref_spec: "{{ item.short_description.split('|')[1:] | join('|') | trim }}"
      ref_src_parts: "{{ ref_spec.split('=>')[0].split(':') }}"
      ref_tgt_parts: "{{ ref_spec.split('=>')[1].split(':') }}"
    when: >-
      '=>' in ref_spec
      and (ref_spec.split('=>')[0].split(':') | length) == 3
      and (ref_spec.split('=>')[1].split(':') | length) == 3

  - name: "2 | WARN and drop jobs referencing an unknown host"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.issue_key }} references a host not in
        oracle_instance_map (known: {{ oracle_instance_map.keys() | list | join(', ') }}).
        source_host={{ item.source_host }} target_host={{ item.target_host }} -- skipping.
    loop: "{{ refresh_jobs | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      item.source_host not in oracle_instance_map.keys()
      or item.target_host not in oracle_instance_map.keys()

  - name: "2 | Keep only jobs referencing known hosts"
    ansible.builtin.set_fact:
      refresh_jobs: >-
        {{
          refresh_jobs | default([])
          | selectattr('source_host', 'in', oracle_instance_map.keys() | list) | list
          | selectattr('target_host', 'in', oracle_instance_map.keys() | list) | list
        }}

  - name: "2 | Show parsed refresh jobs"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }} -- {{ item.source_host }}:{{ item.source_schema }}@{{ item.source_service }}
        -> {{ item.target_host }}:{{ item.target_schema }}@{{ item.target_service }}
        {{ '(CROSS-HOST)' if item.source_host != item.target_host else '(same host)' }}
    loop: "{{ refresh_jobs | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"

  - name: "2 | Nothing valid to process"
    ansible.builtin.meta: end_play
    when: refresh_jobs | default([]) | length == 0

  - name: "2 | Write refresh job list to temp file for PLAY 2"
    ansible.builtin.copy:
      content: "{{ refresh_jobs | to_json }}"
      dest: "/tmp/snow_refresh_jobs.json"
      mode: '0600'
    no_log: true

# -- PLAY 2: runs once, on the controller, dispatching each job to its own
#    target host via delegate_to (each job's target host can differ) -------
- name: "PLAY 2 | Run each refresh job, on its own target host, via NETWORK_LINK"
  hosts: localhost
  gather_facts: true
  become: false
  vars_files:
  - vars/main.yml

  tasks:

  - name: "PLAY2-INIT | Read refresh job list from controller temp file"
    ansible.builtin.slurp:
      src: "/tmp/snow_refresh_jobs.json"
    register: refresh_jobs_raw

  - name: "PLAY2-INIT | Decode refresh job list"
    ansible.builtin.set_fact:
      refresh_jobs: "{{ refresh_jobs_raw.content | b64decode | from_json }}"

  - name: "3-6 | Execute each refresh job on its own target host"
    ansible.builtin.include_tasks: SNOW_REF_oracle_schema_refresh_job.yml
    loop: "{{ refresh_jobs }}"
    loop_control:
      loop_var: job
      label: >-
        {{ job.issue_key }} | {{ job.source_host }}:{{ job.source_schema }}@{{ job.source_service }}
        => {{ job.target_host }}:{{ job.target_schema }}@{{ job.target_service }}

# -- PLAY 3: Ansible controller -- transition issues (UNCHANGED from before) --
- name: "PLAY 3 | Close change requests based on refresh outcomes"
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  tasks:

  - name: "PLAY3-INIT | Read job outcomes from controller temp file"
    ansible.builtin.slurp:
      src: "/tmp/snow_refresh_outcomes.json"
    register: outcomes_raw

  - name: "PLAY3-INIT | Decode job outcomes"
    ansible.builtin.set_fact:
      refresh_outcomes: "{{ outcomes_raw.content | b64decode | from_json }}"

  - name: "7 | Show outcome per issue"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }} | {{ item.source_host }}:{{ item.source_schema }}@{{ item.source_service }}
        => {{ item.target_host }}:{{ item.target_schema }}@{{ item.target_service }} : {{ item.status | upper }}
    loop: "{{ refresh_outcomes }}"
    loop_control:
      label: "{{ item.issue_key }}"

  - name: "8 | Move SUCCESSFUL changes to review"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: review
    loop: "{{ refresh_outcomes }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.status == 'done'
    failed_when: false

  - name: "8 | Close SUCCESSFUL changes (close_code successful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: closed
      close_code: successful
      close_notes: |-
        Automated Oracle Schema Refresh COMPLETED - {{ ansible_date_time.iso8601 }}
        Spec:   {{ item.raw_spec }}
        Source: {{ item.source_host }}:{{ item.source_schema }}@{{ item.source_service }}
        Target: {{ item.target_host }}:{{ item.target_schema }}@{{ item.target_service }}
        Objects in target schema: {{ item.object_count | default('n/a') }}
        Please verify the refreshed schema before resuming work.
    loop: "{{ refresh_outcomes }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.status == 'done'
    failed_when: false

  - name: "8 | Work-note FAILED changes with the failure summary"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ item.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |-
          Automated Oracle Schema Refresh FAILED - {{ ansible_date_time.iso8601 }}
          Spec:   {{ item.raw_spec }}
          Import: rc={{ item.import_rc | default('n/a') }}
          Error:  {{ item.error | default('see preserved logs') }}
          A DBA repair follow-up change request is being raised.
      status_code: 200
    loop: "{{ refresh_outcomes }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.status == 'failed'
    failed_when: false

  - name: "8 | Close FAILED changes (close_code unsuccessful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: closed
      close_code: unsuccessful
      close_notes: "Automated schema refresh failed; see work notes and the DBA repair follow-up change."
    loop: "{{ refresh_outcomes }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.status == 'failed'
    failed_when: false

  - name: "8b | Create DBA repair follow-up change for FAILED refreshes"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    loop: "{{ refresh_outcomes }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.issue_key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - fu_item.status == 'failed'
    vars:
      fu_tag: "REF"
      fu_original_number: "{{ fu_item.issue_key }}"
      fu_original_sys_id: "{{ fu_item.sys_id }}"
      fu_summary: "schema refresh failed for {{ fu_item.issue_key }} ({{ fu_item.source_host }}:{{ fu_item.source_schema }}@{{ fu_item.source_service }} => {{ fu_item.target_host }}:{{ fu_item.target_schema }}@{{ fu_item.target_service }})"
      fu_description: |-
        Automated Oracle schema refresh FAILED and the change request has been
        closed unsuccessful. Please investigate and repair.

        Spec           : {{ fu_item.raw_spec }}
        Source         : {{ fu_item.source_host }}:{{ fu_item.source_schema }}@{{ fu_item.source_service }}
        Target         : {{ fu_item.target_host }}:{{ fu_item.target_schema }}@{{ fu_item.target_service }}
        Import rc      : {{ fu_item.import_rc | default('n/a') }}
        Error          : {{ fu_item.error | default('See attached log.') }}
      fu_attach_files: "{{ [fu_item.failure_log | default(''), fu_item.backup_export_log | default('')] | select() | list }}"

  - name: "9 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '======================================================',
          '  Oracle Schema Refresh Summary (cross-host capable)',
          '======================================================',
          '  Run timestamp : ' + ansible_date_time.iso8601,
          '  Issues found  : ' + (refresh_outcomes | length | string),
          '  Succeeded     : ' + (refresh_outcomes | selectattr('status','equalto','done')   | list | length | string),
          '  Failed        : ' + (refresh_outcomes | selectattr('status','equalto','failed') | list | length | string),
          '  --------------------------------------------------'
        ]
        + (refresh_outcomes | map(attribute='issue_key') | zip(
             refresh_outcomes | map(attribute='status')
           ) | map('join', '   ->   ') | map('regex_replace', '^', '  ') | list)
        + ['======================================================']
      }}
    loop_control:
      label: "summary"

  - name: "9 | Clean up temp files on controller"
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
    - "/tmp/snow_refresh_jobs.json"
    - "/tmp/snow_refresh_outcomes.json"
    loop_control:
      label: "{{ item | basename }}"
