---
# SNOW_CDPPG_reset_postgres_password.yml
#
# PILOT: PostgreSQL (Aurora/RDS) equivalent of SNOW_CDP_reset_own_oracle_password.yml
# Uses a DISTINCT tag (CDPPG, not CDP) so this cannot collide with or affect
# the already-hardened, production Oracle CDP project in any way.
#
# GENUINE ARCHITECTURAL DIFFERENCES FROM THE ORACLE VERSION (read before use):
#
#   1. PostgreSQL ROLES ARE CLUSTER-WIDE, NOT PER-DATABASE.
#      Oracle: each PDB has its own separate set of users - CDP loops over
#      (user x database) pairs and resets the password separately in each.
#      PostgreSQL: a role exists once for the WHOLE cluster/instance and is
#      shared across every database in it. Resetting a role's password is a
#      SINGLE ALTER ROLE call per cluster, not per-database-within-a-cluster.
#      This version therefore loops over (user x ENVIRONMENT) pairs, where
#      each environment is a separate Aurora/RDS cluster endpoint - NOT
#      (user x database-inside-one-cluster) the way Oracle's PDB model needed.
#
#   2. NO SHARED HOST - each environment has ITS OWN endpoint.
#      The Oracle version has one oracle_host shared by every environment
#      (each is just a different PDB/service name on the SAME physical CDB).
#      Aurora/RDS environments are normally entirely separate cluster
#      resources with distinct endpoint hostnames. pg_environments below is
#      therefore a dict of independent {endpoint, port, dbname, master_user,
#      master_pass} blocks, not a shared host + a list of names.
#
#   3. The Aurora/RDS "master user" is NOT true PostgreSQL superuser.
#      RDS/Aurora grants the master user the rds_superuser role, which is
#      sufficient to ALTER ROLE on ordinary application roles (this works
#      fine for the CNU-provisioned users this project resets), but is not
#      identical to self-managed PostgreSQL's real superuser. Nothing here
#      requires anything beyond what rds_superuser already grants.
#
#   4. Username convention: PostgreSQL folds unquoted identifiers to
#      LOWERCASE by convention (unlike Oracle's upper-case default). This
#      version generates lower-case usernames ("vgrigorian", not
#      "VGRIGORIAN") to match normal PostgreSQL/RDS practice - flag this
#      explicitly if your existing PG roles were provisioned upper-case.
#
#   5. Safer SQL construction. Oracle's version builds the ALTER USER
#      statement via an f-string (values come from generated env vars, not
#      raw user input, so it's safe there, but still worth improving). This
#      version uses psycopg2's sql.Identifier/sql.Literal composition
#      instead, which is the idiomatic, injection-safe way to build dynamic
#      DDL with psycopg2.
#
# NOT YET DONE (deliberately out of scope for this pilot):
#   * AWS Secrets Manager integration for master credentials (currently
#     vault-encrypted plain vars, matching the existing Oracle pattern, for
#     consistency in this first pilot - Secrets Manager would be the more
#     cloud-native follow-up once this is validated).
#   * IAM database authentication as an alternative to master-user/password.
#
# Required vars (vars/main.yml -- vault-encrypt sensitive values):
#   sn_instance, sn_username, sn_password
#   pg_environments:
#     DEV:
#       endpoint: "dev-cluster.cluster-xxxxxxxx.us-east-1.rds.amazonaws.com"
#       port: 5432
#       dbname: "postgres"        # any DB you can connect to - ALTER ROLE
#                                  # does not require connecting to a
#                                  # specific user database
#       master_user: "pgadmin"
#       master_pass: !vault |
#         ...
#     UAT: { ... }
#     ...
#
# Requirements:
#   pip install psycopg2-binary          # or psycopg[binary] for psycopg3
#
# Usage:
#   ansible-playbook SNOW_CDPPG_reset_postgres_password.yml --ask-vault-pass

- name: "ServiceNow -> Parse change -> Reset PostgreSQL (Aurora/RDS) password in all environments -> Close change"
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    issue_outcomes: {} # { "CHG0012345": "done" | "failed" }

  tasks:

  # -- PRE-FLIGHT + intake ----------------------------------------------------
  - name: "0-1 | ServiceNow intake and shepherd for CDPPG"
    ansible.builtin.include_tasks: COMMON_snow_intake.yml
    vars:
      snow_tag: "CDPPG"
      sn_type: "standard"

  - name: "1 | Abort if no work found"
    ansible.builtin.debug:
      msg: "No ServiceNow change requests tagged 'CDPPG |' are ready to execute. Exiting cleanly."
    when: snow_work | length == 0

  - name: "1 | End play gracefully when queue is empty"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  # Parse "CDPPG | Full Name" from short_description.
  # PostgreSQL username convention: first letter of first name + entire
  # last name, LOWER-cased ("Vlad Grigorian" -> "vgrigorian") - matches
  # normal PostgreSQL/RDS practice (unquoted identifiers fold to lower
  # case), unlike Oracle's upper-case convention. Single-word names are
  # used as-is, lower-cased. Spaces are never valid in a role name.
  - name: "2 | WARN and skip changes with a missing user name"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.number }} has no user name after the tag
        (short_description: '{{ item.short_description }}') -- skipping.
        Expected 'CDPPG | Full Name'.
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_name: "{{ item.short_description.split('|')[1] | default('') | trim }}"
    when: cdp_name | length == 0

  - name: "2 | Build change -> PostgreSQL role mapping"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([]) + [{
            'issue_key':    item.number,
            'sys_id':       item.sys_id,
            'display_name': cdp_name,
            'pg_role': (
              (cdp_name.split(' ')[0][0] + cdp_name.split(' ')[-1])
              if (cdp_name.split(' ') | length) > 1
              else cdp_name
            ) | lower
          }]
        }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_name: "{{ item.short_description.split('|')[1] | default('') | trim }}"
    when: cdp_name | length > 0

  - name: "2 | Show reporter -> PostgreSQL role mapping"
    ansible.builtin.debug:
      msg: "{{ item.issue_key }} -> PostgreSQL role: {{ item.pg_role }} | environments: {{ pg_environments.keys() | list | join(', ') }}"
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # -- 3. Generate one random password per issue -----------------------------
  # One password per issue, applied across every environment (same model as
  # the Oracle version - one credential set for the user regardless of which
  # cluster they're connecting to).

  - name: "3 | Generate random password for each PostgreSQL role"
    ansible.builtin.shell:
      cmd: |
        upper=$(tr -dc 'A-Z'    </dev/urandom | head -c 1)
        lower=$(tr -dc 'a-z'    </dev/urandom | head -c 1)
        digit=$(tr -dc '0-9'    </dev/urandom | head -c 1)
        spec=$(tr  -dc '@#$%'   </dev/urandom | head -c 1)
        rest=$(tr  -dc 'A-Za-z0-9@#$%' </dev/urandom | head -c 12)
        pw="${upper}${lower}${digit}${spec}${rest}"
        echo "$pw" | fold -w1 | shuf | tr -d '\n'
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.pg_role }}"
    register: generated_passwords
    no_log: true

  - name: "3 | Attach generated password to each issue entry"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([])
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [ item.item | combine({ 'new_password': item.stdout }) ]
        }}
    loop: "{{ generated_passwords.results }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.pg_role }}"
    no_log: true

  # -- 4. Reset the password in EVERY environment (cluster) -------------------
  # product() builds every (issue, environment) pair. Unlike Oracle's
  # (issue, database) pairing, "environment" here IS the unit of separation -
  # each is an independent cluster with its own role namespace, connection
  # endpoint and master credentials.

  - name: "4 | Reset PostgreSQL role password in each environment"
    ansible.builtin.shell:
      cmd: |
        python3 - << 'PYEOF'
        import sys, os
        import psycopg2
        from psycopg2 import sql

        host        = os.environ["PG_HOST"]
        port        = os.environ["PG_PORT"]
        dbname      = os.environ["PG_DBNAME"]
        master_user = os.environ["PG_MASTER_USER"]
        master_pass = os.environ["PG_MASTER_PASS"]
        target_role = os.environ["PG_TARGET_ROLE"]
        new_pass    = os.environ["PG_NEW_PASS"]
        env_name    = os.environ["PG_ENV_NAME"]

        try:
            conn = psycopg2.connect(
                host=host, port=port, dbname=dbname,
                user=master_user, password=master_pass,
                connect_timeout=10,
            )
        except Exception as e:
            print(f"ERROR: [{env_name}] Could not connect to PostgreSQL "
                  f"endpoint '{host}:{port}/{dbname}': {e}", file=sys.stderr)
            sys.exit(1)

        conn.autocommit = True
        cur = conn.cursor()

        # Verify the target role exists in THIS cluster before resetting.
        # Roles are cluster-wide, so this check is meaningful once per
        # environment, not once per database within it.
        cur.execute(
            "SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = %s",
            (target_role,)
        )
        if cur.fetchone() is None:
            print(f"ERROR: [{env_name}] PostgreSQL role '{target_role}' "
                  f"does not exist in this cluster.", file=sys.stderr)
            sys.exit(1)

        # ALTER ROLE does not support bind variables for the role name or
        # the password literal - psycopg2.sql safely quotes/escapes both,
        # which is the idiomatic-safe way to build this statement (values
        # come from generated env vars, not raw user input, either way).
        stmt = sql.SQL("ALTER ROLE {} WITH PASSWORD {}").format(
            sql.Identifier(target_role),
            sql.Literal(new_pass),
        )
        cur.execute(stmt)
        print(f"OK: [{env_name}] password reset for {target_role}")
        cur.close()
        conn.close()
        PYEOF
    environment:
      PG_HOST: "{{ pg_environments[item.1].endpoint }}"
      PG_PORT: "{{ pg_environments[item.1].port | string }}"
      PG_DBNAME: "{{ pg_environments[item.1].dbname }}"
      PG_MASTER_USER: "{{ pg_environments[item.1].master_user }}"
      PG_MASTER_PASS: "{{ pg_environments[item.1].master_pass }}"
      PG_TARGET_ROLE: "{{ item.0.pg_role }}"
      PG_NEW_PASS: "{{ item.0.new_password }}"
      PG_ENV_NAME: "{{ item.1 }}"
    loop: "{{ issues_to_reset | default([]) | product(pg_environments.keys() | list) | list }}"
    loop_control:
      label: "{{ item.0.issue_key }} | {{ item.0.pg_role }} -> {{ item.1 }}"
    register: pg_reset_results
    ignore_errors: true
    no_log: true # keeps master password and new password out of Ansible logs

  # -- 4b. Show sanitised per-environment outcome (no passwords) ------------

  - name: "4b | Show password-reset outcome per issue per environment"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.0.issue_key }} | {{ item.item.0.pg_role }} -> {{ item.item.1 }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }} {% if item.rc != 0 %}| stderr: {{ item.stderr | default('(none)') | trim }}{% endif %}
    loop: "{{ pg_reset_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.0.issue_key }} / {{ item.item.1 }}"

  # -- 5. Post temporary password as a work note (all-success only) ---------

  - name: "5 | Post new temporary password as a work note (all environments succeeded)"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ item.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |
          Automated PostgreSQL (Aurora/RDS) password reset completed successfully in all environments.

          PostgreSQL Role     : {{ item.pg_role }}
          Temporary Password  : {{ item.new_password }}
          Environments        : {{ pg_environments.keys() | list | join(', ') }}
          Reset By            : {{ sn_username }} (Ansible automation)
          Timestamp           : {{ ansible_date_time.iso8601 }}

          Please change this password immediately after your first login.
          Do not share this password.
      status_code: 200
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        pg_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0
    register: cdppg_password_note
    no_log: true
    ignore_errors: true

  - name: "5 | WARN if the password work note could not be posted"
    ansible.builtin.debug:
      msg: >-
        WARNING: the temporary password work note failed to post for one or
        more changes. The password reset itself succeeded, but the requester
        will not see the new password on the change. Check sn_instance /
        credentials and the change sys_id.
    when: cdppg_password_note is defined and (cdppg_password_note.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0)

  # -- 6. Compute per-issue outcome and transition ---------------------------

  - name: "6 | Mark issues DONE (all environments succeeded)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'done' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        pg_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0

  - name: "6 | Mark issues FAILED (one or more environments failed)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'failed' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        pg_reset_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) > 0

  - name: "6 | Move SUCCESSFUL changes to review"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: review
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Close SUCCESSFUL changes (close_code successful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: closed
      close_code: successful
      close_notes: |-
        Automated PostgreSQL (Aurora/RDS) password reset COMPLETED in all environments - {{ ansible_date_time.iso8601 }}
        The temporary password is in the work notes on this change.
        Please change it immediately after first login.
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Post failure work note and close FAILED changes"
    block:
    - name: "6a | Post failure work note (per-environment breakdown)"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ snow_cr_map[item.key] }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            Automated PostgreSQL password reset FAILED in one or more environments.

            Per-environment outcome:
            {% for r in pg_reset_results.results | default([])
                  if r.item.0.issue_key == item.key %}
            * {{ r.item.1 }}: {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }}
            {% endfor %}

            No temporary password has been issued. A DBA repair follow-up
            change request is being raised.

            Timestamp: {{ ansible_date_time.iso8601 }}
        status_code: 200
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      ignore_errors: true
    - name: "6b | Close FAILED changes (close_code unsuccessful)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ snow_cr_map[item.key] }}"
        state: closed
        close_code: unsuccessful
        close_notes: "Automated PostgreSQL password reset failed; see work notes and the DBA repair follow-up change. No temporary password was issued."
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      failed_when: false

  - name: "6c | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: snow_followup_enabled | default(true) | bool

  - name: "6c | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - snow_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "6c | Write failure report per FAILED issue (no stdout -- may contain credentials)"
    ansible.builtin.copy:
      content: |
        Automated PostgreSQL (Aurora/RDS) Password Reset FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue : {{ item.key }}

        Per-environment results (stdout intentionally omitted -- it may
        contain credentials; see rc and stderr only):
        {% for r in pg_reset_results.results | default([]) if r.item.0.issue_key == item.key %}
        --- {{ r.item.1 }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ---
        {% if r.rc != 0 %}
        stderr: {{ r.stderr | default('(none)') | trim }}
        {% endif %}
        {% endfor %}

        No temporary password has been issued to the requester.
      dest: "{{ followup_log_dir }}/CDPPG_{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "6c | Create DBA follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_tag: "CDPPG"
      fu_original_number: "{{ fu_item.key }}"
      fu_original_sys_id: "{{ snow_cr_map[fu_item.key] }}"
      fu_summary: "DBA repair required: PostgreSQL password reset failed for {{ fu_item.key }}"
      fu_description: |-
        Automated PostgreSQL (Aurora/RDS) password reset FAILED in one or
        more environments and the change request has been closed
        unsuccessful. Please investigate and repair, then reset the user's
        password manually.

        Environments attempted : {{ pg_reset_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | list | length }}
        Environments failed    : {{ pg_reset_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | selectattr('rc', 'ne', 0) | list | length }}

        No temporary password was issued to the requester. The per-environment
        failure report (rc/stderr only) is attached to this change.
      fu_attach_files:
      - "{{ followup_log_dir }}/CDPPG_{{ fu_item.key }}_failure_{{ fu_run_ts }}.log"

  # -- 7. Final summary --------------------------------------------------

  - name: "7 | Build summary outcome lines"
    ansible.builtin.set_fact:
      summary_lines: >-
        {{
          summary_lines | default([]) + [
            '  ' + item.key
            + '   ->   ' + (item.value | upper)
            + '   (PostgreSQL role: '
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='pg_role')
                | first
                | default('unknown')
              )
            + ')'
          ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "7 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '======================================================',
          '  ServiceNow PostgreSQL (Aurora/RDS) Password-Reset Summary',
          '======================================================',
          '  Run timestamp    : ' + ansible_date_time.iso8601,
          '  Changes found    : ' + (snow_work | length | string),
          '  Resets tried     : ' + (pg_reset_results.results | default([]) | length | string),
          '  Resets OK        : ' + (pg_reset_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length | string),
          '  Resets FAILED    : ' + (pg_reset_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length | string),
          '  --------------------------------------------------',
          '  Per-issue outcomes:'
        ]
        + (summary_lines | default(['  (none)']))
        + ['======================================================']
      }}
    loop_control:
      label: "summary"
