---
# =============================================================================
# SNOW_UPG_oracle_upgrade.yml
#
# ServiceNow-driven Oracle 21c -> 26ai upgrade dispatcher (AutoUpgrade).
#
# Reference procedure:
#   https://oracle-base.com/articles/26/multitenant-upgrade-to-26-autoupgrade
#
# Flow:
#   1. Pre-flight check that the 26ai software home exists on the DB host.
#   2. ServiceNow intake + shepherd: find "UPG | ..." change requests ready
#      to execute (COMMON_snow_intake.yml).
#   3. For each issue, include SNOW_UPG_oracle_upgrade_job.yml which runs the
#      full analyze -> deploy -> verify cycle and transitions the change.
#
# CHANGE REQUEST FORMAT
#   short_description:  UPG | <host> | <ORACLE_SID>
#   e.g.                UPG | lnx001 | CDB1
#
#   The ORACLE_SID for each job is parsed from short_description field index
#   [2] (the third pipe-delimited field, after the tag and the host). Falls
#   back to default_oracle_sid if no match. NOTE: SID case matters on
#   Linux and is used verbatim -- the rebuilt lnx001 runs uppercase CDB1, so
#   the CR must carry the exact case (e.g. "UPG | lnx001 | CDB1").
# =============================================================================

- name: ServiceNow-driven Oracle 21c to 26ai upgrades via AutoUpgrade
  hosts: localhost
  gather_facts: false

  vars_files:
  - vars/main.yml

  tasks:

  # -------------------------------------------------------------------------
  # 0. Pre-flight: confirm the 26ai software is actually installed before
  #    doing any ServiceNow work.
  # -------------------------------------------------------------------------
  - name: "PRE | Check 26ai Oracle home exists on {{ oracle_host }}"
    ansible.builtin.stat:
      path: "{{ oracle_target_home }}/bin/sqlplus"
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: oracle
    register: target_home_check

  - name: "PRE | Assert 26ai home is installed"
    ansible.builtin.assert:
      that:
      - target_home_check.stat.exists
      fail_msg: >-
        26ai software home not found at {{ oracle_target_home }} on {{ oracle_host }}. Install the 26ai software first (runInstaller -silent, software-only) and ensure the oracle-ai-database-preinstall-26ai package has been applied.

  - name: "PRE | Check autoupgrade.jar exists in 26ai home"
    ansible.builtin.stat:
      path: "{{ autoupgrade_jar }}"
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: oracle
    register: autoupgrade_jar_check

  - name: "PRE | Assert autoupgrade.jar is present"
    ansible.builtin.assert:
      that:
      - autoupgrade_jar_check.stat.exists
      fail_msg: >-
        {{ autoupgrade_jar }} not found. It ships with the 26ai home; if it was removed, download the latest from https://download.oracle.com/otn-pub/otn_software/autoupgrade.jar into {{ oracle_target_home }}/rdbms/admin/.

  # ServiceNow intake + shepherd: finds "UPG | ..." change requests,
  # promotes eligible new ones to implement, returns snow_work.
  - name: "PRE | ServiceNow intake and shepherd for UPG"
    ansible.builtin.include_tasks: COMMON_snow_intake.yml
    vars:
      snow_tag: "UPG"
      sn_type: "normal"

  - name: "PRE | Nothing to do?"
    ansible.builtin.debug:
      msg: "No ServiceNow change requests tagged 'UPG |' are ready to execute. Exiting."
    when: snow_work | length == 0

  - name: "PRE | End play when queue is empty"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  # Parse "UPG | <host> | <SID>" from short_description. split('|') gives
  # [0]=tag, [1]=host, [2]=SID - index [2] is the SID field, NOT [1] (that's
  # the host). Falls back to default_oracle_sid when no SID token is
  # present after the host.
  - name: "PRE | Build upgrade job list from change requests"
    ansible.builtin.set_fact:
      upg_jobs: >-
        {{ upg_jobs | default([]) + [ {
             'issue_key':  item.number,
             'sys_id':     item.sys_id,
             'summary':    item.short_description,
             'oracle_sid': (item.short_description.split('|')[2] | default('')
                            | trim | regex_search('[A-Za-z0-9_$]+')
                            | default(default_oracle_sid, true))
           } ] }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"

  - name: "PRE | Upgrade jobs queued"
    ansible.builtin.debug:
      msg: "{{ upg_jobs | map(attribute='issue_key') | zip(upg_jobs | map(attribute='oracle_sid')) | list }}"
  # -------------------------------------------------------------------------
  - name: "JOB | Dispatch upgrade job per issue"
    ansible.builtin.include_tasks: SNOW_UPG_oracle_upgrade_job.yml
    loop: "{{ upg_jobs | default([]) }}"
    loop_control:
      loop_var: job
      label: "{{ job.issue_key }} ({{ job.oracle_sid }})"
