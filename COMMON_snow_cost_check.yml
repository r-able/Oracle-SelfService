---
# COMMON_snow_cost_check.yml
#
# Generic budget/cost gate, callable by any project that has a genuine
# cost driver. Implements the exact threshold specified:
#
#   needs_cost_approval = (onetime_cost > $10)
#                         OR (monthly_cost > $1 AND duration_months > 6)
#
# If the threshold is NOT crossed, this is a complete no-op - the caller
# proceeds exactly as it does today, no new friction for the 6+ projects
# that have no real cost implication.
#
# If the threshold IS crossed: first encounter creates a u_cost_approval
# record (status=pending_approval) and reports the gate as NOT clear.
# Later passes check whether a human has since approved it. Same
# "create on first encounter, poll for satisfaction on later passes"
# shape as COMMON_orchestration_gate_check.yml - deliberately consistent
# with the orchestration core's own gate pattern, since this is
# conceptually the same kind of gate applied to a different dimension
# (budget, not task dependency).
#
# Required vars from the caller:
#   cost_primary_key       : the CR's number, e.g. CHG0033140
#   cost_project_tag       : e.g. "UPG"
#   cost_description       : human-readable driver, e.g.
#                             "300GB additional mount point for
#                              out-of-place upgrade clone"
#   cost_onetime            : estimated one-time expense (number, 0 if none)
#   cost_monthly            : estimated recurring monthly expense (0 if none)
#   cost_duration_months    : months the recurring cost continues (0 if
#                             one-time only)
#
# Sets on return:
#   cost_gate_clear : true if no approval was needed, OR approval has
#                     been granted. false if a new request was just
#                     created, or an existing one is still pending/was
#                     rejected.

- name: "COST-GATE | {{ cost_primary_key }} | Evaluate whether this cost crosses the approval threshold"
  ansible.builtin.set_fact:
    cost_threshold_crossed: >-
      {{
        (cost_onetime | float > 10)
        or (cost_monthly | float > 1 and cost_duration_months | int > 6)
      }}

- name: "COST-GATE | {{ cost_primary_key }} | No cost approval needed - gate is clear"
  ansible.builtin.set_fact:
    cost_gate_clear: true
  when: not cost_threshold_crossed

- name: "COST-GATE | {{ cost_primary_key }} | Check for an existing cost approval record"
  ansible.builtin.uri:
    url: >-
      {{ sn_instance }}/api/now/table/u_cost_approval?sysparm_query={{
        ('u_change_number=' + cost_primary_key) | urlencode
      }}&sysparm_fields=sys_id,u_status&sysparm_limit=1
    method: GET
    user: "{{ sn_username }}"
    password: "{{ sn_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: cost_lookup
  when: cost_threshold_crossed
  failed_when: false

- name: "COST-GATE | {{ cost_primary_key }} | No existing record - create one and request approval"
  when:
  - cost_threshold_crossed
  - (cost_lookup.json.result | default([])) | length == 0
  block:

  - name: "COST-GATE | Insert the cost approval record"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_cost_approval"
      method: POST
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        u_change_number: "{{ cost_primary_key }}"
        u_project_tag: "{{ cost_project_tag }}"
        u_description: "{{ cost_description }}"
        u_onetime_cost: "{{ cost_onetime }}"
        u_monthly_cost: "{{ cost_monthly }}"
        u_duration_months: "{{ cost_duration_months }}"
        u_status: "pending_approval"
      status_code: 201

  - name: "COST-GATE | Post a work note flagging the cost estimate"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ snow_cr_map[cost_primary_key] }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |
          BUDGET APPROVAL REQUIRED before this change can proceed.

          Estimated cost: {{ cost_description }}
          One-time: ${{ cost_onetime }}
          {% if cost_monthly | float > 0 %}
          Recurring: ${{ cost_monthly }}/month for {{ cost_duration_months }} months
          {% endif %}

          This change is BLOCKED until a budget owner approves the cost
          estimate in the Cost Approval record for this change.
      status_code: 200
    failed_when: false

  - name: "COST-GATE | Just created the request - gate is NOT clear this pass"
    ansible.builtin.set_fact:
      cost_gate_clear: false

- name: "COST-GATE | {{ cost_primary_key }} | Existing record found - check its status"
  when:
  - cost_threshold_crossed
  - (cost_lookup.json.result | default([])) | length > 0
  block:

  - name: "COST-GATE | Record the approval status"
    ansible.builtin.set_fact:
      cost_approval_status: "{{ cost_lookup.json.result[0].u_status }}"

  - name: "COST-GATE | Approved - gate is clear"
    ansible.builtin.set_fact:
      cost_gate_clear: true
    when: cost_approval_status == 'approved'

  - name: "COST-GATE | Still pending or rejected - gate remains closed"
    ansible.builtin.set_fact:
      cost_gate_clear: false
    when: cost_approval_status != 'approved'

  - name: "COST-GATE | WARN if the cost estimate was rejected"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ cost_primary_key }}'s cost estimate (${{ cost_onetime }}
        one-time{% if cost_monthly | float > 0 %} + ${{ cost_monthly }}/mo{% endif %})
        was REJECTED by the budget owner. This change will remain blocked
        until a revised estimate is submitted and approved.
    when: cost_approval_status == 'rejected'

- name: "COST-GATE | {{ cost_primary_key }} | Result"
  ansible.builtin.debug:
    msg: "cost_gate_clear = {{ cost_gate_clear }}{{ ' (no cost driver)' if not cost_threshold_crossed else '' }}"
