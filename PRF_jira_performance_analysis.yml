---
# PRF_jira_performance_analysis.yml
# Released under the MIT license. Copyright (c) 2026, Vlad von Grigorian <
#
# Jira-driven Oracle AWR performance analysis + SQL Tuning Advisor.
# Direct port of SNOW_PRF_performance_analysis.yml + _job.yml into Jira
# idioms, following the same dispatcher + per-issue-job-include shape (like
# REF/PAT/UPG) rather than PDB's stricter 3-play split, since PRF's own
# SNOW version already interleaves ServiceNow API calls with per-task
# delegate_to Oracle work inside a single play -- Jira's community.general.
# jira/ansible.builtin.uri calls are equally happy staying on localhost by
# default, so the same shape ports over directly.
#
# FLOW
#   1. Shepherd + search: To Do -> Pending Approval -> In Progress (same
#      uniform approval gate every Jira project uses -- there is no
#      "no-approval" bypass in the Jira suite the way SNOW has sn_type;
#      approval is handled once, generically, by COMMON_jira_shepherd_statuses.yml).
#      This stage is READ-ONLY analysis only: an AWR report plus a SQL
#      Tuning Advisor execute_tuning_task run, which only produces ADVICE -
#      it never applies anything to the database.
#   2. Parse host/ORACLE_SID/start-end date-time from custom fields.
#   3. Per issue (PRF_jira_performance_analysis_job.yml):
#      resolve start/end date-time into bracketing AWR snapshot IDs ->
#      AWR text report -> top-5 CPU SQL_IDs from DBA_HIST_SQLSTAT (CON_ID-
#      filtered to the target PDB) -> SQL Tuning Advisor per SQL_ID ->
#      attach evidence -> comment -> transition Done/Failed -> on success
#      with recommendations, open a SEPARATE implementation follow-up task
#      requiring normal approval; on total failure, open a DBA repair
#      follow-up instead.
#
# NOTE: the four custom field IDs below (prf_host_field, prf_sid_field,
# prf_start_field, prf_end_field) are PLACEHOLDER assumptions following the
# CAU/PAT/DDP/PDB pattern. Confirm the real field IDs in the actual PRF
# project and update vars/main.yml.
#
# Required vars (vars/main.yml -- vault-encrypt sensitive values):
#   # Jira
#   jira_url, jira_user, jira_api_token, jira_cloud
#   jira_jql_prf        : "project = PRF AND status = 'In Progress'"
#   jira_max_results, jira_status_done, jira_status_failed
#   prf_host_field      : "customfield_10770"   # select/text: target host
#   prf_sid_field        : "customfield_10771"   # text: ORACLE_SID / PDB name
#   prf_start_field      : "customfield_10772"   # datetime: issue period start
#   prf_end_field        : "customfield_10773"   # datetime: issue period end
#
#   # Oracle (per-host lookup, same shape as SNOW's oracle_instance_map)
#   oracle_instance_map: { lnx001: { oracle_sid: CDB1, oracle_home: ...,
#                                     oracle_user: oracle }, ... }
#
#   # Follow-up
#   jira_followup_enabled, followup_log_dir
#
# Usage:
#   ansible-playbook PRF_jira_performance_analysis.yml --ask-vault-pass

- name: Jira-driven Oracle AWR performance analysis
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  tasks:

  - name: "PRE-FLIGHT | Validate Jira API token via /rest/api/2/myself"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/myself"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      status_code: 200
      return_content: true
    register: jira_auth_check
    no_log: true

  - name: "PRE-FLIGHT | Confirm authenticated identity"
    ansible.builtin.debug:
      msg: >-
        Jira authentication OK -- connected as '{{ jira_auth_check.json.displayName }}' ({{ jira_auth_check.json.emailAddress }})

  - name: "PRE | Shepherd PRF intake queue toward '{{ jira_status_in_progress }}'"
    ansible.builtin.include_tasks: COMMON_jira_shepherd_statuses.yml
    vars:
      shepherd_project: "PRF"

  - name: "PRE | Search Jira for PRF issues ready to execute"
    ansible.builtin.uri:
      url: >-
        {{ jira_url }}/rest/api/3/search/jql?jql={{
          jira_jql_prf | urlencode
        }}&fields=status,{{ prf_host_field }},{{ prf_sid_field }},{{ prf_start_field }},{{ prf_end_field }}&maxResults={{ jira_max_results }}
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: jira_search
    failed_when: false

  - name: "PRE | Collect issues found"
    ansible.builtin.set_fact:
      prf_all: "{{ jira_search.json.issues | default([]) }}"

  - name: "PRE | Nothing to do?"
    ansible.builtin.debug:
      msg: "No Jira issues tagged PRF are ready to execute. Exiting."
    when: prf_all | length == 0

  - name: "PRE | End play when queue is empty"
    ansible.builtin.meta: end_play
    when: prf_all | length == 0

  # Date-times are expected as "YYYY-MM-DD HH:MM:SS" -- verify this matches
  # the real custom field's serialization on first live submission, same
  # caveat the SNOW version carries for its Date/Time variable.
  - name: "PRE | Build job list from Jira issues"
    ansible.builtin.set_fact:
      prf_jobs: >-
        {{ prf_jobs | default([]) + [ {
             'issue_key':   item.key,
             'target_host': (item.fields[prf_host_field] | default('') | trim),
             'oracle_sid':  (item.fields[prf_sid_field] | default('') | trim | upper),
             'start_dt':    (item.fields[prf_start_field] | default('') | trim),
             'end_dt':      (item.fields[prf_end_field] | default('') | trim)
           } ] }}
    loop: "{{ prf_all }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "PRE | WARN about issues with an unusable spec"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.issue_key }} has an unusable spec - expected a
        host, ORACLE_SID/PDB, and start/end date-times like
        '2026-02-21 21:02:00'. Got host='{{ item.target_host }}'
        sid='{{ item.oracle_sid }}' start_dt='{{ item.start_dt }}'
        end_dt='{{ item.end_dt }}'. Skipping - check prf_host_field/
        prf_sid_field/prf_start_field/prf_end_field in vars/main.yml
        against the real custom field IDs.
    loop: "{{ prf_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      item.target_host | length == 0
      or item.oracle_sid | length == 0
      or item.start_dt is not match('^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$')
      or item.end_dt is not match('^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$')

  - name: "PRE | Keep only jobs with a usable spec"
    ansible.builtin.set_fact:
      prf_jobs: >-
        {{ prf_jobs
           | selectattr('target_host', 'ne', '') | list
           | selectattr('oracle_sid', 'ne', '') | list
           | selectattr('start_dt', 'match', '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$') | list
           | selectattr('end_dt', 'match', '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$') | list }}

  - name: "PRE | Nothing valid to process"
    ansible.builtin.meta: end_play
    when: prf_jobs | length == 0

  - name: "PRE | Jobs queued"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }} -- analyze {{ item.oracle_sid }} on
        {{ item.target_host }}, period {{ item.start_dt }} -> {{ item.end_dt }}
    loop: "{{ prf_jobs }}"
    loop_control:
      label: "{{ item.issue_key }}"

  - name: "JOB | Dispatch performance analysis per issue"
    ansible.builtin.include_tasks: PRF_jira_performance_analysis_job.yml
    loop: "{{ prf_jobs }}"
    loop_control:
      loop_var: job
      label: "{{ job.issue_key }} ({{ job.oracle_sid }})"
