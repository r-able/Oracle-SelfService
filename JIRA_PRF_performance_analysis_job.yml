---
# JIRA_PRF_performance_analysis_job.yml
# Released under the MIT license. Copyright (c) 2026, Vlad von Grigorian <
#
# Ported from SNOW_PRF_performance_analysis_job.yml - the Oracle-side logic
# (snapshot resolution, AWR report, top-5 CPU SQL query, SQL Tuning
# Advisor) is unchanged. Only the evidence delivery and outcome-posting are
# Jira-native: real file attachments (fetched from the target host, then
# uploaded via Jira's multipart attachment endpoint) instead of ServiceNow
# attachment API calls, and a Jira comment instead of a work note.
#
# Included per job by JIRA_PRF_performance_analysis.yml. Loop variable:
# `job` (issue_key, target_host, oracle_sid [PDB name], oracle_home,
#  oracle_user, cdb_sid, start_dt, end_dt).

- name: "JOB | {{ job.issue_key }} | Set per-job facts"
  ansible.builtin.set_fact:
    prf_work_dir: "/tmp/jira_prf_run/{{ job.oracle_sid }}_{{ job.issue_key }}"
    prf_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    prf_success: true
    prf_fail_reason: ""
    prf_top_sql: []
    prf_recommendations: []

- name: "JOB | {{ job.issue_key }} | Post 'analysis started' comment"
  community.general.jira:
    uri: "{{ jira_url }}"
    username: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    operation: comment
    issue: "{{ job.issue_key }}"
    comment: >-
      PRF: AWR performance analysis started for {{ job.oracle_sid }} on
      {{ job.target_host }}, issue period {{ job.start_dt }} -> {{ job.end_dt }}.
    cloud: "{{ jira_cloud }}"
  failed_when: false

# -----------------------------------------------------------------
# Working directory - the leaf directory must be world-writable (0777) for
# oracle to create files in it, and the base directory must exist too,
# since every ancestor needs traversal permission.
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Ensure base working directory exists"
  ansible.builtin.file:
    path: "/tmp/jira_prf_run"
    state: directory
    mode: '0755'
  delegate_to: "{{ job.target_host }}"
  become: true

- name: "JOB | {{ job.issue_key }} | Ensure per-job working directory exists and is writable"
  ansible.builtin.file:
    path: "{{ prf_work_dir }}"
    state: directory
    mode: '0777'
  delegate_to: "{{ job.target_host }}"
  become: true

# -----------------------------------------------------------------
# 0. Resolve the given start/end date-time into the bracketing AWR
#    snapshot IDs. begin_snap = last snapshot AT OR BEFORE the start time;
#    end_snap = first snapshot AT OR AFTER the end time, so the resolved
#    range fully brackets the requested period.
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Write snapshot-resolution SQL"
  ansible.builtin.copy:
    dest: "{{ prf_work_dir }}/resolve_snapshots.sql"
    mode: '0644'
    content: |
      SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO OFF LINESIZE 200 TRIMSPOOL ON
      WHENEVER SQLERROR EXIT SQL.SQLCODE
      SELECT 'BEGIN_SNAP=' || NVL(TO_CHAR(MAX(snap_id)), 'NONE')
      FROM dba_hist_snapshot
      WHERE end_interval_time <= TO_DATE('{{ job.start_dt }}', 'YYYY-MM-DD HH24:MI:SS')
        AND dbid = (SELECT dbid FROM v$database);
      SELECT 'END_SNAP=' || NVL(TO_CHAR(MIN(snap_id)), 'NONE')
      FROM dba_hist_snapshot
      WHERE end_interval_time >= TO_DATE('{{ job.end_dt }}', 'YYYY-MM-DD HH24:MI:SS')
        AND dbid = (SELECT dbid FROM v$database);
      EXIT;
  delegate_to: "{{ job.target_host }}"
  become: true

- name: "JOB | {{ job.issue_key }} | Write snapshot-resolution wrapper (explicit ORACLE_SID export)"
  ansible.builtin.copy:
    dest: "{{ prf_work_dir }}/run_resolve_snapshots.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      export ORACLE_SID={{ job.cdb_sid }}
      export ORACLE_HOME={{ job.oracle_home }}
      export PATH=$ORACLE_HOME/bin:$PATH
      "$ORACLE_HOME/bin/sqlplus" -S / AS SYSDBA @{{ prf_work_dir }}/resolve_snapshots.sql
  delegate_to: "{{ job.target_host }}"
  become: true

- name: "JOB | {{ job.issue_key }} | Resolve snapshot IDs as oracle"
  ansible.builtin.command: "bash {{ prf_work_dir }}/run_resolve_snapshots.sh"
  delegate_to: "{{ job.target_host }}"
  become: true
  become_user: "{{ job.oracle_user }}"
  register: prf_resolve_exec
  failed_when: false
  changed_when: false

- name: "JOB | {{ job.issue_key }} | Parse resolved snapshot IDs"
  ansible.builtin.set_fact:
    prf_begin_snap: >-
      {{ (prf_resolve_exec.stdout_lines | default([]) | select('match', '^BEGIN_SNAP=') | list | first | default('BEGIN_SNAP=NONE')) | regex_replace('^BEGIN_SNAP=', '') }}
    prf_end_snap: >-
      {{ (prf_resolve_exec.stdout_lines | default([]) | select('match', '^END_SNAP=') | list | first | default('END_SNAP=NONE')) | regex_replace('^END_SNAP=', '') }}

- name: "JOB | {{ job.issue_key }} | Fail cleanly if no bracketing snapshots were found"
  ansible.builtin.set_fact:
    prf_success: false
    prf_fail_reason: >-
      Could not find AWR snapshots covering {{ job.start_dt }} -> {{ job.end_dt }} for {{ job.oracle_sid }} on {{ job.target_host }} (rc={{ prf_resolve_exec.rc }}, begin_snap={{ prf_begin_snap }}, end_snap={{ prf_end_snap }}). This usually means the requested time period is outside the AWR retention window, no snapshots exist yet for that period, or the Jira Date Time Picker's timezone doesn't match the Oracle server's (see the TIMEZONE CAVEAT in JIRA_PRF_performance_analysis.yml). Raw output: {{ (prf_resolve_exec.stdout | default('')) | truncate(1000) }} {{ (prf_resolve_exec.stderr | default('')) | truncate(500) }}
  when: >-
    prf_resolve_exec.rc != 0 or prf_begin_snap == 'NONE' or prf_end_snap == 'NONE' or prf_begin_snap | length == 0 or prf_end_snap | length == 0

- name: "JOB | {{ job.issue_key }} | Show resolved snapshot range"
  ansible.builtin.debug:
    msg: "{{ job.start_dt }} -> {{ job.end_dt }} resolved to snapshots {{ prf_begin_snap }} -> {{ prf_end_snap }}"
  when: prf_success

# -----------------------------------------------------------------
# 1. AWR text report - human-readable evidence, attached as-is. DBID and
#    instance_number are looked up dynamically rather than assumed.
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Write AWR report SQL"
  ansible.builtin.copy:
    dest: "{{ prf_work_dir }}/awr_report.sql"
    mode: '0644'
    content: |
      SET PAGESIZE 0
      SET LINESIZE 200
      SET LONG 1000000
      SET LONGCHUNKSIZE 1000000
      SET TRIMSPOOL ON
      SET FEEDBACK OFF
      SET ECHO OFF
      SPOOL {{ prf_work_dir }}/awr_report.log
      WHENEVER SQLERROR EXIT SQL.SQLCODE
      SELECT output
      FROM TABLE(
        DBMS_WORKLOAD_REPOSITORY.awr_report_text(
          (SELECT dbid FROM v$database),
          (SELECT instance_number FROM v$instance),
          {{ prf_begin_snap }},
          {{ prf_end_snap }}
        )
      );
      SPOOL OFF
      EXIT;
  delegate_to: "{{ job.target_host }}"
  become: true
  when: prf_success

# -----------------------------------------------------------------
# 2. Top-5 CPU SQL_IDs - queried directly from DBA_HIST_SQLSTAT rather
#    than parsed out of the AWR report text (far more reliable).
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Re-ensure working directory exists (defensive)"
  ansible.builtin.file:
    path: "{{ prf_work_dir }}"
    state: directory
    mode: '0777'
  delegate_to: "{{ job.target_host }}"
  become: true

- name: "JOB | {{ job.issue_key }} | Write top-5 CPU SQL_ID query"
  ansible.builtin.copy:
    dest: "{{ prf_work_dir }}/top5.sql"
    mode: '0644'
    content: |
      SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO OFF LINESIZE 200 TRIMSPOOL ON
      WHENEVER SQLERROR EXIT SQL.SQLCODE
      SELECT sql_id || '|' || ROUND(total_cpu / 1000000, 2)
      FROM (
        SELECT sql_id, SUM(cpu_time_delta) AS total_cpu
        FROM dba_hist_sqlstat
        WHERE snap_id BETWEEN {{ prf_begin_snap }} AND {{ prf_end_snap }}
          AND con_id = (SELECT con_id FROM v$containers WHERE name = '{{ job.oracle_sid }}')
        GROUP BY sql_id
        ORDER BY total_cpu DESC
      )
      WHERE ROWNUM <= 5;
      EXIT;
  delegate_to: "{{ job.target_host }}"
  become: true
  when: prf_success

- name: "JOB | {{ job.issue_key }} | Write execution wrapper (explicit ORACLE_SID export)"
  ansible.builtin.copy:
    dest: "{{ prf_work_dir }}/run_awr_and_top5.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      export ORACLE_SID={{ job.cdb_sid }}
      export ORACLE_HOME={{ job.oracle_home }}
      export PATH=$ORACLE_HOME/bin:$PATH
      "$ORACLE_HOME/bin/sqlplus" -S / AS SYSDBA @{{ prf_work_dir }}/awr_report.sql
      "$ORACLE_HOME/bin/sqlplus" -S / AS SYSDBA @{{ prf_work_dir }}/top5.sql
  delegate_to: "{{ job.target_host }}"
  become: true
  when: prf_success

- name: "JOB | {{ job.issue_key }} | Run AWR report + top-5 query as oracle"
  ansible.builtin.command: "bash {{ prf_work_dir }}/run_awr_and_top5.sh"
  delegate_to: "{{ job.target_host }}"
  become: true
  become_user: "{{ job.oracle_user }}"
  register: prf_top5_exec
  failed_when: false
  changed_when: true
  when: prf_success

- name: "JOB | {{ job.issue_key }} | Parse top-5 SQL_IDs from output"
  ansible.builtin.set_fact:
    prf_top_sql: >-
      {{ prf_top_sql | default([]) + [ {
           'sql_id': item.split('|')[0],
           'cpu_secs': item.split('|')[1] | float
         } ] }}
  loop: "{{ (prf_top5_exec.stdout_lines | default([])) | select('match', '^[A-Za-z0-9_$]+\\|[0-9.]+$') | list }}"
  loop_control:
    label: "{{ item }}"
  when: prf_success

- name: "JOB | {{ job.issue_key }} | Determine whether top-5 extraction succeeded"
  ansible.builtin.set_fact:
    prf_success: false
    prf_fail_reason: >-
      Could not extract any SQL_IDs from DBA_HIST_SQLSTAT for the resolved snapshot range. rc={{ prf_top5_exec.rc | default('n/a') }}. Check that BEGIN_SNAP ({{ prf_begin_snap | default('n/a') }}) and END_SNAP ({{ prf_end_snap | default('n/a') }}) are valid, that AWR snapshots exist for that range, and that the Tuning and Diagnostics Pack is licensed on this database. Raw output: {{ (prf_top5_exec.stdout | default('')) | truncate(1500) }} {{ (prf_top5_exec.stderr | default('')) | truncate(500) }}
  when: prf_success and (prf_top5_exec.rc | default(1) != 0 or prf_top_sql | default([]) | length == 0)

- name: "JOB | {{ job.issue_key }} | Show top SQL_IDs found"
  ansible.builtin.debug:
    msg: "{{ item.sql_id }}: {{ item.cpu_secs }}s CPU"
  loop: "{{ prf_top_sql }}"
  loop_control:
    label: "{{ item.sql_id }}"
  when: prf_success

# -----------------------------------------------------------------
# 3. SQL Tuning Advisor per SQL_ID - execute_tuning_task only PRODUCES
#    ADVICE. It never applies an index or SQL Profile itself.
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Write and run SQL Tuning Advisor for each SQL_ID"
  when: prf_success
  block:

  - name: "JOB | {{ job.issue_key }} | Re-ensure working directory exists (defensive)"
    ansible.builtin.file:
      path: "{{ prf_work_dir }}"
      state: directory
      mode: '0777'
    delegate_to: "{{ job.target_host }}"
    become: true

  - name: "JOB | {{ job.issue_key }} | Write tuning advisor script for {{ item.sql_id }}"
    ansible.builtin.copy:
      dest: "{{ prf_work_dir }}/tune_{{ item.sql_id }}.sql"
      mode: '0644'
      content: |
        SET PAGESIZE 0
        SET LINESIZE 200
        SET LONG 1000000
        SET LONGCHUNKSIZE 1000000
        SET TRIMSPOOL ON
        SET FEEDBACK OFF
        SET ECHO OFF
        SPOOL {{ prf_work_dir }}/tune_{{ item.sql_id }}.log
        WHENEVER SQLERROR CONTINUE
        -- Connected to the CDB root (ORACLE_SID={{ job.cdb_sid }}) - switch
        -- into the target PDB's container, since the SQL Tuning Advisor
        -- needs to run in the same container the SQL actually executed in.
        ALTER SESSION SET CONTAINER = {{ job.oracle_sid }};
        BEGIN
          DBMS_SQLTUNE.drop_tuning_task(task_name => 'PRF_{{ item.sql_id }}_{{ job.issue_key }}');
        EXCEPTION WHEN OTHERS THEN NULL;
        END;
        /
        DECLARE
          l_task VARCHAR2(100);
        BEGIN
          l_task := DBMS_SQLTUNE.create_tuning_task(
            sql_id     => '{{ item.sql_id }}',
            task_name  => 'PRF_{{ item.sql_id }}_{{ job.issue_key }}',
            time_limit => 300);
          DBMS_SQLTUNE.execute_tuning_task(task_name => l_task);
        END;
        /
        SELECT DBMS_SQLTUNE.report_tuning_task('PRF_{{ item.sql_id }}_{{ job.issue_key }}')
        FROM dual;
        SPOOL OFF
        EXIT;
    delegate_to: "{{ job.target_host }}"
    become: true
    loop: "{{ prf_top_sql }}"
    loop_control:
      label: "{{ item.sql_id }}"

  - name: "JOB | {{ job.issue_key }} | Execute tuning advisor for {{ item.sql_id }}"
    ansible.builtin.command: >-
      bash -c "export ORACLE_SID={{ job.cdb_sid }}; export ORACLE_HOME={{ job.oracle_home }}; export PATH=$ORACLE_HOME/bin:$PATH; \"$ORACLE_HOME/bin/sqlplus\" -S / AS SYSDBA @{{ prf_work_dir }}/tune_{{ item.sql_id }}.sql"
    delegate_to: "{{ job.target_host }}"
    become: true
    become_user: "{{ job.oracle_user }}"
    loop: "{{ prf_top_sql }}"
    loop_control:
      label: "{{ item.sql_id }}"
    register: prf_tune_exec
    failed_when: false
    changed_when: true

  - name: "JOB | {{ job.issue_key }} | Read each tuning advisor report"
    ansible.builtin.slurp:
      src: "{{ prf_work_dir }}/tune_{{ item.sql_id }}.log"
    delegate_to: "{{ job.target_host }}"
    become: true
    loop: "{{ prf_top_sql }}"
    loop_control:
      label: "{{ item.sql_id }}"
    register: prf_tune_logs
    ignore_errors: true

  - name: "JOB | {{ job.issue_key }} | Build a one-line recommendation summary per SQL_ID"
    ansible.builtin.set_fact:
      prf_recommendations: >-
        {{ prf_recommendations | default([]) + [ {
             'sql_id':     prf_top_sql[idx].sql_id,
             'cpu_secs':   prf_top_sql[idx].cpu_secs,
             'flag': (
               'SQL Profile suggested'
               if 'ACCEPT_SQL_PROFILE' in (prf_tune_logs.results[idx].content | default('') | b64decode).upper()
               or 'SQL PROFILE' in (prf_tune_logs.results[idx].content | default('') | b64decode).upper()
               else ('New index suggested'
                     if 'CREATE INDEX' in (prf_tune_logs.results[idx].content | default('') | b64decode).upper()
                     else 'No significant recommendation found')
             )
           } ] }}
    loop: "{{ prf_top_sql }}"
    loop_control:
      index_var: idx
      label: "{{ item.sql_id }}"

- name: "JOB | {{ job.issue_key }} | Ensure recommendations list is set when the tuning step was skipped"
  ansible.builtin.set_fact:
    prf_recommendations: []
  when: not prf_success

# -----------------------------------------------------------------
# 4. Fetch evidence files back to the controller, then upload as REAL Jira
#    attachments via the multipart endpoint (not embedded in a comment -
#    these files can be 50-200KB+, larger than is sensible for a comment).
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Ensure local staging directory exists"
  ansible.builtin.file:
    path: "{{ prf_local_staging }}"
    state: directory
    mode: '0750'
  when: prf_success

- name: "JOB | {{ job.issue_key }} | Fetch AWR report to the controller"
  ansible.builtin.fetch:
    src: "{{ prf_work_dir }}/awr_report.log"
    dest: "{{ prf_local_staging }}/{{ job.issue_key }}_awr_report.log"
    flat: true
  delegate_to: "{{ job.target_host }}"
  when: prf_success
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Fetch each tuning report to the controller"
  ansible.builtin.fetch:
    src: "{{ prf_work_dir }}/tune_{{ item.sql_id }}.log"
    dest: "{{ prf_local_staging }}/{{ job.issue_key }}_tune_{{ item.sql_id }}.log"
    flat: true
  delegate_to: "{{ job.target_host }}"
  loop: "{{ prf_top_sql }}"
  loop_control:
    label: "{{ item.sql_id }}"
  when: prf_success
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Upload AWR report as a real Jira attachment"
  ansible.builtin.uri:
    url: "{{ jira_url }}/rest/api/2/issue/{{ job.issue_key }}/attachments"
    method: POST
    user: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    force_basic_auth: true
    headers:
      X-Atlassian-Token: "no-check"
    body_format: form-multipart
    body:
      file:
        filename: "PRF_{{ job.issue_key }}_awr_report.log"
        mime_type: "text/plain"
        content: "{{ lookup('file', prf_local_staging + '/' + job.issue_key + '_awr_report.log') }}"
    status_code: 200
  when: prf_success
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Upload each tuning report as a real Jira attachment"
  ansible.builtin.uri:
    url: "{{ jira_url }}/rest/api/2/issue/{{ job.issue_key }}/attachments"
    method: POST
    user: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    force_basic_auth: true
    headers:
      X-Atlassian-Token: "no-check"
    body_format: form-multipart
    body:
      file:
        filename: "PRF_{{ job.issue_key }}_tune_{{ item.sql_id }}.log"
        mime_type: "text/plain"
        content: "{{ lookup('file', prf_local_staging + '/' + job.issue_key + '_tune_' + item.sql_id + '.log') }}"
    status_code: 200
  loop: "{{ prf_top_sql }}"
  loop_control:
    label: "{{ item.sql_id }}"
  when: prf_success
  failed_when: false

# -----------------------------------------------------------------
# 5. Comment + close the analysis issue
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Post analysis summary comment"
  community.general.jira:
    uri: "{{ jira_url }}"
    username: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    operation: comment
    issue: "{{ job.issue_key }}"
    comment: |-
      PRF analysis {{ 'COMPLETE' if prf_success else 'FAILED' }} for {{ job.oracle_sid }} on {{ job.target_host }}.
      {% if prf_success %}
      Top CPU-consuming SQL for issue period {{ job.start_dt }} -> {{ job.end_dt }}
      (AWR snapshots {{ prf_begin_snap }} -> {{ prf_end_snap }}):
      {% for r in prf_recommendations %}
      - SQL_ID {{ r.sql_id }} - {{ r.cpu_secs }}s CPU - {{ r.flag }}
      {% endfor %}

      Full AWR report and per-SQL_ID tuning advisor reports are attached to
      this issue. A separate follow-up issue is being opened for the DBA
      team to review these recommendations and implement any fix, subject
      to your normal approval process. Ansible has NOT modified the
      database - execute_tuning_task only produces advice.
      {% else %}
      {{ prf_fail_reason }}
      {% endif %}
    cloud: "{{ jira_cloud }}"
  failed_when: false

# -----------------------------------------------------------------
# 6. Transition the issue based on outcome
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Get available transitions"
  ansible.builtin.uri:
    url: "{{ jira_url }}/rest/api/2/issue/{{ job.issue_key }}/transitions"
    method: GET
    user: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: prf_transitions
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Apply the outcome transition"
  ansible.builtin.uri:
    url: "{{ jira_url }}/rest/api/2/issue/{{ job.issue_key }}/transitions"
    method: POST
    user: "{{ jira_user }}"
    password: "{{ jira_api_token }}"
    force_basic_auth: true
    body_format: json
    body:
      transition:
        id: >-
          {{
            (prf_transitions.json.transitions | selectattr('to.name', 'equalto', target_status) | map(attribute='id') | list
             + prf_transitions.json.transitions | selectattr('name', 'equalto', target_status) | map(attribute='id') | list) | first
          }}
    status_code: 204
  vars:
    target_status: "{{ jira_status_done if prf_success else jira_status_failed }}"
  when:
  - prf_transitions is success
  - (prf_transitions.json.transitions | selectattr('to.name', 'equalto', target_status) | list
     + prf_transitions.json.transitions | selectattr('name', 'equalto', target_status) | list) | length > 0
  failed_when: false

- name: "JOB | {{ job.issue_key }} | WARN when the expected transition is unavailable"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ job.issue_key }} finished as {{ 'DONE' if prf_success else 'FAILED' }}
      but could NOT be transitioned to '{{ target_status }}' -- the workflow
      only offers: {{ prf_transitions.json.transitions | default([]) | map(attribute='name') | list | join(', ') }}.
  vars:
    target_status: "{{ jira_status_done if prf_success else jira_status_failed }}"
  when:
  - prf_transitions is success
  - (prf_transitions.json.transitions | selectattr('to.name', 'equalto', target_status) | list
     + prf_transitions.json.transitions | selectattr('name', 'equalto', target_status) | list) | length == 0

# -----------------------------------------------------------------
# 7. Follow-up issue - ALWAYS opened when at least one recommendation was
#    found (Ansible never applies these itself), or a DBA repair follow-up
#    on total analysis failure.
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Open follow-up task for the DBA team to implement fixes"
  ansible.builtin.include_tasks: COMMON_jira_create_followup_task.yml
  when: prf_success and prf_recommendations | length > 0
  vars:
    fu_original_key: "{{ job.issue_key }}"
    fu_summary: "Implement performance recommendations for {{ job.oracle_sid }} on {{ job.target_host }}"
    fu_description: |-
      AWR performance analysis for {{ job.oracle_sid }} on {{ job.target_host }}
      (issue period {{ job.start_dt }} -> {{ job.end_dt }}) identified the
      following SQL Tuning Advisor recommendations. Please review each and
      implement the appropriate fix (creating an index or accepting a SQL
      Profile) through your normal change/approval process. Ansible has NOT
      applied any of these changes.

      {% for r in prf_recommendations %}
      SQL_ID {{ r.sql_id }} - {{ r.cpu_secs }}s CPU - {{ r.flag }}
      {% endfor %}

      Full tuning advisor output for each SQL_ID is attached to the
      original analysis issue {{ job.issue_key }}, along with the AWR
      report and full automation history.

- name: "JOB | {{ job.issue_key }} | Open DBA repair follow-up on total analysis failure"
  ansible.builtin.include_tasks: COMMON_jira_create_followup_task.yml
  when: not prf_success
  vars:
    fu_original_key: "{{ job.issue_key }}"
    fu_summary: "PRF analysis failed for {{ job.oracle_sid }} on {{ job.target_host }}"
    fu_description: "{{ prf_fail_reason }}"

# -----------------------------------------------------------------
# 8. Cleanup
# -----------------------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Clean up remote temp files"
  ansible.builtin.file:
    path: "{{ prf_work_dir }}"
    state: absent
  delegate_to: "{{ job.target_host }}"
  become: true
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Clean up local AWR staging file"
  ansible.builtin.file:
    path: "{{ prf_local_staging }}/{{ job.issue_key }}_awr_report.log"
    state: absent
  failed_when: false

- name: "JOB | {{ job.issue_key }} | Clean up local tuning-report staging files"
  ansible.builtin.file:
    path: "{{ prf_local_staging }}/{{ job.issue_key }}_tune_{{ item.sql_id }}.log"
    state: absent
  loop: "{{ prf_top_sql }}"
  loop_control:
    label: "{{ item.sql_id }}"
  failed_when: false
