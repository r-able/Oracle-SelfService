---
# =============================================================================
# SNOW_sync_oracle_targets.yml
#
# Syncs oracle_instance_map (the existing global vars/main.yml dict, keyed by
# host, with oracle_sid/oracle_home/oracle_user per entry - already the
# authoritative source every other SNOW playbook uses) into the ServiceNow
# custom table u_u_oracle_target, so record producer Reference-type fields
# (e.g. PRF's "Database" field) can only ever show real, currently-known
# host:SID combinations - no more free-text entry errors like "CDB1" with no
# host, or "UAT" typed where a host was expected.
#
# This is a ONE-WAY sync: Ansible inventory -> ServiceNow. Nothing in
# ServiceNow ever writes back to oracle_instance_map. Run this on a schedule
# (cron wrapper provided separately) so the table stays current as hosts are
# added/changed, with no manual double-entry required.
#
# u_u_oracle_target fields (create via System Definition > Tables first):
#   u_host        - hostname, e.g. lnx001
#   u_oracle_sid  - Oracle SID, e.g. CDB1
#   u_label       - display value, "host:SID", e.g. "lnx001:CDB1"
#                   (marked as the table's Display field)
#
# IDEMPOTENT: matches existing rows by u_host + u_oracle_sid; updates u_label
# if it has drifted, inserts new rows for anything not yet present. Does NOT
# delete rows for hosts removed from oracle_instance_map (stale entries are
# left in place rather than silently destroyed - review and remove manually
# if a host is retired).
# =============================================================================

- name: Sync oracle_instance_map into ServiceNow u_u_oracle_target
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars/main.yml

  tasks:

  - name: Pre-flight - verify instance is awake and credentials valid
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/sys_user?sysparm_limit=1"
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: sync_preflight
    failed_when: false

  - name: Abort with a clear message if the instance is unreachable
    ansible.builtin.fail:
      msg: >-
        ServiceNow pre-flight failed (HTTP {{ sync_preflight.status | default('n/a') }}). If the response was not JSON the PDI is probably HIBERNATING -- wake it at https://developer.servicenow.com and re-run.
    when: sync_preflight.status | default(0) != 200 or sync_preflight.json is not defined

  - name: Build the list of targets from oracle_instance_map
    ansible.builtin.set_fact:
      sync_targets: >-
        {{ sync_targets | default([]) + [ {
             'host': item,
             'sid': oracle_instance_map[item].oracle_sid,
             'label': item ~ ':' ~ oracle_instance_map[item].oracle_sid
           } ] }}
    loop: "{{ oracle_instance_map.keys() | list }}"
    loop_control:
      label: "{{ item }}"

  - name: Show targets to sync
    ansible.builtin.debug:
      msg: "{{ sync_targets | map(attribute='label') | list }}"

  - name: Check whether each target already exists in u_u_oracle_target
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/u_u_oracle_target?sysparm_query={{
          ('u_host=' + item.host + '^u_oracle_sid=' + item.sid) | urlencode
        }}&sysparm_fields=sys_id,u_label&sysparm_limit=1
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ sync_targets }}"
    loop_control:
      label: "{{ item.label }}"
    register: sync_lookup

  - name: Build create/update work list
    ansible.builtin.set_fact:
      sync_jobs: >-
        {{ sync_jobs | default([]) + [ item.item | combine({
             'existing_sys_id': (item.json.result | default([]) | first | default({})).sys_id | default(''),
             'existing_label':  (item.json.result | default([]) | first | default({})).u_label | default('')
           }) ] }}
    loop: "{{ sync_lookup.results }}"
    loop_control:
      label: "{{ item.item.label }}"

  - name: Create new targets that don't exist yet
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_u_oracle_target"
      method: POST
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        u_host: "{{ item.host }}"
        u_oracle_sid: "{{ item.sid }}"
        u_label: "{{ item.label }}"
      status_code: 201
    loop: "{{ sync_jobs }}"
    loop_control:
      label: "{{ item.label }}"
    when: item.existing_sys_id | length == 0
    register: sync_created
    failed_when: false

  - name: Update targets whose label has drifted
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_u_oracle_target/{{ item.existing_sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        u_label: "{{ item.label }}"
      status_code: 200
    loop: "{{ sync_jobs }}"
    loop_control:
      label: "{{ item.label }}"
    when:
    - item.existing_sys_id | length > 0
    - item.existing_label != item.label
    failed_when: false

  - name: Final summary
    ansible.builtin.debug:
      msg:
      - "======================================================"
      - "  u_u_oracle_target sync summary"
      - "======================================================"
      - "  Targets in oracle_instance_map : {{ sync_targets | length }}"
      - "  Created                        : {{ sync_jobs | selectattr('existing_sys_id', 'equalto', '') | list | length }}"
      - "  Already existed                : {{ sync_jobs | rejectattr('existing_sys_id', 'equalto', '') | list | length }}"
      - "======================================================"
