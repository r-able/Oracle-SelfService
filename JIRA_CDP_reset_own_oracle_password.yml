---
# JIRA_CDP_reset_own_oracle_password.yml
# Released under the MIT license. Copyright (c) 2026, Vlad von Grigorian <
#
# REWRITTEN (Aug 2026) to match ServiceNow CDP's design after comparing the
# two side by side: ServiceNow's CDP targets exactly ONE host:database per
# request via a "Server:database" field (documented best practice, per its
# own form instructions) - this JIRA version previously did the opposite,
# looping over EVERY environment database on one fixed host (oracle_host)
# for every single request. Brought into parity: one field, one target,
# matching ServiceNow. Reuses the exact same live host:PDB data DCR already
# gets from JIRA_sync_oracle_targets.yml - no new sync job needed, just a
# new field name added to jira_target_field_names.
#
# Workflow:
#   0. Pre-flight : validate Jira API token via /rest/api/2/myself
#   0b. Resolve   : the "Server:database" field ID
#   1. Search     : find all open issues matching the configured JQL
#   2. Fetch      : retrieve each issue, extract the reporter's username AND
#                   the selected host:database from the field; drop issues
#                   with a missing field or an unknown host
#   3. Generate   : create one random password per issue
#   4. Reset      : connect to the ONE selected host:database and
#                   ALTER USER ... IDENTIFIED BY ...
#   5. Comment    : post the temporary password back to the Jira issue
#   6. Transition : "Done" on success, "Failed" on error
#   7. Summary    : print a final outcome table
#
# FIELD FORMAT:
#   Server:database : "lnx001:DEV"  (from JIRA_sync_oracle_targets.yml,
#                      the exact same live host:PDB data DCR's "Database
#                      Instance" field already uses)
#
# Required vars (vars/main.yml -- vault-encrypt sensitive values):
#   jira_url, jira_user, jira_api_token
#   jira_jql_cdp, jira_max_results, jira_cloud
#   jira_status_done, jira_status_failed, jira_status_in_progress
#   jira_cdp_host_db_field_name : "Server:database"
#   oracle_instance_map : (already defined - host -> oracle_home/sid/user)
#   oracle_port, oracle_dba_user, oracle_dba_pass
#
# Usage:
#   ansible-playbook JIRA_CDP_reset_own_oracle_password.yml --ask-vault-pass
#
# Requirements:
#   ansible-galaxy collection install community.general
#   pip install oracledb          # thin driver, no Oracle Client needed

- name: Jira -> Get reporter -> Reset Oracle password in all databases -> Transition issue
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    # Built at runtime -- do not edit
    issue_outcomes: {} # { "CDP-123": "done" | "failed" }

  # ===========================================================================
  tasks:

  # -- PRE-FLIGHT: validate API token ---------------------------------------

  - name: "PRE-FLIGHT | Validate Jira API token via /rest/api/2/myself"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/myself"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      status_code: 200
      return_content: true
    register: jira_auth_check
    no_log: true

  - name: "PRE-FLIGHT | Confirm authenticated identity"
    ansible.builtin.debug:
      msg: >-
        Jira authentication OK -- connected as '{{ jira_auth_check.json.displayName }}' ({{ jira_auth_check.json.emailAddress }})

  # -- 0b. Resolve the 'Server:database' field ID -----------------------------

  - name: "0b | Resolve 'Server:database' field ID"
    ansible.builtin.include_tasks: COMMON_jira_resolve_field.yml
    vars:
      resolve_field_name: "{{ jira_cdp_host_db_field_name }}"

  - name: "0b | Set jira_cdp_host_db_field from the resolved ID"
    ansible.builtin.set_fact:
      jira_cdp_host_db_field: "{{ resolved_field_id }}"

  # -- 1. Search Jira -------------------------------------------------------

  # Shepherd the intake queue before searching for work:
  #   To Do -> Pending Approval; APPROVED Pending Approval -> In Progress.
  # All other statuses are ignored. Freshly promoted issues are picked up
  # by the search below in this same run.
  - name: "0 | Shepherd CDP intake queue toward '{{ jira_status_in_progress }}'"
    ansible.builtin.include_tasks: COMMON_jira_shepherd_statuses.yml
    vars:
      shepherd_project: "CDP"

  - name: "1 | Search for open Jira issues matching JQL"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: search
      jql: "{{ jira_jql_cdp }}"
      maxresults: "{{ jira_max_results }}"
      cloud: "{{ jira_cloud }}"
    register: jira_search

  - name: "1 | Abort if no issues found"
    ansible.builtin.fail:
      msg: >-
        No Jira issues matched JQL: {{ jira_jql_cdp }}

        API token is VALID (pre-flight passed as {{ jira_auth_check.json.displayName }}), so this is a genuine JQL / data issue -- not an auth problem.
    when: jira_search.meta.issues | length == 0

  - name: "1 | Show issues found"
    ansible.builtin.debug:
      msg: >-
        Found {{ jira_search.meta.issues | length }} issue(s): {{ jira_search.meta.issues | map(attribute='key') | list | join(', ') }}

  # -- 2. Fetch full issue data -- extract reporter username -----------------

  - name: "2 | Fetch full details for each issue"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: fetch
      issue: "{{ item.key }}"
      cloud: "{{ jira_cloud }}"
    loop: "{{ jira_search.meta.issues }}"
    loop_control:
      label: "{{ item.key }}"
    register: jira_issue_details

  # Oracle username convention (must match CAU provisioning): first letter
  # of the first name + entire last name, upper-cased ("Vlad Grigorian" ->
  # VGRIGORIAN); single-word display names are used as-is. Spaces are never
  # valid in Oracle usernames.
  #
  # Also parses the selected "Server:database" value ("lnx001:DEV") into
  # target_host/target_service - REWRITE (Aug 2026): previously this
  # playbook ignored any per-issue target entirely and looped over every
  # environment on one fixed host. Now it targets exactly the one
  # host:database selected, matching ServiceNow's documented model.

  - name: "2 | WARN and skip issues with a missing or invalid 'Server:database' selection"
    ansible.builtin.debug:
      msg:
      - >-
        WARNING: {{ item.meta.key }} has an unusable 'Server:database' value
        ('{{ p_host_db }}') -- skipping.
        {% if p_host not in oracle_instance_map %}Unknown host '{{ p_host }}' (known: {{ oracle_instance_map.keys() | list | join(', ') }}). {% endif %}
      - "Populated custom fields on {{ item.meta.key }}:"
      - "{{ item.meta.fields | dict2items | selectattr('key', 'match', '^customfield_') | rejectattr('value', 'none') | items2dict }}"
    loop: "{{ jira_issue_details.results }}"
    loop_control:
      label: "{{ item.meta.key }}"
    vars:
      p_host_db: "{{ (item.meta.fields[jira_cdp_host_db_field] | default({})).value | default('') }}"
      p_host: "{{ p_host_db.split(':')[0] | default('') | trim }}"
    when: p_host_db | length == 0 or p_host not in oracle_instance_map

  - name: "2 | Build issue -> reporter + target mapping"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([]) + [{
            'issue_key':   item.meta.key,
            'oracle_user': (
              (
                item.meta.fields.reporter.displayName.split(' ')[0][0]
                + item.meta.fields.reporter.displayName.split(' ')[-1]
              )
              if (item.meta.fields.reporter.displayName.split(' ') | length) > 1
              else item.meta.fields.reporter.displayName
            ) | upper,
            'target_host':    p_host_db.split(':')[0] | trim,
            'target_service': p_host_db.split(':')[1] | trim | upper
          }]
        }}
    loop: "{{ jira_issue_details.results }}"
    loop_control:
      label: "{{ item.meta.key }}"
    vars:
      p_host_db: "{{ (item.meta.fields[jira_cdp_host_db_field] | default({})).value | default('') }}"
      p_host: "{{ p_host_db.split(':')[0] | default('') | trim }}"
    when: p_host_db | length > 0 and p_host in oracle_instance_map

  - name: "2 | Nothing valid to process"
    ansible.builtin.meta: end_play
    when: issues_to_reset | default([]) | length == 0

  - name: "2 | Show reporter -> Oracle user + target mapping"
    ansible.builtin.debug:
      msg: "{{ item.issue_key }} -> Oracle user: {{ item.oracle_user }} | target: {{ item.target_host }}:{{ item.target_service }}"
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # -- 3. Generate one random password per issue -----------------------------
  # One password per issue, applied to ALL databases (matches CNU: the user
  # has one credential set across environments).

  - name: "3 | Generate random password for each Oracle user"
    ansible.builtin.shell:
      cmd: |
        upper=$(tr -dc 'A-Z'    </dev/urandom | head -c 1)
        lower=$(tr -dc 'a-z'    </dev/urandom | head -c 1)
        digit=$(tr -dc '0-9'    </dev/urandom | head -c 1)
        spec=$(tr  -dc '@#$%'   </dev/urandom | head -c 1)
        rest=$(tr  -dc 'A-Za-z0-9@#$%' </dev/urandom | head -c 12)
        pw="${upper}${lower}${digit}${spec}${rest}"
        echo "$pw" | fold -w1 | shuf | tr -d '\n'
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.oracle_user }}"
    register: generated_passwords
    no_log: true

  - name: "3 | Attach generated password to each issue entry"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([])
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [ item.item | combine({ 'new_password': item.stdout }) ]
        }}
    loop: "{{ generated_passwords.results }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.oracle_user }}"
    no_log: true

  # -- 4. Reset the password in the ONE selected host:database --------------
  # REWRITE (Aug 2026): previously this used product() to build every
  # (issue, environment) pair and looped over ALL of oracle_databases on one
  # fixed oracle_host. Now each issue resets exactly the one host:database
  # it selected - matching ServiceNow's single-target model.

  - name: "4 | Reset Oracle password for the selected host:database"
    ansible.builtin.shell:
      cmd: |
        python3 - << 'PYEOF'
        import sys, os
        try:
            import oracledb
            def connect(user, password, host, port, service):
                dsn = f"{host}:{port}/{service}"
                return oracledb.connect(user=user, password=password, dsn=dsn)
        except ImportError:
            import cx_Oracle
            def connect(user, password, host, port, service):
                dsn = cx_Oracle.makedsn(host, int(port), service_name=service)
                return cx_Oracle.connect(user=user, password=password, dsn=dsn)

        host        = os.environ["ORA_HOST"]
        port        = os.environ["ORA_PORT"]
        service     = os.environ["ORA_SERVICE"]
        dba_user    = os.environ["ORA_DBA_USER"]
        dba_pass    = os.environ["ORA_DBA_PASS"]
        target_user = os.environ["ORA_TARGET_USER"]
        new_pass    = os.environ["ORA_NEW_PASS"]
        db_name     = os.environ["ORA_DB_NAME"]

        try:
            conn = connect(dba_user, dba_pass, host, port, service)
        except Exception as e:
            print(f"ERROR: [{db_name}] Could not connect to Oracle service "
                  f"'{service}': {e}", file=sys.stderr)
            sys.exit(1)

        cur = conn.cursor()

        # Verify the target user exists in THIS database before resetting
        cur.execute(
            "SELECT COUNT(*) FROM dba_users WHERE username = :uname",
            uname=target_user
        )
        if cur.fetchone()[0] == 0:
            print(f"ERROR: [{db_name}] Oracle user '{target_user}' does not "
                  f"exist in this database.", file=sys.stderr)
            sys.exit(1)

        # ALTER USER does not support bind variables for identifiers;
        # values come from env vars (not raw shell input) so this is safe.
        cur.execute(f'ALTER USER "{target_user}" IDENTIFIED BY "{new_pass}"')
        conn.commit()
        print(f"OK: [{db_name}] password reset for {target_user}")
        cur.close()
        conn.close()
        PYEOF
    environment:
      ORA_HOST: "{{ item.target_host }}"
      ORA_PORT: "{{ oracle_port | string }}"
      ORA_SERVICE: "{{ item.target_service }}"
      ORA_DBA_USER: "{{ oracle_dba_user }}"
      ORA_DBA_PASS: "{{ oracle_dba_pass }}"
      ORA_TARGET_USER: "{{ item.oracle_user }}"
      ORA_NEW_PASS: "{{ item.new_password }}"
      ORA_DB_NAME: "{{ item.target_host }}:{{ item.target_service }}"
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} | {{ item.oracle_user }} -> {{ item.target_host }}:{{ item.target_service }}"
    register: oracle_reset_results
    ignore_errors: true
    no_log: true # keeps DBA password and new password out of Ansible logs

  # -- 4b. Show sanitised outcome (no passwords) -----------------------------

  - name: "4b | Show password-reset outcome per issue"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.issue_key }} | {{ item.item.oracle_user }} -> {{ item.item.target_host }}:{{ item.item.target_service }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }} {% if item.rc != 0 %}| stderr: {{ item.stderr | default('(none)') | trim }}{% endif %}
    loop: "{{ oracle_reset_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }}"

  # -- 5. Post temporary password as a Jira comment (success only) ----------

  - name: "5 | Post new temporary password as Jira comment (reset succeeded)"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: comment
      issue: "{{ item.issue_key }}"
      comment: |
        *Automated password reset completed successfully.*

        ||Field||Value||
        |Oracle User|{{ item.oracle_user }}|
        |Temporary Password| {{ item.new_password }} |
        |Database|{{ item.target_host }}:{{ item.target_service }}|
        |Reset By|Ansible automation ({{ jira_auth_check.json.displayName }})|
        |Timestamp|{{ ansible_date_time.iso8601 }}|

        ! *Please change this password immediately after your first login.*
        ! *Do not share this password. Delete this comment once noted.*
      cloud: "{{ jira_cloud }}"
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0
    no_log: true
    ignore_errors: true

  # -- 6. Compute per-issue outcome and transition ---------------------------
  # done   -> the reset succeeded
  # failed -> the reset failed

  - name: "6 | Mark issues DONE (reset succeeded)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'done' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0

  - name: "6 | Mark issues FAILED (reset failed)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'failed' }) }}
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) > 0

  - name: "6 | Get available transitions for SUCCESSFUL issues"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.key }}/transitions"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    register: done_transitions
    failed_when: false

  - name: "6 | Transition SUCCESSFUL issues to '{{ jira_status_done }}'"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.item.key }}/transitions"
      method: POST
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      body_format: json
      body:
        transition:
          id: "{{ tr_match.id }}"
      status_code: 204
    loop: "{{ done_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.key | default('skipped') }}"
    vars:
      tr_all: "{{ item.json.transitions | default([]) }}"
      tr_match: >-
        {{
          ((tr_all | selectattr('to.name', 'match', '(?i)^' + (jira_status_done | regex_escape) + '$') | list)
           + (tr_all | selectattr('name', 'match', '(?i)^' + (jira_status_done | regex_escape) + '$') | list))
          | first | default({})
        }}
    when:
    - item is not skipped
    - tr_match.id is defined
    failed_when: false

  - name: "6 | WARN when no '{{ jira_status_done }}' transition is available"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.item.key }} could NOT be transitioned to
        '{{ jira_status_done }}' -- the workflow only offers these transitions
        from the current status:
        {{ tr_all | map(attribute='name') | list | zip(tr_all | map(attribute='to.name') | list) | map('join', ' -> ') | list | join(', ') | default('(none)', true) }}.
        Set jira_status_done in vars/main.yml to one of the target statuses above.
    loop: "{{ done_transitions.results | default([]) }}"
    loop_control:
      label: "{{ item.item.key | default('skipped') }}"
    vars:
      tr_all: "{{ item.json.transitions | default([]) }}"
      tr_match: >-
        {{
          ((tr_all | selectattr('to.name', 'match', '(?i)^' + (jira_status_done | regex_escape) + '$') | list)
           + (tr_all | selectattr('name', 'match', '(?i)^' + (jira_status_done | regex_escape) + '$') | list))
          | first | default({})
        }}
    when:
    - item is not skipped
    - tr_match.id is not defined

  - name: "6 | Post failure comment and transition FAILED issues to '{{ jira_status_failed }}'"
    block:
    - name: "6a | Post failure comment"
      community.general.jira:
        uri: "{{ jira_url }}"
        username: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        operation: comment
        issue: "{{ item.key }}"
        comment: |
          *Automated password reset FAILED.*

          Target: {% for r in oracle_reset_results.results | default([]) if r.item.issue_key == item.key %}{{ r.item.target_host }}:{{ r.item.target_service }}{% endfor %}

          No temporary password has been issued. Please check the Ansible
          controller logs and retry.

          Timestamp: {{ ansible_date_time.iso8601 }}
          Automation account: {{ jira_auth_check.json.displayName }}
        cloud: "{{ jira_cloud }}"
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      ignore_errors: true

    - name: "6b | Get available transitions for FAILED issues"
      ansible.builtin.uri:
        url: "{{ jira_url }}/rest/api/2/issue/{{ item.key }}/transitions"
        method: GET
        user: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      register: failed_cdp_transitions
      failed_when: false

    - name: "6b | Transition FAILED issues to '{{ jira_status_failed }}'"
      ansible.builtin.uri:
        url: "{{ jira_url }}/rest/api/2/issue/{{ item.item.key }}/transitions"
        method: POST
        user: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        force_basic_auth: true
        body_format: json
        body:
          transition:
            id: "{{ tr_match.id }}"
        status_code: 204
      loop: "{{ failed_cdp_transitions.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key | default('skipped') }}"
      vars:
        tr_all: "{{ item.json.transitions | default([]) }}"
        tr_match: >-
          {{
            ((tr_all | selectattr('to.name', 'match', '(?i)^' + (jira_status_failed | regex_escape) + '$') | list)
             + (tr_all | selectattr('name', 'match', '(?i)^' + (jira_status_failed | regex_escape) + '$') | list))
            | first | default({})
          }}
      when:
      - item is not skipped
      - tr_match.id is defined
      failed_when: false

    - name: "6b | WARN when no '{{ jira_status_failed }}' transition is available"
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.item.key }} could NOT be transitioned to
          '{{ jira_status_failed }}' -- the workflow only offers these transitions
          from the current status:
          {{ tr_all | map(attribute='name') | list | zip(tr_all | map(attribute='to.name') | list) | map('join', ' -> ') | list | join(', ') | default('(none)', true) }}.
          Set jira_status_failed in vars/main.yml to one of the target statuses above.
      loop: "{{ failed_cdp_transitions.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key | default('skipped') }}"
      vars:
        tr_all: "{{ item.json.transitions | default([]) }}"
        tr_match: >-
          {{
            ((tr_all | selectattr('to.name', 'match', '(?i)^' + (jira_status_failed | regex_escape) + '$') | list)
             + (tr_all | selectattr('name', 'match', '(?i)^' + (jira_status_failed | regex_escape) + '$') | list))
            | first | default({})
          }}
      when:
      - item is not skipped
      - tr_match.id is not defined

  # -- 6c. Create DBA repair follow-up task per FAILED issue -----------------
  #
  # One follow-up per failed issue, created in the same project, in "To Do",
  # for the Database Administrators, with a per-database failure report
  # attached. IMPORTANT: stdout is deliberately NOT written to the report
  # because the password-reset flow may echo credentials; only rc and stderr
  # are captured.

  - name: "6c | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: jira_followup_enabled | default(true) | bool

  - name: "6c | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - jira_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "6c | Write failure report per FAILED issue (no stdout -- may contain credentials)"
    ansible.builtin.copy:
      content: |
        Automated Oracle Password Reset FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue : {{ item.key }}

        Result (stdout intentionally omitted -- it may contain credentials;
        see rc and stderr only):
        {% for r in oracle_reset_results.results | default([]) if r.item.issue_key == item.key %}
        --- {{ r.item.target_host }}:{{ r.item.target_service }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ---
        {% if r.rc != 0 %}
        stderr: {{ r.stderr | default('(none)') | trim }}
        {% endif %}
        {% endfor %}

        No temporary password has been issued to the requester.
      dest: "{{ followup_log_dir }}/CDP_{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - jira_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "6c | Create DBA follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_jira_create_followup_task.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - jira_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_original_key: "{{ fu_item.key }}"
      fu_summary: "DBA repair required: Oracle password reset failed for {{ fu_item.key }}"
      fu_description: |-
        Automated Oracle password reset FAILED and the original issue has
        been transitioned to "{{ jira_status_failed }}". Please investigate
        and repair, then reset the user's password manually.

        Target : {% for r in oracle_reset_results.results | default([]) if r.item.issue_key == fu_item.key %}{{ r.item.target_host }}:{{ r.item.target_service }}{% endfor %}

        No temporary password was issued to the requester. The failure
        report (rc/stderr only) is attached to this task.
      fu_attach_files:
      - "{{ followup_log_dir }}/CDP_{{ fu_item.key }}_failure_{{ fu_run_ts }}.log"

  # -- 7. Final summary ------------------------------------------------------

  - name: "7 | Build summary outcome lines"
    ansible.builtin.set_fact:
      summary_lines: >-
        {{
          summary_lines | default([]) + [
            '  ' + item.key
            + '   ->   ' + (item.value | upper)
            + '   (Oracle user: '
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='oracle_user')
                | first
                | default('unknown')
              )
            + ')'
          ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "7 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '======================================================',
          '  Jira Oracle Password-Reset Summary',
          '======================================================',
          '  Run timestamp   : ' + ansible_date_time.iso8601,
          '  Issues found    : ' + (jira_search.meta.issues | length | string),
          '  Resets tried    : ' + (oracle_reset_results.results | default([]) | length | string),
          '  Resets OK       : ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length | string),
          '  Resets FAILED   : ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length | string),
          '  --------------------------------------------------',
          '  Per-issue outcomes:'
        ]
        + (summary_lines | default(['  (none)']))
        + ['======================================================']
      }}
    loop_control:
      label: "summary"
