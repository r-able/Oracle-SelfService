---
# jira_execute_and_transition.yml
#
# Workflow:
#   0. Pre-flight: validate Jira API token via /rest/api/2/myself (catches
#      expired tokens that community.general.jira silently swallows as empty
#      search results)
#   1. Search Jira for all open issues matching the configured JQL
#   2. Fetch each issue to retrieve attachment metadata
#   3. Download every attachment to /tmp/<ISSUE_KEY>/
#   4. Rename any downloaded .sql attachments to .ssh
#   5. Execute each attachment as a Linux shell script
#   6. Transition the Jira issue to "Done"   if ALL scripts succeeded (rc == 0)
#   7. Transition the Jira issue to "Failed" if ANY script failed   (rc != 0)
#
# Usage:
#   ansible-playbook jira_execute_and_transition.yml --ask-vault-pass
#
# Requirements:
#   ansible-galaxy collection install community.general

- name: ServiceNow -> Download attachments -> Execute -> Close changes
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    # -- working directory under /tmp -----------------------------------------
    #    snow_work_dir: "/tmp/jira_dcr_{{ ansible_date_time.epoch }}"

    # -- built at runtime; do not edit ----------------------------------------
    issue_outcomes: {} # { "DCR-1234": "done" | "failed" }
    script_errors: {} # { "DCR-1234/script.ssh": ["ORA-00942: ...", ...] }

  # ===========================================================================
  tasks:

  # -- PRE-FLIGHT: validate API token ---------------------------------------
  #
  # community.general.jira does NOT surface Jira auth errors -- an expired or
  # invalid token causes it to silently return zero search results, making it
  # look as if no issues matched the JQL when in fact auth failed.
  #
  # Hitting /rest/api/2/myself with ansible.builtin.uri gives us an explicit
  # HTTP 401 and a clear error message before we waste any further tasks.

  - name: "0 | Create timestamped working directory"
    ansible.builtin.file:
      path: "{{ snow_work_dir }}"
      state: directory
      mode: '0755'

  # -- 1. Search Jira -------------------------------------------------------
  #
  # NOTE: the community.general.jira module's `fields` parameter expects a
  # dict, not a list. Omit it entirely -- the module returns all fields by
  # default, and Task 2 does a dedicated per-issue fetch anyway.

  # ==========================================================================
  # DCR-SPECIFIC INTAKE with environment-based approval routing
  #
  # DCR does NOT use the shared COMMON_snow_intake.yml, because its approval
  # path depends on the TARGET ENVIRONMENT of each change, which is unique to
  # DCR. The short_description format is now (REDESIGNED - was previously
  # "DCR | <ENV> | <free title>" with no real per-CR connection target at
  # all - see the connection-logic note at task 5b/5c below):
  #
  #     DCR | <HOST>:<SID>:<SCHEMA> | <free title>
  #     e.g. "DCR | lnx001:PRO:APPUSER | Q3 migration"
  #          "DCR | lnx001:DEV:APPUSER | add index"
  #
  # PROD detection now comes from the real PDB name (SID) on the selected
  # target, not a free-typed ENV word - lnx001's environment-tier PDBs use
  # "PRO" (not "PROD") as the real value, matching u_oracle_target/
  # oracle_instance_map elsewhere in this suite.
  #
  # Routing, per change request:
  #   * SID != PRO   -> no approval needed: promote new -> implement and run
  #                     immediately this pass.
  #   * SID == PRO   -> approval required (but NOT CAB -- that is configured on
  #                     the ServiceNow side via the change model): a new PROD
  #                     change is moved to 'assess' to request approval and is
  #                     NOT run this pass; it only runs on a later pass once it
  #                     has been approved and is sitting in 'implement'.
  #
  # Only CRs assigned to snow_assigned_to within snow_assignment_group are
  # considered (same ownership filter as the shared intake).
  # ==========================================================================

  - name: "0 | Pre-flight: verify instance is awake and credentials valid"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/sys_user?sysparm_limit=1"
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: dcr_preflight
    failed_when: false

  - name: "0 | Abort with a clear message if the instance is unreachable"
    ansible.builtin.fail:
      msg: >-
        ServiceNow pre-flight failed (HTTP {{ dcr_preflight.status | default('n/a') }}). If the response was not JSON, the PDI is likely HIBERNATING -- wake it at https://developer.servicenow.com and re-run. If HTTP 401, verify sn_username / sn_password in vars/main.yml.
    when: dcr_preflight.status | default(0) != 200 or dcr_preflight.json is not defined

  - name: "0 | Query DCR-tagged change requests in new or implement"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/change_request?sysparm_query={{
          ('short_descriptionSTARTSWITHDCR |^stateIN'
           + snow_state_new + ',' + snow_state_assess + ',' + snow_state_authorize
           + ',' + snow_state_scheduled + ',' + snow_state_implement
           + '^assignment_group.name=' + snow_assignment_group
           + '^assigned_to.name=' + snow_assigned_to
           + '^ORDERBYsys_created_on') | urlencode
        }}&sysparm_fields=sys_id,number,short_description,description,state,approval&sysparm_limit={{ sn_dcr_max_results | default(500) }}
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: dcr_query
    failed_when: false

  - name: "0 | Collect tagged change requests and parse target environment"
    ansible.builtin.set_fact:
      dcr_all: >-
        {{
          (dcr_query.json.result | default([]))
          | map('combine', {}) | list
        }}

  - name: "0 | Annotate each change with its target host:sid:schema and PROD flag"
    ansible.builtin.set_fact:
      dcr_annotated: >-
        {{
          dcr_annotated | default([]) + [
            item | combine({
              'dcr_target_parts': (item.short_description.split('|')[1] | default('') | trim | split(':')),
              'host':   (item.short_description.split('|')[1] | default('') | trim | split(':') | first | default('')),
              'sid':    (item.short_description.split('|')[1] | default('') | trim | split(':') | length > 1) | ternary((item.short_description.split('|')[1] | default('') | trim | split(':'))[1], ''),
              'schema': (item.short_description.split('|')[1] | default('') | trim | split(':') | length > 2) | ternary((item.short_description.split('|')[1] | default('') | trim | split(':'))[2], ''),
              'is_prod': (((item.short_description.split('|')[1] | default('') | trim | split(':') | length > 1) | ternary((item.short_description.split('|')[1] | default('') | trim | split(':'))[1], '')) | upper == 'PRO')
            })
          ]
        }}
    loop: "{{ dcr_all }}"
    loop_control:
      label: "{{ item.number }}"

  - name: "0 | WARN and skip any change whose target isn't HOST:SID:SCHEMA"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.number }} has a malformed target field ('{{ item.short_description.split('|')[1] | default('') | trim }}') -- expected 'HOST:SID:SCHEMA'. It will be treated as non-PROD/unroutable until corrected.
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }}"
    when: item.host | length == 0 or item.sid | length == 0 or item.schema | length == 0

  - name: "0 | Intake summary"
    ansible.builtin.debug:
      msg: >-
        DCR: {{ dcr_annotated | default([]) | length }} tagged change(s) -- {{ dcr_annotated | default([]) | map(attribute='number')
           | zip(dcr_annotated | default([]) | map(attribute='host'), dcr_annotated | default([]) | map(attribute='sid'), dcr_annotated | default([]) | map(attribute='schema')) | list }}.
        Only changes assigned to '{{ snow_assigned_to }}' in '{{ snow_assignment_group }}' are considered.

  # -- Non-PROD: promote straight to implement (no approval) ------------------
  # Standard/pre-approved changes must walk the state lifecycle in order
  # (new -> scheduled -> implement); ServiceNow's "Change Model: Check State
  # Transition" business rule rejects a direct new -> implement jump. The
  # servicenow.itsm module also requires assignment_group (and we keep
  # assigned_to) present on these writes, so both are passed every step.
  # Non-PROD DCRs need no approval, so we walk both steps here; a WARNING
  # surfaces any CR the model still refuses instead of silently leaving it New.
  - name: "0 | Promote NON-PROD new changes to scheduled (step 1 of 2)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: scheduled
      assignment_group: "{{ snow_assignment_group }}"
      other:
        assigned_to: "{{ snow_assigned_to }}"
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - not item.is_prod
    - item.state == snow_state_new
    register: dcr_promote_sched
    failed_when: false

  - name: "0 | Promote NON-PROD changes to implement (step 2 of 2)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: implement
      assignment_group: "{{ snow_assignment_group }}"
      other:
        assigned_to: "{{ snow_assigned_to }}"
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - not item.is_prod
    - item.state in [snow_state_new, snow_state_scheduled]
    register: dcr_promote_impl
    failed_when: false

  - name: "0 | WARN about any NON-PROD change that could not be advanced to implement"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.item.number }} ({{ item.item.host }}:{{ item.item.sid }}) could not be moved to implement: {{ item.msg | default('see ServiceNow change model / required fields') }}. It will remain in its current state and not run this pass.
    loop: "{{ dcr_promote_impl.results | default([]) }}"
    loop_control:
      label: "{{ item.item.number | default('skipped') }}"
    when:
    - item is not skipped
    - item.failed | default(false)

  # -- PROD: request approval on new changes (move to assess), do NOT run yet -
  - name: "0 | Request approval for PROD new changes (state=assess, no CAB)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: assess
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - item.is_prod
    - item.state == snow_state_new
    - item.approval in ['not requested', 'not_requested', '']
    failed_when: false

  - name: "0 | Note PROD changes awaiting approval"
    ansible.builtin.debug:
      msg: >-
        PROD change {{ item.number }} requires approval before it will run. It is at Assess with approval requested and will execute on a later pass once approved. CAB is not required.
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }}"
    when:
    - item.is_prod
    - item.state == snow_state_assess
    - item.approval != 'approved'

  # -- PROD, once APPROVED: walk Assess -> Authorize -> Scheduled -> Implement
  # The change model refuses each of these hops until the approval is granted,
  # so these only fire for PROD changes sitting at Assess with approval=approved.
  - name: "0 | APPROVED PROD: assess -> authorize"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: authorize
      assignment_group: "{{ snow_assignment_group }}"
      other:
        assigned_to: "{{ snow_assigned_to }}"
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - item.is_prod
    - item.state == snow_state_assess
    - item.approval == 'approved'
    failed_when: false

  - name: "0 | APPROVED PROD: authorize -> scheduled"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: scheduled
      assignment_group: "{{ snow_assignment_group }}"
      other:
        assigned_to: "{{ snow_assigned_to }}"
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - item.is_prod
    - item.state in [snow_state_assess, snow_state_authorize]
    - item.approval == 'approved'
    failed_when: false

  - name: "0 | APPROVED PROD: scheduled -> implement"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ item.sys_id }}"
      state: implement
      assignment_group: "{{ snow_assignment_group }}"
      other:
        assigned_to: "{{ snow_assigned_to }}"
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }} ({{ item.host }}:{{ item.sid }})"
    when:
    - item.is_prod
    - item.state in [snow_state_assess, snow_state_authorize, snow_state_scheduled]
    - item.approval == 'approved'
    failed_when: false

  # -- Re-query for the executable queue -------------------------------------
  # A change is executable when it is in 'implement' AND (non-PROD, or PROD
  # whose approval has been granted -- approval not in requested/rejected).
  - name: "0 | Re-query for the executable queue"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/change_request?sysparm_query={{
          ('short_descriptionSTARTSWITHDCR |^state=' + snow_state_implement
           + '^assignment_group.name=' + snow_assignment_group
           + '^assigned_to.name=' + snow_assigned_to
           + '^ORDERBYsys_created_on') | urlencode
        }}&sysparm_fields=sys_id,number,short_description,description,state,approval&sysparm_limit={{ sn_dcr_max_results | default(500) }}
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: dcr_query2
    failed_when: false

  # Re-attach each executable item's already-parsed host/sid/schema from
  # dcr_annotated (matched by sys_id) rather than re-parsing short_description
  # a second time - the re-query above only returns raw ServiceNow fields, it
  # does not carry over the annotation set earlier in this same run. This is
  # NEW as of the host:sid:schema redesign - execution never needed a real
  # per-CR target before, since every script ran against the same fixed
  # dcr_connect_credentials regardless of what ENV said.
  - name: "0 | Build a sys_id -> annotation lookup dict from dcr_annotated"
    ansible.builtin.set_fact:
      dcr_annotation_by_sysid: >-
        {{
          dcr_annotation_by_sysid | default({}) | combine({
            item.sys_id: { 'host': item.host, 'sid': item.sid, 'schema': item.schema }
          })
        }}
    loop: "{{ dcr_annotated | default([]) }}"
    loop_control:
      label: "{{ item.number }}"

  - name: "0 | Build executable work list, re-attaching host/sid/schema per item"
    ansible.builtin.set_fact:
      snow_work: >-
        {{
          snow_work | default([]) + [
            item | combine(dcr_annotation_by_sysid.get(item.sys_id, {'host': '', 'sid': '', 'schema': ''}))
          ]
        }}
    loop: "{{ dcr_query2.json.result | default([]) | rejectattr('approval', 'in', ['requested', 'rejected']) | list }}"
    loop_control:
      label: "{{ item.number }}"

  - name: "0 | Build sys_id map"
    ansible.builtin.set_fact:
      snow_cr_map: >-
        {{
          dict(
            (dcr_query2.json.result | default([]) | map(attribute='number') | list)
            | zip(dcr_query2.json.result | default([]) | map(attribute='sys_id') | list)
          )
        }}

  - name: "0 | Executable queue"
    ansible.builtin.debug:
      msg: >-
        DCR: {{ snow_work | length }} change(s) ready to execute ({{ snow_work | map(attribute='number') | list | join(', ') | default('none', true) }})

  - name: "1 | Abort if no work found"
    ansible.builtin.debug:
      msg: "No DCR changes are ready to execute this pass (non-PROD run immediately; PROD run once approved). Exiting cleanly."
    when: snow_work | length == 0

  - name: "1 | End play gracefully when queue is empty"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  # -- 3. Create a per-change subdirectory ----------------------------------

  - name: "3 | Create per-change subdirectory in {{ snow_work_dir }}"
    ansible.builtin.file:
      path: "{{ snow_work_dir }}/{{ item.number }}"
      state: directory
      mode: '0755'
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"

  # -- 4. Download attachments ----------------------------------------------
  #
  # ServiceNow attachments live in their own table. For each change request:
  #   GET /api/now/attachment?sysparm_query=table_name=change_request
  #                                        ^table_sys_id=<sys_id>
  # Each attachment record provides file_name and download_link (basic auth).
  # Only .sql attachments are downloaded (case-insensitive); everything else
  # is silently skipped.

  - name: "4 | List attachments on each change request"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/attachment?sysparm_query={{
          ('table_name=change_request^table_sys_id=' + item.sys_id) | urlencode
        }}&sysparm_fields=file_name,download_link,size_bytes
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    register: snow_att_lists
    failed_when: false

  - name: "4 | Build change -> attachment pairs"
    ansible.builtin.set_fact:
      snow_att_src: >-
        {{
          snow_att_src | default([]) + [{
            'key':  item.item.number,
            'atts': item.json.result | default([])
          }]
        }}
    loop: "{{ snow_att_lists.results | default([]) }}"
    loop_control:
      label: "{{ item.item.number }}"

  # A change can carry two attachments with the SAME filename (different
  # sys_ids). Because each downloads to <change>/<file_name>, duplicates would
  # collapse onto one path and one script would be silently lost. Warn loudly
  # so the situation is visible; the .sql files themselves still process.
  - name: "4 | WARN about duplicate .sql filenames on a change"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.key }} has duplicate .sql attachment name(s): {{ dup_names | join(', ') }}. Only one copy of each name is executed (same-named attachments share a download path). Give each script a unique file name if all must run.
    loop: "{{ snow_att_src | default([]) }}"
    loop_control:
      label: "{{ item.key }}"
    vars:
      sql_names: >-
        {{ item.atts | default([]) | map(attribute='file_name')
           | select('search', '(?i)\\.sql$') | list }}
      dup_names: >-
        {{ sql_names | community.general.counter | dict2items
           | selectattr('value', 'gt', 1) | map(attribute='key') | list }}
    when: dup_names | length > 0

  - name: "4 | Download .sql attachments from ServiceNow (case-insensitive)"
    ansible.builtin.get_url:
      url: "{{ item.1.download_link }}"
      dest: "{{ snow_work_dir }}/{{ item.0.key }}/{{ item.1.file_name }}"
      url_username: "{{ sn_username }}"
      url_password: "{{ sn_password }}"
      force_basic_auth: true
      mode: '0755' # executable from the start
    loop: >-
      {{
        snow_att_src | default([])
        | subelements('atts', skip_missing=True)
      }}
    loop_control:
      label: "{{ item.0.key }} / {{ item.1.file_name }}"
    when: item.1.file_name | lower | regex_search('\.sql$') is not none
    register: download_results
    ignore_errors: true

  # -- 4b. Rename .sql attachments to .ssh ----------------------------------
  #
  # Only renames files that:
  #   a) downloaded successfully  (not item.failed)
  #   b) have a .sql extension    (regex_search check on original filename)
  #
  # item.dest  -> e.g. /tmp/jira_dcr_.../DCR-5569/script.sql
  # renamed    -> e.g. /tmp/jira_dcr_.../DCR-5569/script.ssh
  #
  # FIX: same "is not none" fix applied here.

  - name: "4b | Rename downloaded .sql attachments to .ssh"
    # Use bash parameter expansion  ${f%.*}  to strip the extension regardless
    # of case (.sql / .SQL / .Sql all work), then append .ssh.
    # This avoids the regex_replace case-sensitivity bug where .SQL filenames
    # produced identical source/dest paths and caused mv to fail.
    ansible.builtin.shell:
      cmd: >-
        f="{{ item.dest }}"; if [ -f "$f" ]; then
          mv -f "$f" "${f%.*}.ssh";
        elif [ -f "${f%.*}.ssh" ]; then
          echo "already renamed";
        else
          echo "source missing: $f" >&2; exit 1;
        fi
    loop: "{{ download_results.results }}"
    loop_control:
      label: "{{ item.item.0.key }} / {{ item.item.1.file_name }} -> {{ item.item.1.file_name | regex_replace('(?i)\\.sql$', '.ssh') }}"
    when:
    - not (item.failed | default(false))
    - item.dest is defined
    - item.item.1.file_name | lower | regex_search('\.sql$') is not none
    register: rename_results

  - name: "4b | Show rename results"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.item.0.key }} / {{ item.item.item.1.file_name }} -> {{ item.item.item.1.file_name | regex_replace('(?i)\\.sql$', '.ssh') }} ({{ 'renamed OK' if not (item.failed | default(false)) else 'FAILED to rename' }})
    loop: "{{ rename_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.item.0.key }}"
    when: rename_results.results is defined

  # -- 5. Gather downloaded scripts per issue -------------------------------
  #
  # Build a flat list of dicts: { issue_key, script_path }
  # For .sql files the path is updated to the renamed .ssh path.
  # Only includes files whose download succeeded (failed=false).
  #
  # FIX: regex_search inside a Jinja2 expression (the inline `if`) also needs
  # "is not none" -- "| bool" has no effect inside Jinja2 string expressions.

  # Lookup dict from issue_key (CR number) -> host/sid/schema, built from
  # snow_work (which already carries the re-attached annotation from the
  # sys_id lookup above). Needed because scripts_to_run is keyed by issue_key,
  # not sys_id.
  - name: "5 | Build issue_key -> host/sid/schema lookup from snow_work"
    ansible.builtin.set_fact:
      dcr_target_by_key: >-
        {{
          dcr_target_by_key | default({}) | combine({
            item.number: { 'host': item.host, 'sid': item.sid, 'schema': item.schema }
          })
        }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"

  - name: "5 | Build list of successfully downloaded scripts"
    ansible.builtin.set_fact:
      scripts_to_run: >-
        {{
          scripts_to_run | default([]) + [{
            'issue_key': item.item.0.key,
            'host':   dcr_target_by_key.get(item.item.0.key, {}).get('host', ''),
            'sid':    dcr_target_by_key.get(item.item.0.key, {}).get('sid', ''),
            'schema': dcr_target_by_key.get(item.item.0.key, {}).get('schema', ''),
            'script_path': (
              item.dest | regex_replace('\.sql$', '.ssh')
              if item.item.1.file_name | lower | regex_search('\.sql$') is not none
              else item.dest
            )
          }]
        }}
    loop: "{{ download_results.results }}"
    loop_control:
      label: "{{ item.item.0.key }} / {{ item.item.1.file_name }}"
    when:
    - not (item.failed | default(false))
    - item.dest is defined

  - name: "5 | Warn if no scripts were downloaded"
    ansible.builtin.debug:
      msg: "WARNING: No attachments were downloaded successfully. Nothing to execute."
    when: scripts_to_run | default([]) | length == 0

  - name: "5 | WARN and skip any script whose target host is not in oracle_instance_map"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.issue_key }} / {{ item.script_path | basename }} targets host '{{ item.host }}' which is not in oracle_instance_map - this script will fail at connection time rather than being silently skipped. Fix the CR's short_description and re-run.
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.host not in oracle_instance_map

  # -- 5b/5c/5e. Wrap each script with a DYNAMIC per-CR connection header ----
  #
  # REDESIGNED (host:sid:schema): previously every script was wrapped with
  # the SAME fixed dcr_connect_credentials/dcr_oracle_home regardless of what
  # the CR's ENV field said - DCR never actually had a real per-CR connection
  # target before. Now each script connects to the specific host/sid chosen
  # on the CR and sets its session to the chosen schema before running.
  #
  # Connects via network auth (oracle_dba_user/oracle_dba_pass), same model
  # CAU/REF already use for PDB-level work, rather than OS-level sysdba auth -
  # this is required since we're now targeting a specific host+PDB per
  # request rather than always running locally on a single fixed host.
  #
  # insertbefore: BOF stacks in REVERSE of desired final order - each new
  # insert lands above everything already there. To get final top-to-bottom
  # order [oracle_home_export, CONNECT, ALTER SESSION, ...script...], we
  # insert ALTER SESSION first, then CONNECT, then the oracle_home export
  # last (see the original 5b/5c ordering this replaces, which relied on the
  # exact same stacking behavior with 2 lines instead of 3).

  - name: "5b | Insert ALTER SESSION SET CURRENT_SCHEMA at top of each script"
    ansible.builtin.lineinfile:
      path: "{{ item.script_path }}"
      line: "ALTER SESSION SET CURRENT_SCHEMA = {{ item.schema }};"
      insertbefore: BOF
      backup: false
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.script_path | basename }}"
    when: item.host in oracle_instance_map

  - name: "5c | Insert CONNECT line (network auth, per-CR host:sid) at top of each script"
    ansible.builtin.lineinfile:
      path: "{{ item.script_path }}"
      line: "CONNECT {{ oracle_dba_user }}/{{ oracle_dba_pass }}@//{{ item.host }}:{{ oracle_port }}/{{ item.sid }}"
      insertbefore: BOF
      backup: false
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.script_path | basename }}"
    when: item.host in oracle_instance_map

  - name: "5e | Insert ORACLE_HOME export + sqlplus opener at top of each script"
    ansible.builtin.lineinfile:
      path: "{{ item.script_path }}"
      line: "export ORACLE_HOME={{ oracle_instance_map[item.host].oracle_home }}; export PATH=$ORACLE_HOME/bin:$PATH; sqlplus -s /nolog <<EOF"
      insertbefore: BOF
      backup: false
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.script_path | basename }}"
    when: item.host in oracle_instance_map

  - name: "5d | Append EOF footer at bottom of each script"
    ansible.builtin.lineinfile:
      path: "{{ item.script_path }}"
      line: "EOF"
      insertafter: EOF
      backup: false
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.script_path | basename }}"

  # -- 6. Execute each script -----------------------------------------------
  #
  # stdout and stderr are captured natively by Ansible (no shell redirect).
  # A follow-up task writes the combined log file explicitly so we still get
  # the .log artifact on disk for upload to Jira in Task 10.
  # ignore_errors: true so the playbook continues even when a script fails.

  - name: "6 | Execute shell scripts"
    ansible.builtin.shell:
      cmd: "bash {{ item.script_path | quote }}"
      chdir: "{{ snow_work_dir }}/{{ item.issue_key }}"
    loop: "{{ scripts_to_run | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} | {{ item.script_path | basename }}"
    register: exec_results
    ignore_errors: true
    no_log: false

  # -- 6a. Write captured output to .log files ------------------------------
  #
  # Now that stdout/stderr are captured by Ansible rather than redirected in
  # the shell command, we write the combined log explicitly so Task 10 can
  # still upload it to Jira.

  - name: "6a | Write execution output to .log file"
    ansible.builtin.copy:
      content: |
        === STDOUT ===
        {{ item.stdout | default('(no stdout)') }}
        === STDERR ===
        {{ item.stderr | default('(no stderr)') }}
        === EXIT CODE: {{ item.rc }} ===
      dest: "{{ item.item.script_path }}.log"
      mode: '0644'
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.script_path | basename }}.log"

  # -- 6b. Show per-script execution results --------------------------------
  #
  # stdout slicing is done in a set_fact first because Jinja2 inside
  # debug msg strings does not support Python-style [-N:] slice syntax.
  # The set_fact builds a lookup dict keyed by "ISSUE/script.ssh" so
  # the debug task can retrieve the pre-sliced tail by key.

  - name: "6b | Build stdout tail lookup (last 10 non-empty lines per script)"
    ansible.builtin.set_fact:
      exec_stdout_tails: >-
        {{
          exec_stdout_tails | default({}) | combine({
            item.item.issue_key + '/' + (item.item.script_path | basename): (
              item.stdout | default('(no stdout)')
            ).splitlines() | reject('equalto', '') | list | join('\n---\n')
          })
        }}
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.script_path | basename }}"

  - name: "6b | Show execution results per script"
    ansible.builtin.debug:
      msg:
      - "--------------------------------------------------------"
      - "  Issue  : {{ item.item.issue_key }}"
      - "  Script : {{ item.item.script_path | basename }}"
      - "  Result : {{ 'SUCCESS' if item.rc == 0 else 'FAILED' }}  (rc={{ item.rc }})"
      - "  -- stdout ------------------------------------------"
      - "{{ exec_stdout_tails[item.item.issue_key + '/' + (item.item.script_path | basename)] | default('(no stdout)') | replace('

        ---

        ', '

        ') }}"
      - "  -- stderr ------------------------------------------"
      - "{{ item.stderr | default('(none)') | trim }}"
      - "--------------------------------------------------------"
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.script_path | basename }}"

  # -- 6c. Parse error lines from each log file -----------------------------
  #
  # Reads the .log file written in 6a and extracts lines matching common
  # Oracle / shell error patterns:
  #   ORA-nnnnn   -> Oracle database errors
  #   SP2-nnnnn   -> SQL*Plus errors
  #   ERROR       -> generic shell/script errors
  #   WARN        -> warnings worth capturing
  #
  # Builds script_errors dict:
  #   { "DCR-1234/script.ssh": { "lines": [...], "count": N } }

  - name: "6c | Read log file for each executed script"
    ansible.builtin.slurp:
      src: "{{ item.item.script_path }}.log"
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.script_path | basename }}.log"
    register: log_contents
    ignore_errors: true

  - name: "6c | Extract and count error lines from each log"
    ansible.builtin.set_fact:
      script_errors: >-
        {{
          script_errors | combine({
            item.item.item.issue_key + '/' + item.item.item.script_path | basename: {
              'rc': item.item.rc,
              'error_lines': (
                (item.content | b64decode).splitlines()
                | select('search', '(ORA-[0-9]+|SP2-[0-9]+|ERROR|WARN)', ignorecase=True)
                | list
              ),
              'error_count': (
                (item.content | b64decode).splitlines()
                | select('search', '(ORA-[0-9]+|SP2-[0-9]+|ERROR|WARN)', ignorecase=True)
                | list
                | length
              )
            }
          })
        }}
    loop: "{{ log_contents.results | default([]) }}"
    loop_control:
      label: "{{ item.item.item.issue_key }} / {{ item.item.item.script_path | basename }}"
    when:
    - not (item.failed | default(false))
    - item.content is defined

  # -- 6d. Show detailed error report per failed script ---------------------
  #
  # Only fires for scripts that actually failed (rc != 0).
  # Prints every captured error line with its index so the operator can
  # locate it quickly in the full .log file.

  - name: "6d | Show detailed error report for failed scripts"
    ansible.builtin.debug:
      msg:
      - "========================================================"
      - "  ERROR REPORT"
      - "  Issue  : {{ item.item.item.issue_key }}"
      - "  Script : {{ item.item.item.script_path | basename }}"
      - "  rc     : {{ item.item.rc }}"
      - "  Errors found : {{ script_errors[item.item.item.issue_key + '/' + (item.item.item.script_path | basename)] .error_count | default(0) }}"
      - "  -- Error lines -------------------------------------"
      - >-
        {{
          script_errors[
            item.item.item.issue_key + '/' + (item.item.item.script_path | basename)
          ].error_lines | default(['(no matching error lines found -- check full log)'])
          | join('\n')
        }}
      - "========================================================"
    loop: "{{ log_contents.results | default([]) }}"
    loop_control:
      label: "{{ item.item.item.issue_key }} / {{ item.item.item.script_path | basename }}"
    when:
    - not (item.failed | default(false))
    - item.item.rc != 0

  # -- 7. Compute per-issue outcome -----------------------------------------
  #
  # An issue is "done"   only if EVERY one of its scripts returned rc == 0.
  # An issue is "failed" if ANY script returned rc != 0.
  # We build issue_outcomes = { "DCR-1234": "done", "DCR-1235": "failed", ... }

  - name: "7 | Mark issue as FAILED if any script returned non-zero"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{
          issue_outcomes | combine({ item.item.issue_key: 'failed' })
        }}
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }}"
    when: item.rc != 0

  - name: "7 | Mark issue as DONE if not already marked failed"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{
          issue_outcomes | combine({ item.item.issue_key: 'done' })
        }}
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }}"
    when:
    - item.rc == 0
    - item.item.issue_key not in issue_outcomes

  - name: "7 | Show final per-issue outcomes"
    ansible.builtin.debug:
      msg: "{{ item.key }} -> {{ item.value | upper }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  # -- 7b. Post worklog summary per issue ------------------------------------
  #
  # One worklog entry per issue: overall outcome plus per-script result and
  # a truncated slice of each script's output. Full untruncated output is
  # already attached as .log files in Task 10, so truncation here only
  # affects the inline summary, not the audit trail.

  - name: "7b | Post work-note summary per change"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ snow_cr_map[item.key] }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      status_code: 200
      body_format: json
      body:
        work_notes: |-
          Automated DCR execution -- {{ ansible_date_time.iso8601 }}
          Overall result: {{ item.value | upper }}
          Executed by: {{ sn_username }} (Ansible automation)
          Work dir: {{ snow_work_dir }}
          Scripts run: {{ exec_results.results | default([])
                          | selectattr('item.issue_key', 'equalto', item.key)
                          | list | length }}
          Scripts failed: {{ exec_results.results | default([])
                             | selectattr('item.issue_key', 'equalto', item.key)
                             | selectattr('rc', 'ne', 0)
                             | list | length }}

          Per-script results:
          {% for r in exec_results.results | default([])
                if r.item.issue_key == item.key %}
          --- {{ r.item.script_path | basename }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ---
          {{ r.stdout | default('(no stdout)') | trim | truncate(800, True) }}
          {% if r.rc != 0 %}
          stderr: {{ r.stderr | default('(none)') | trim | truncate(400, True) }}
          error lines: {{ script_errors[item.key + '/' + (r.item.script_path | basename)].error_lines
                          | default(['(none extracted)']) | join(' | ') | truncate(600, True) }}
          {% endif %}
          {% endfor %}

          Full output attached as .log files on this change request.
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }} ({{ item.value }})"
    ignore_errors: true

  # -- 8/9. Close change requests based on outcome ---------------------------

  - name: "8 | Move SUCCESSFUL changes to review"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: review
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "8 | Close SUCCESSFUL changes (close_code successful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: closed
      close_code: successful
      close_notes: |-
        Automated DCR execution COMPLETED - {{ ansible_date_time.iso8601 }}
        All scripts returned rc=0. Per-script evidence is in the work notes
        and the full output is attached as .log files on this change.
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  # A FAILED change must walk implement -> review -> closed exactly like a
  # successful one. Jumping straight to closed is refused by the change model's
  # "Check State Transition" business rule, which (with failed_when: false)
  # silently leaves the change in Implement -- so the next cron pass picks it
  # up again, re-runs the failing script and raises ANOTHER follow-up, forever.
  - name: "9 | Move FAILED changes to review (required before closing)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: review
      assignment_group: "{{ snow_assignment_group }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'failed'
    register: dcr_fail_review
    failed_when: false

  - name: "9 | Close FAILED changes (close_code unsuccessful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: closed
      close_code: unsuccessful
      close_notes: "Automated DCR execution failed; see work notes, the attached .log files, and the DBA repair follow-up change."
      assignment_group: "{{ snow_assignment_group }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'failed'
    register: dcr_fail_close
    failed_when: false

  # Loud warning if a failed change could NOT be closed. An un-closed change
  # stays in the intake queue and will be re-executed on the next pass, so this
  # must never fail silently again.
  - name: "9 | WARN if a FAILED change could not be closed"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.item.key }} could not be closed ({{ item.msg | default('unknown error') }}). It will remain in the intake queue and be RE-EXECUTED on the next pass, raising another follow-up. Close it manually in ServiceNow.
    loop: "{{ dcr_fail_close.results | default([]) }}"
    loop_control:
      label: "{{ item.item.key | default('skipped') }}"
    when:
    - item is not skipped
    - item.failed | default(false)

  - name: "10 | Upload execution logs as ServiceNow attachments"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/attachment/file?table_name=change_request&table_sys_id={{
          snow_cr_map[item.item.issue_key]
        }}&file_name={{ (item.item.script_path | basename) + '.log' | urlencode }}
      method: POST
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      headers:
        Content-Type: "text/plain"
      src: "{{ item.item.script_path }}.log"
      status_code: 201
    loop: "{{ exec_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.script_path | basename }}.log"
    ignore_errors: true

  # -- 10b. Create DBA repair follow-up task per FAILED issue -----------------
  #
  # One follow-up per failed issue, created in the same project, in "To Do",
  # for the Database Administrators. A consolidated failure report plus the
  # per-script .log files from this run are attached to the follow-up.

  - name: "10b | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: snow_followup_enabled | default(true) | bool

  - name: "10b | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - snow_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "10b | Write failure report per FAILED issue"
    ansible.builtin.copy:
      content: |
        Automated DCR Execution FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue    : {{ item.key }}
        Work dir : {{ snow_work_dir }}

        Per-script results:
        {% for r in exec_results.results | default([]) if r.item.issue_key == item.key %}
        --- {{ r.item.script_path | basename }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ---
        {% if r.rc != 0 %}
        stderr: {{ r.stderr | default('(none)') | trim }}
        error lines: {{ script_errors[item.key + '/' + (r.item.script_path | basename)].error_lines | default(['(none extracted)']) | join(' | ') }}
        {% endif %}
        {% endfor %}

        The full untruncated per-script output is in the attached .log files.
      dest: "{{ followup_log_dir }}/DCR_{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "10b | Create DBA repair follow-up change for FAILED changes"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_tag: "DCR"
      fu_original_number: "{{ fu_item.key }}"
      fu_original_sys_id: "{{ snow_cr_map[fu_item.key] }}"
      fu_summary: "DBA repair required: data change scripts failed for {{ fu_item.key }}"
      fu_description: |-
        Automated data change (DCR) execution FAILED and the change request
        has been closed unsuccessful. Please investigate
        and repair.

        Scripts run    : {{ exec_results.results | default([]) | selectattr('item.issue_key', 'equalto', fu_item.key) | list | length }}
        Scripts failed : {{ exec_results.results | default([]) | selectattr('item.issue_key', 'equalto', fu_item.key) | selectattr('rc', 'ne', 0) | list | length }}
        Work dir       : {{ snow_work_dir }}

        The failure report and the full execution logs for every script in
        this run are attached to this change request.
      fu_attach_files: >-
        {{
          [followup_log_dir + '/DCR_' + fu_item.key + '_failure_' + fu_run_ts + '.log']
          + (exec_results.results | default([])
             | selectattr('item.issue_key', 'equalto', fu_item.key)
             | map(attribute='item.script_path') | list
             | map('regex_replace', '$', '.log') | list)
        }}

  # -- 11. Final summary -----------------------------------------------------
  #
  # Builds summary_outcome_lines (one line per issue) and
  # summary_error_lines (one block per failed script) via set_fact loops,
  # then prints everything in a single debug task.
  #
  # Using set_fact loops is the only reliable way to get Ansible's debug
  # module to print one item per line -- passing a Jinja2 list expression
  # causes it to render the entire list as a single inline string.

  - name: "11 | Build per-issue outcome lines for summary"
    ansible.builtin.set_fact:
      summary_outcome_lines: >-
        {{
          summary_outcome_lines | default([])
          + ['    ' + item.key + '   ->   ' + (item.value | upper)
             + (
                 '  (' + (
                   script_errors
                   | dict2items
                   | selectattr('key', 'search', '^' + item.key + '/')
                   | map(attribute='value')
                   | map(attribute='error_count')
                   | sum
                   | string
                 ) + ' error line(s) found)'
                 if item.value == 'failed'
                 else ''
               )
            ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "11 | Build per-script error detail lines for summary"
    ansible.builtin.set_fact:
      summary_error_lines: >-
        {{
          summary_error_lines | default([])
          + ['  -- ' + item.key + ' (rc=' + (item.value.rc | string) + ', ' + (item.value.error_count | string) + ' error line(s)) --']
          + (item.value.error_lines | default(['(no matching error lines)']) | map('regex_replace', '^', '      ') | list)
        }}
    loop: "{{ script_errors | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value.rc != 0

  - name: "11 | Build final summary header lines"
    ansible.builtin.set_fact:
      summary_header_lines:
      - "======================================================"
      - "  ServiceNow DCR Execution Summary"
      - "======================================================"
      - "  Run timestamp  : {{ ansible_date_time.iso8601 }}"
      - "  Work dir       : {{ snow_work_dir }}"
      - "  Changes found  : {{ snow_work | length }}"
      - "  Scripts run    : {{ exec_results.results | default([]) | length }}"
      - "  Scripts failed : {{ exec_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length }}"
      - "  Total errors   : {{ script_errors.values() | map(attribute='error_count') | sum }}"
      - "  ----------------------------------------------------"
      - "  Per-issue outcomes:"

  - name: "11 | Print summary header"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: "{{ summary_header_lines }}"
    loop_control:
      label: "header"

  - name: "11 | Print per-issue outcome lines"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: "{{ summary_outcome_lines | default(['    (none)']) }}"
    loop_control:
      label: "outcome"

  - name: "11 | Print error detail header"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop:
    - "  ----------------------------------------------------"
    - "  Error detail (failed scripts only):"
    loop_control:
      label: "error header"

  - name: "11 | Print per-script error detail lines"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: "{{ summary_error_lines | default(['    (no errors -- all scripts succeeded)']) }}"
    loop_control:
      label: "error detail"

  - name: "11 | Print summary footer"
    ansible.builtin.debug:
      msg: "======================================================"

  - name: "12 | Rename {{ snow_work_dir }} to {{ snow_work_dir }}_failed (failed runs only)"
    ansible.builtin.command:
      cmd: "mv {{ snow_work_dir }} {{ snow_work_dir }}_failed"
    when: >-
      issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "12 | Confirm final working directory path"
    ansible.builtin.debug:
      msg: >-
        Working directory: {{
          snow_work_dir + '_failed'
          if issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0
          else snow_work_dir
        }}
