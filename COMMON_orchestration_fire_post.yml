---
# COMMON_orchestration_fire_post.yml
#
# Called by a domain module at the exact point it currently marks a CR
# successful. Checks the dependency registry for 'post' dependencies on
# this CI and opens the dependent change request(s) for each.
#
# Required vars from the caller:
#   orch_ci           : the CI name that just succeeded, e.g. "lnx001:CDB1"
#   orch_primary_key  : the primary CR's number, e.g. CHG0033120
#   orchestration_run_id : if a run was already created during the gate
#                          check for this same CI/CR (reuse it); pass ''
#                          if none exists yet and this task will create one

- name: "ORCH-POST | {{ orch_primary_key }} | Find registered post-dependencies for {{ orch_ci }}"
  ansible.builtin.set_fact:
    orch_post_deps: >-
      {{ dependency_registry | default([]) | selectattr('ci', 'equalto', orch_ci) | selectattr('relationship', 'equalto', 'post') | list }}

- name: "ORCH-POST | {{ orch_primary_key }} | Nothing to do - no post-dependencies registered"
  ansible.builtin.debug:
    msg: "No post-dependencies registered for {{ orch_ci }} - nothing to fire."
  when: orch_post_deps | length == 0

- name: "ORCH-POST | {{ orch_primary_key }} | Ensure a run ID exists (reuse the gate-check run, or create one)"
  ansible.builtin.set_fact:
    orchestration_run_id: "{{ orch_ci | regex_replace('[^A-Za-z0-9]', '-') }}-{{ orch_primary_key }}-{{ '%Y%m%dT%H%M%S' | strftime }}"
  when:
  - orch_post_deps | length > 0
  - orchestration_run_id | default('') | length == 0

- name: "ORCH-POST | {{ orch_primary_key }} | Insert the orchestration_run record if it didn't already exist"
  ansible.builtin.uri:
    url: "{{ sn_instance }}/api/now/table/u_orchestration_run"
    method: POST
    user: "{{ sn_username }}"
    password: "{{ sn_password }}"
    force_basic_auth: true
    body_format: json
    body:
      u_run_id: "{{ orchestration_run_id }}"
      u_primary_ci: "{{ orch_ci }}"
      u_primary_key: "{{ orch_primary_key }}"
      u_status: "in_progress"
    status_code: 201
  when:
  - orch_post_deps | length > 0
  - orch_run_already_existed | default(false) == false
  failed_when: false

- name: "ORCH-POST | {{ orch_primary_key }} | Spawn a dependent change for each registered post-dependency"
  ansible.builtin.include_tasks: COMMON_orchestration_spawn_step.yml
  loop: "{{ orch_post_deps }}"
  loop_control:
    loop_var: orch_dep
    index_var: orch_sequence_order
    label: "{{ orch_dep.depends_on_ci }}"
  when: orch_post_deps | length > 0
