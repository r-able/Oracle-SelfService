# Example inventory — point this at your own Oracle+Linux VM.
# The hostname here (lnx001) must exactly match oracle_target_host in
# vars/demo_vars.yml.

[oracle_hosts]
lnx001 ansible_host=192.168.1.107 ansible_user=ansible_admin
lnx002  ansible_host=192.168.1.246 ansible_become_password=oracle
lnx003  ansible_host=192.168.1.223 ansible_become_password=oracle ansible_python_interpreter=/opt/rh/rh-python38/root/usr/bin/python3 ansible_pipelining=True
