---
# =============================================================================
# SNOW_UPG_oracle_upgrade_job.yml
#
# Per-issue Oracle 21c -> 26ai AutoUpgrade job. Included from
# jira_oracle_upgrade.yml with loop_var `job`:
#     job.issue_key   e.g. UPG-1
#     job.summary     issue summary text
#     job.oracle_sid  e.g. CDB1 (case-sensitive, used verbatim)
#
# Reference: https://oracle-base.com/articles/26/multitenant-upgrade-to-26-autoupgrade
#
# Notes on established environment quirks (still honoured here):
#   * `become_user: oracle` under sudo strips env vars -> all Oracle work is
#     done via temp shell scripts with explicit exports, never `environment:`.
#   * AutoUpgrade must run with -noconsole for non-interactive use.
#   * Stale recovery data from a previously interrupted deploy makes
#     AutoUpgrade exit rc=1 ("There is an unfinished execution of a deploy
#     mode..."). We detect that in rescue, post a targeted worklog, and
#     transition the issue to Failed. Recovery data is NEVER cleared
#     automatically -- clearing while the CDB is mid-upgrade would strand it.
# =============================================================================

# ---- Per-job derived paths --------------------------------------------------
- name: "JOB | {{ job.issue_key }} | Set per-job facts"
  ansible.builtin.set_fact:
    job_dir: "{{ autoupgrade_base }}/{{ job.oracle_sid }}_{{ job.issue_key }}"
    job_cfg: "{{ autoupgrade_base }}/{{ job.oracle_sid }}_{{ job.issue_key }}/autoupgrade.cfg"
    job_log_dir: "{{ autoupgrade_base }}/{{ job.oracle_sid }}_{{ job.issue_key }}/log"
    analyze_script: "/tmp/upg_analyze_{{ job.oracle_sid }}_{{ job.issue_key }}.sh"
    deploy_script: "/tmp/upg_deploy_{{ job.oracle_sid }}_{{ job.issue_key }}.sh"
    verify_script: "/tmp/upg_verify_{{ job.oracle_sid }}_{{ job.issue_key }}.sh"
    job_failed_reason: ""

- name: "JOB | {{ job.issue_key }} | Run upgrade with failure handling"
  block:

  # =========================================================================
  # 0. Purge orphaned guaranteed restore points older than 7 days for this
  #    SID. AutoUpgrade names its own GRPs internally (we do not control or
  #    know the naming pattern in advance), so this cannot be scoped by our
  #    usual <CR#>_rollback_... naming convention - it matches on
  #    guarantee_flashback_database='YES' + age instead. ASSUMPTION worth
  #    verifying: this could drop an unrelated guaranteed restore point a
  #    DBA created manually for other purposes if one happens to be older
  #    than 7 days on this SID - the WARN below lists exactly what gets
  #    dropped so it stays auditable.
  # =========================================================================
  - name: "JOB | {{ job.issue_key }} | Find guaranteed restore points older than 7 days"
    ansible.builtin.shell:
      cmd: |
        export ORACLE_SID={{ job.oracle_sid }}
        export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOF'
        set heading off feedback off pagesize 0
        select name from v$restore_point where guarantee_flashback_database='YES' and time < sysdate - 7;
        exit;
        EOF
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: oracle
    register: upg_old_grps
    changed_when: false
    failed_when: false

  - name: "JOB | {{ job.issue_key }} | WARN before dropping orphaned old restore points"
    ansible.builtin.debug:
      msg: "WARNING: dropping guaranteed restore point '{{ item }}' on {{ job.oracle_sid }} - older than 7 days."
    loop: "{{ upg_old_grps.stdout_lines | default([]) | select() | list }}"
    loop_control:
      label: "{{ item }}"

  - name: "JOB | {{ job.issue_key }} | Drop orphaned restore points older than 7 days"
    ansible.builtin.shell:
      cmd: |
        export ORACLE_SID={{ job.oracle_sid }}
        export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOF'
        whenever sqlerror continue
        drop restore point "{{ item }}";
        exit;
        EOF
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: oracle
    loop: "{{ upg_old_grps.stdout_lines | default([]) | select() | list }}"
    loop_control:
      label: "{{ item }}"
    failed_when: false
    changed_when: true

  # =========================================================================
  # 1. Opening work note (the change is already in implement via the intake
  #    shepherd, so no state change is needed here)
  # =========================================================================
  - name: "JOB | {{ job.issue_key }} | Work note: upgrade started"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: >-
          AutoUpgrade 21c -> 26ai started for SID {{ job.oracle_sid }} on {{ oracle_host }}. Source home: {{ oracle_source_home }}. Target home: {{ oracle_target_home }}. Job dir: {{ job_dir }}.
      status_code: 200

  # =========================================================================
  # 2. Sanity-check the source database (must be 21c and OPEN)
  # =========================================================================
  - name: "JOB | {{ job.issue_key }} | Write source DB check script"
    ansible.builtin.copy:
      dest: "{{ verify_script }}"
      owner: oracle
      group: oinstall
      mode: "0755"
      content: |
        #!/bin/bash
        export ORACLE_SID={{ job.oracle_sid }}
        export ORACLE_HOME={{ oracle_source_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        sqlplus -s / as sysdba <<'EOF'
        set heading off feedback off pagesize 0
        select 'VERSION='||version_full from v$instance;
        select 'STATUS='||status from v$instance;
        select 'PDB='||name||':'||open_mode from v$pdbs;
        exit;
        EOF
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: root

  - name: "JOB | {{ job.issue_key }} | Check source DB version and state"
    ansible.builtin.command:
      cmd: "{{ verify_script }}"
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: oracle
    register: source_db_check
    changed_when: false

  - name: "JOB | {{ job.issue_key }} | Detect whether the database is already upgraded"
    ansible.builtin.set_fact:
      upg_already_upgraded: >-
        {{ ('VERSION=23.' in source_db_check.stdout)
           or ('VERSION=26.' in source_db_check.stdout) }}
      upg_source_is_21c: "{{ 'VERSION=21.' in source_db_check.stdout }}"
      upg_source_open: "{{ 'STATUS=OPEN' in source_db_check.stdout }}"
      upg_source_reachable: "{{ 'VERSION=' in source_db_check.stdout }}"

  - name: "JOB | {{ job.issue_key }} | Show detected source state"
    ansible.builtin.debug:
      msg: >-
        {{ job.oracle_sid }} on {{ oracle_host }}:
        already upgraded? {{ upg_already_upgraded }} |
        21c? {{ upg_source_is_21c }} | OPEN? {{ upg_source_open }}.
        {{ 'Already on 23ai/26ai -- will record evidence and close successful without re-running AutoUpgrade.'
           if upg_already_upgraded
           else ('Proceeding with AutoUpgrade.' if (upg_source_is_21c and upg_source_open)
                 else ('Source is 21c but not OPEN -- will STARTUP before upgrading.' if upg_source_is_21c
                       else 'Unexpected source state -- will fail for DBA review.')) }}

  # AutoUpgrade needs the source database OPEN, and a DOWN database can't even
  # report its version. If the pre-check found it not-OPEN (mounted, or fully
  # down so sqlplus returned no VERSION line), issue STARTUP once and re-detect
  # before deciding what to do. AutoUpgrade owns all shutdown/startup DURING
  # the deploy itself -- this step only gets the DB into the required starting
  # state. It runs whether or not we already think it's upgraded, because a
  # down already-upgraded DB reports no version until it is opened.
  - name: "JOB | {{ job.issue_key }} | Determine whether a STARTUP is needed"
    ansible.builtin.set_fact:
      upg_needs_startup: "{{ not upg_source_open }}"

  - name: "JOB | {{ job.issue_key }} | Bring the database to OPEN when it is not"
    when: upg_needs_startup
    block:
    - name: "JOB | {{ job.issue_key }} | Work note: database not OPEN, issuing STARTUP"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: >-
            Source database {{ job.oracle_sid }} on {{ oracle_host }} was not OPEN
            ({{ 'unreachable/down' if not upg_source_reachable else 'mounted/restricted' }}).
            Issuing STARTUP to bring it OPEN before proceeding.
        status_code: 200
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Write STARTUP script"
      ansible.builtin.copy:
        dest: "/tmp/upg_startup_{{ job.oracle_sid }}_{{ job.issue_key }}.sh"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_source_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          set heading off feedback off pagesize 0
          startup;
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | STARTUP the source database"
      ansible.builtin.command:
        cmd: "/tmp/upg_startup_{{ job.oracle_sid }}_{{ job.issue_key }}.sh"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: upg_startup_result
      changed_when: >-
        'Database opened' in (upg_startup_result.stdout | default(''))
        or 'ORACLE instance started' in (upg_startup_result.stdout | default(''))
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Re-check DB version and state after STARTUP"
      ansible.builtin.command:
        cmd: "{{ verify_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: source_db_check
      changed_when: false
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Re-detect state after STARTUP"
      ansible.builtin.set_fact:
        upg_already_upgraded: >-
          {{ ('VERSION=23.' in source_db_check.stdout)
             or ('VERSION=26.' in source_db_check.stdout) }}
        upg_source_is_21c: "{{ 'VERSION=21.' in source_db_check.stdout }}"
        upg_source_open: "{{ 'STATUS=OPEN' in source_db_check.stdout }}"
        upg_source_reachable: "{{ 'VERSION=' in source_db_check.stdout }}"

    - name: "JOB | {{ job.issue_key }} | Show state after STARTUP"
      ansible.builtin.debug:
        msg: >-
          After STARTUP -- {{ job.oracle_sid }}: already upgraded?
          {{ upg_already_upgraded }} | 21c? {{ upg_source_is_21c }} |
          OPEN? {{ upg_source_open }}

  # If the database is already on 23ai/26ai, this is a no-op success: post a
  # work note, attach the version as proof, close the change successful, and
  # end the job before any AutoUpgrade action. This mirrors the PAT
  # already-applied path -- re-running against an upgraded DB must not fail
  # or raise a spurious DBA repair follow-up.
  - name: "JOB | {{ job.issue_key }} | Work note + close successful when already upgraded"
    when: upg_already_upgraded
    block:
    - name: "JOB | {{ job.issue_key }} | Work note: already upgraded, no action"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            AutoUpgrade SKIPPED for {{ job.oracle_sid }} on {{ oracle_host }} -- the
            database is already running a 23ai/26ai version. No upgrade action was
            taken. Current instance state:
            {{ source_db_check.stdout | truncate(2000) }}
        status_code: 200
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Move change to review (already upgraded)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ job.sys_id }}"
        state: review
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Close change successful (already upgraded)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ job.sys_id }}"
        state: closed
        close_code: successful
        close_notes: |-
          Oracle upgrade change COMPLETED - {{ ansible_date_time.iso8601 }}
          {{ job.oracle_sid }} on {{ oracle_host }} is already on a 23ai/26ai
          version; no AutoUpgrade action was required. Instance version evidence
          is in the work notes.
      failed_when: false

  - name: "JOB | {{ job.issue_key }} | Perform the upgrade (only when not already upgraded)"
    when: not upg_already_upgraded
    block:
    - name: "JOB | {{ job.issue_key }} | Assert source is 21c and OPEN"
      ansible.builtin.assert:
        that:
        - upg_source_is_21c
        - upg_source_open
        fail_msg: >-
          Source database {{ job.oracle_sid }} could not be confirmed as a 21c
          instance in OPEN state (even after any STARTUP attempt). Manual DBA
          review required. Last check: {{ source_db_check.stdout | default('(no output -- database may be down)') }}




    # =========================================================================
    # 3. Create per-issue AutoUpgrade config
    #    Parameters per the oracle-base 26ai article. Recovery/log state is
    #    isolated under this issue's job dir. target_version is omitted --
    #    only required when the target is 12.2.
    # =========================================================================
    - name: "JOB | {{ job.issue_key }} | Create job directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: oracle
        group: oinstall
        mode: "0755"
      loop:
      - "{{ job_dir }}"
      - "{{ job_log_dir }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | Write autoupgrade.cfg"
      ansible.builtin.copy:
        dest: "{{ job_cfg }}"
        owner: oracle
        group: oinstall
        mode: "0644"
        content: |
          global.global_log_dir={{ job_log_dir }}
          upg1.sid={{ job.oracle_sid }}
          upg1.source_home={{ oracle_source_home }}
          upg1.target_home={{ oracle_target_home }}
          upg1.log_dir={{ job_log_dir }}/{{ job.oracle_sid }}
          upg1.start_time=NOW
          upg1.run_utlrp=yes
          upg1.timezone_upg=yes
          upg1.restoration={{ autoupgrade_restoration | default('yes') }}
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    # =========================================================================
    # 4. AutoUpgrade ANALYZE
    #    Run with the 26ai home's JDK and the jar shipped in the 26ai home
    #    (self-updating from AutoUpgrade 26.2 onward). ORACLE_SID/HOME are
    #    exported inside the script -- source home, per the article.
    # =========================================================================
    - name: "JOB | {{ job.issue_key }} | Write AutoUpgrade analyze script"
      ansible.builtin.copy:
        dest: "{{ analyze_script }}"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_source_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          {{ autoupgrade_java }} \
            -jar {{ autoupgrade_jar }} \
            -config {{ job_cfg }} \
            -mode analyze -noconsole
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | Run AutoUpgrade analyze phase (pre-upgrade check)"
      ansible.builtin.command:
        cmd: "{{ analyze_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: analyze_run
      async: 3600
      poll: 15
      changed_when: true

    - name: "JOB | {{ job.issue_key }} | Parse analyze summary"
      ansible.builtin.set_fact:
        analyze_jobs_failed: >-
          {{ analyze_run.stdout
             | regex_search('Jobs failed\s+\[(\d+)\]', '\1')
             | default(['?'], true) | first }}

    - name: "JOB | {{ job.issue_key }} | Assert analyze passed"
      ansible.builtin.assert:
        that:
        - analyze_jobs_failed == '0'
        fail_msg: >-
          AutoUpgrade analyze reported {{ analyze_jobs_failed }} failed job(s). Review {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log and the prechecks detail log ({{ job.oracle_sid }}_preupgrade.log) for required manual fixups before re-running.

    - name: "JOB | {{ job.issue_key }} | Read analyze status.log"
      ansible.builtin.command:
        cmd: "cat {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: analyze_status_log
      changed_when: false
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Work note: analyze complete"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            AutoUpgrade ANALYZE completed successfully for {{ job.oracle_sid }} (Jobs failed [0]).
            Proceeding to deploy. Analyze summary:
            {{ analyze_status_log.stdout | default('status.log not readable') | truncate(4000) }}
        status_code: 200

    # =========================================================================
    # 5. AutoUpgrade DEPLOY (fixups + upgrade in one action, per the article;
    #    a separate fixups run is unnecessary for same-server upgrades).
    #    Fire async and poll -- DBUPGRADE + POSTFIXUPS can take many hours.
    # =========================================================================
    - name: "JOB | {{ job.issue_key }} | Write AutoUpgrade deploy script"
      ansible.builtin.copy:
        dest: "{{ deploy_script }}"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_source_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          {{ autoupgrade_java }} \
            -jar {{ autoupgrade_jar }} \
            -config {{ job_cfg }} \
            -mode deploy -noconsole
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | Launch AutoUpgrade deploy (async)"
      ansible.builtin.command:
        cmd: "{{ deploy_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: deploy_async
      async: "{{ deploy_async_seconds }}"
      poll: 0
      changed_when: true

    - name: "JOB | {{ job.issue_key }} | Wait for deploy to finish"
      ansible.builtin.async_status:
        jid: "{{ deploy_async.ansible_job_id }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: deploy_result
      until: deploy_result.finished
      retries: "{{ deploy_poll_retries }}"
      delay: "{{ deploy_poll_delay }}"

    - name: "JOB | {{ job.issue_key }} | Parse deploy summary"
      ansible.builtin.set_fact:
        deploy_jobs_failed: >-
          {{ deploy_result.stdout | default('')
             | regex_search('Jobs failed\s+\[(\d+)\]', '\1')
             | default(['?'], true) | first }}
        deploy_jobs_restored: >-
          {{ deploy_result.stdout | default('')
             | regex_search('Jobs restored\s+\[(\d+)\]', '\1')
             | default(['0'], true) | first }}
        deploy_grp_drop_cmd: >-
          {{ deploy_result.stdout | default('')
             | regex_search('(drop restore point \S+)', '\1')
             | default([''], true) | first }}

    - name: "JOB | {{ job.issue_key }} | Assert deploy succeeded"
      ansible.builtin.assert:
        that:
        - deploy_result.rc | default(1) == 0
        - deploy_jobs_failed == '0'
        - deploy_jobs_restored == '0'
        fail_msg: >-
          AutoUpgrade deploy did not complete cleanly (rc={{ deploy_result.rc | default('n/a') }}, failed=[{{ deploy_jobs_failed }}], restored=[{{ deploy_jobs_restored }}]). If jobs were restored, the database was flashed back to the guaranteed restore point. Review {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log and the dbupgrade stage logs.

    # =========================================================================
    # 6. Post-upgrade: bounce under the new home (per the article) and verify.
    #    26ai continues the 23ai version stream, so version_full reports as
    #    23.26.x -- we accept either 23.26.* or 26.* here.
    # =========================================================================
    - name: "JOB | {{ job.issue_key }} | Write post-upgrade bounce/verify script"
      ansible.builtin.copy:
        dest: "{{ verify_script }}"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_target_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          shutdown immediate;
          startup;
          set heading off feedback off pagesize 0
          select 'VERSION='||version_full from v$instance;
          select 'STATUS='||status from v$instance;
          select 'PDB='||name||':'||open_mode from v$pdbs;
          select 'GRP='||name from v$restore_point where guarantee_flashback_database='YES';
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | Restart database under 26ai home and verify"
      ansible.builtin.command:
        cmd: "{{ verify_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: post_upgrade_check
      async: 1800
      poll: 15
      changed_when: true

    - name: "JOB | {{ job.issue_key }} | Assert database is on 26ai and OPEN"
      ansible.builtin.assert:
        that:
        - post_upgrade_check.stdout is regex('VERSION=(23\.26|26)\.')
        - "'STATUS=OPEN' in post_upgrade_check.stdout"
        fail_msg: >-
          Post-upgrade verification failed for {{ job.oracle_sid }}. Output: {{ post_upgrade_check.stdout }}

    - name: "JOB | {{ job.issue_key }} | Ensure /etc/oratab points at 26ai home"
      ansible.builtin.lineinfile:
        path: /etc/oratab
        regexp: '^{{ job.oracle_sid }}:'
        line: "{{ job.oracle_sid }}:{{ oracle_target_home }}:Y"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    # =========================================================================
    # 7. Success: worklog + transition to Done.
    #    The GRP is left in place deliberately -- it is dropped manually
    #    once the upgrade is accepted (it consumes FRA space until then).
    # =========================================================================
    - name: "JOB | {{ job.issue_key }} | Work note: upgrade complete"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            AutoUpgrade DEPLOY completed successfully for {{ job.oracle_sid }} on {{ oracle_host }}.
            Database restarted under {{ oracle_target_home }} and verified:
            {{ post_upgrade_check.stdout | truncate(2000) }}

            NOTE: guaranteed restore point retained. Drop it once the upgrade
            is accepted (it consumes FRA space):
            {{ deploy_grp_drop_cmd | default('see v$restore_point', true) }}

            Logs: {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log
        status_code: 200
    - name: "JOB | {{ job.issue_key }} | Move change to review"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ job.sys_id }}"
        state: review
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Close change (close_code successful)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ job.sys_id }}"
        state: closed
        close_code: successful
        close_notes: |-
          AutoUpgrade 21c -> 26ai COMPLETED for {{ job.oracle_sid }} on {{ oracle_host }}.
          Database restarted under {{ oracle_target_home }} and verified.
          NOTE: guaranteed restore point retained -- drop it once the upgrade
          is accepted (it consumes FRA space).
          Full evidence is in the work notes.
      register: snow_upg_close
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | WARN if the change could not be closed"
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ job.issue_key }} upgrade succeeded but the change could not
          be closed: {{ snow_upg_close.msg | default('unknown error') }}. Close it
          manually in ServiceNow.
      when: snow_upg_close is failed

  # ===========================================================================
  # ===========================================================================
  # RESCUE: detect -> auto-rollback where safe -> notify. Never auto-clears
  # recovery data.
  #
  # Two failure shapes get automatic rollback here:
  #   A) Deploy itself failed and AutoUpgrade's OWN internal mechanism already
  #      flashed the database back (deploy_jobs_restored != '0', detected via
  #      the "Assert deploy succeeded" task). We did not cause this rollback -
  #      Oracle's own tool did - we only confirm it and clean up the now-used
  #      restore point (storage parity).
  #   B) Deploy itself succeeded per AutoUpgrade's own report, but OUR
  #      separate post-deploy verification (restart under 26ai, confirm
  #      version/OPEN) failed. This is the real gap: AutoUpgrade has no idea
  #      this check even exists, so it never rolls back for it. We do here -
  #      explicitly flashback to the retained guaranteed restore point,
  #      re-verify the database is back on the ORIGINAL version, and only
  #      then drop the restore point.
  #
  # Any other failure (e.g. ANALYZE phase, pre-flight, before a GRP even
  # exists) gets no rollback action - there is nothing to roll back from yet.
  # ===========================================================================
  rescue:

  - name: "JOB | {{ job.issue_key }} | Determine which task failed"
    ansible.builtin.set_fact:
      upg_failed_task_name: "{{ ansible_failed_task.name | default('') }}"
      upg_auto_rollback_attempted: false
      upg_auto_rollback_result: ""

  # -- Branch A: AutoUpgrade's own deploy-phase restore already happened ----
  - name: "JOB | {{ job.issue_key }} | Branch A - confirm AutoUpgrade's own auto-restore"
    when:
    - "'Assert deploy succeeded' in upg_failed_task_name"
    - deploy_jobs_restored | default('0') != '0'
    block:

    - name: "JOB | {{ job.issue_key }} | Write version-check script (post AutoUpgrade auto-restore)"
      ansible.builtin.copy:
        dest: "{{ verify_script }}"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          set heading off feedback off pagesize 0
          select 'VERSION='||version_full from v$instance;
          select 'STATUS='||status from v$instance;
          select 'GRP='||name from v$restore_point where guarantee_flashback_database='YES';
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root

    - name: "JOB | {{ job.issue_key }} | Confirm database state after AutoUpgrade's auto-restore"
      ansible.builtin.command:
        cmd: "{{ verify_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: upg_autorestore_check
      changed_when: false
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Drop the now-consumed restore point (storage parity)"
      ansible.builtin.shell:
        cmd: |
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          {{ deploy_grp_drop_cmd | default('') }};
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      when: deploy_grp_drop_cmd | default('') | length > 0
      failed_when: false
      changed_when: true

    - name: "JOB | {{ job.issue_key }} | Record Branch A rollback outcome"
      ansible.builtin.set_fact:
        upg_auto_rollback_attempted: true
        upg_auto_rollback_result: >-
          AutoUpgrade's own internal mechanism auto-flashed the database back
          to its pre-upgrade state during the deploy phase (this was NOT
          triggered by this playbook - Oracle's own tool did it as part of
          deploy failure handling). Post-restore state:
          {{ upg_autorestore_check.stdout | default('(could not verify)') | trim }}
          The now-consumed guaranteed restore point has been dropped.

  # -- Branch B: our own post-deploy verify failed - deploy itself was fine
  #    per AutoUpgrade, so we must explicitly flashback ourselves -----------
  - name: "JOB | {{ job.issue_key }} | Branch B - explicit rollback after post-deploy verify failure"
    when:
    - "'Assert database is on 26ai and OPEN' in upg_failed_task_name"
    - deploy_jobs_failed | default('?') == '0'
    - deploy_jobs_restored | default('?') == '0'
    block:

    - name: "JOB | {{ job.issue_key }} | Look up the retained guaranteed restore point name"
      ansible.builtin.shell:
        cmd: |
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_target_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          set heading off feedback off pagesize 0
          select name from v$restore_point where guarantee_flashback_database='YES';
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: upg_grp_lookup
      changed_when: false
      failed_when: false

    - name: "JOB | {{ job.issue_key }} | Set restore point name fact"
      ansible.builtin.set_fact:
        upg_grp_name: "{{ upg_grp_lookup.stdout | default('') | trim }}"

    - name: "JOB | {{ job.issue_key }} | Refuse auto-rollback if no guaranteed restore point was found"
      ansible.builtin.set_fact:
        upg_auto_rollback_attempted: false
        upg_auto_rollback_result: "Post-deploy verification failed, but no guaranteed restore point could be found - automatic rollback was NOT possible. Manual DBA recovery required immediately."
      when: upg_grp_name | default('') | length == 0

    - name: "JOB | {{ job.issue_key }} | Write flashback script (mount, flashback, resetlogs, under ORIGINAL home)"
      ansible.builtin.copy:
        dest: "{{ verify_script }}"
        owner: oracle
        group: oinstall
        mode: "0755"
        content: |
          #!/bin/bash
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          whenever sqlerror exit sql.sqlcode
          shutdown immediate;
          startup mount;
          flashback database to restore point "{{ upg_grp_name }}";
          alter database open resetlogs;
          set heading off feedback off pagesize 0
          select 'VERSION='||version_full from v$instance;
          select 'STATUS='||status from v$instance;
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: root
      when: upg_grp_name | default('') | length > 0

    - name: "JOB | {{ job.issue_key }} | Execute flashback to guaranteed restore point"
      ansible.builtin.command:
        cmd: "{{ verify_script }}"
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      register: upg_flashback_result
      async: 1800
      poll: 15
      failed_when: false
      changed_when: true
      when: upg_grp_name | default('') | length > 0

    - name: "JOB | {{ job.issue_key }} | Confirm flashback actually returned the DB to its ORIGINAL version"
      ansible.builtin.set_fact:
        upg_flashback_confirmed: >-
          {{
            upg_grp_name | default('') | length > 0
            and (upg_flashback_result.rc | default(1) == 0)
            and ('STATUS=OPEN' in (upg_flashback_result.stdout | default('')))
            and not (upg_flashback_result.stdout | default('') is regex('VERSION=(23\.26|26)\.'))
          }}

    - name: "JOB | {{ job.issue_key }} | Drop the restore point now that it has been used (storage parity)"
      ansible.builtin.shell:
        cmd: |
          export ORACLE_SID={{ job.oracle_sid }}
          export ORACLE_HOME={{ oracle_instance_map[oracle_host].oracle_home }}
          export PATH=$ORACLE_HOME/bin:$PATH
          sqlplus -s / as sysdba <<'EOF'
          drop restore point "{{ upg_grp_name }}";
          exit;
          EOF
      delegate_to: "{{ oracle_host }}"
      become: true
      become_user: oracle
      when:
      - upg_grp_name | default('') | length > 0
      - upg_flashback_confirmed | default(false)
      failed_when: false
      changed_when: true

    - name: "JOB | {{ job.issue_key }} | Record Branch B rollback outcome"
      ansible.builtin.set_fact:
        upg_auto_rollback_attempted: true
        upg_auto_rollback_result: >-
          {%- if upg_grp_name | default('') | length == 0 -%}
          Post-deploy verification failed and no guaranteed restore point was found - automatic rollback was NOT possible. MANUAL DBA RECOVERY REQUIRED IMMEDIATELY.
          {%- elif upg_flashback_confirmed | default(false) -%}
          Post-deploy verification failed (database restarted under 26ai but did not verify correctly). Automatically flashed back to guaranteed restore point "{{ upg_grp_name }}" and confirmed the database is back on its ORIGINAL pre-upgrade version and OPEN. The restore point has been dropped. Result: {{ upg_flashback_result.stdout | default('') | trim }}
          {%- else -%}
          Post-deploy verification failed and an automatic flashback to restore point "{{ upg_grp_name }}" was ATTEMPTED but could NOT be confirmed successful (rc={{ upg_flashback_result.rc | default('n/a') }}). The restore point has been LEFT IN PLACE for manual recovery. MANUAL DBA INTERVENTION REQUIRED IMMEDIATELY - do not assume the database is in a known-good state. Output: {{ upg_flashback_result.stdout | default('') | trim }} {{ upg_flashback_result.stderr | default('') | trim }}
          {%- endif -%}

  - name: "JOB | {{ job.issue_key }} | Classify failure"
    ansible.builtin.set_fact:
      job_failed_reason: >-
        {%- set err = (ansible_failed_result.stderr | default('')) ~ ' ' ~ (ansible_failed_result.msg | default('')) -%} {%- if 'unfinished execution of a deploy' in err -%} STALE RECOVERY DATA: a previous AutoUpgrade deploy for this config ({{ job_cfg }}) did not finish. Manual DBA decision required -- EITHER resume it:
          {{ autoupgrade_java }} -jar {{ autoupgrade_jar }} -config {{ job_cfg }} -mode deploy
        OR, only if the database was already manually restored, clear recovery data and start over:
          {{ autoupgrade_java }} -jar {{ autoupgrade_jar }} -config {{ job_cfg }} -clear_recovery_data
        Recovery data was NOT cleared automatically. {%- else -%} Task "{{ ansible_failed_task.name | default('unknown') }}" failed: {{ ansible_failed_result.msg | default('no message') | truncate(1500) }} stderr: {{ ansible_failed_result.stderr | default('') | truncate(1500) }} {%- endif -%}

  - name: "JOB | {{ job.issue_key }} | Work note: upgrade failed, DBA review required"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ job.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |
          AutoUpgrade job HALTED for {{ job.oracle_sid }} on {{ oracle_host }} -- manual intervention required.

          {{ job_failed_reason }}

          {% if upg_auto_rollback_attempted | default(false) %}
          ROLLBACK: {{ upg_auto_rollback_result }}
          {% endif %}

          Logs: {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log
      status_code: 200
    failed_when: false
  - name: "JOB | {{ job.issue_key }} | Close change (close_code unsuccessful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ job.sys_id }}"
      state: closed
      close_code: unsuccessful
      close_notes: >-
        AutoUpgrade halted; see work notes and the DBA repair follow-up change.
        Recovery data was NOT cleared automatically.
        {{ ('Rollback: ' + upg_auto_rollback_result) if upg_auto_rollback_attempted | default(false) else '' }}
    failed_when: false

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Create DBA repair follow-up CHANGE REQUEST with the
  # failure reason and the AutoUpgrade status.log (fetched from the DB host)
  # attached. Everything is failure-tolerant so the rescue always completes.
  # ---------------------------------------------------------------------------

  - name: "JOB | {{ job.issue_key }} | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: snow_followup_enabled | default(true) | bool

  - name: "JOB | {{ job.issue_key }} | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when: snow_followup_enabled | default(true) | bool
    failed_when: false

  - name: "JOB | {{ job.issue_key }} | Write failure report for follow-up"
    ansible.builtin.copy:
      content: |
        Oracle AutoUpgrade FAILURE LOG - {{ fu_run_ts }}
        Issue       : {{ job.issue_key }}
        Oracle SID  : {{ job.oracle_sid }}
        DB host     : {{ oracle_host }}
        Source home : {{ oracle_source_home }}
        Target home : {{ oracle_target_home }}
        Job dir     : {{ job_dir }}

        Failure reason:
        {{ job_failed_reason }}

        AutoUpgrade status log on {{ oracle_host }}:
        {{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log
        (a copy is attached to the follow-up task if it could be retrieved)
      dest: "{{ followup_log_dir }}/UPG_{{ job.issue_key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    when: snow_followup_enabled | default(true) | bool
    failed_when: false

  - name: "JOB | {{ job.issue_key }} | Fetch AutoUpgrade status.log from {{ oracle_host }}"
    ansible.builtin.fetch:
      src: "{{ job_log_dir }}/cfgtoollogs/upgrade/auto/status/status.log"
      dest: "{{ followup_log_dir }}/UPG_{{ job.issue_key }}_status_{{ fu_run_ts }}.log"
      flat: true
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: root
    when: snow_followup_enabled | default(true) | bool
    failed_when: false

  - name: "JOB | {{ job.issue_key }} | Create DBA repair follow-up task"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    when: snow_followup_enabled | default(true) | bool
    vars:
      fu_tag: "UPG"
      fu_original_number: "{{ job.issue_key }}"
      fu_original_sys_id: "{{ job.sys_id }}"
      fu_summary: "DBA repair required: AutoUpgrade halted for {{ job.oracle_sid }} on {{ oracle_host }} ({{ job.issue_key }})"
      fu_description: |-
        Oracle AutoUpgrade 21c -> 26ai HALTED and the change request has been
        closed unsuccessful. Manual DBA intervention is required -- recovery
        data was NOT cleared automatically.

        Oracle SID  : {{ job.oracle_sid }}
        DB host     : {{ oracle_host }}
        Job dir     : {{ job_dir }}

        Failure reason:
        {{ job_failed_reason }}
      fu_attach_files:
      - "{{ followup_log_dir }}/UPG_{{ job.issue_key }}_failure_{{ fu_run_ts }}.log"
      - "{{ followup_log_dir }}/UPG_{{ job.issue_key }}_status_{{ fu_run_ts }}.log"

  - name: "JOB | {{ job.issue_key }} | Continue to next issue"
    ansible.builtin.debug:
      msg: "Job {{ job.issue_key }} halted and closed unsuccessful. Continuing with remaining issues."

  # ===========================================================================
  # ALWAYS: remove temp scripts from lnx001
  # ===========================================================================
  always:

  - name: "JOB | {{ job.issue_key }} | Clean up temp scripts"
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
    - "{{ analyze_script }}"
    - "{{ deploy_script }}"
    - "{{ verify_script }}"
    delegate_to: "{{ oracle_host }}"
    become: true
    become_user: root
    failed_when: false
