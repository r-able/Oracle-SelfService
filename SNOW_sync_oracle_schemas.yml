---
# =============================================================================
# SNOW_sync_oracle_schemas.yml
#
# Syncs REAL, non-system schemas within each known host:PDB combination into
# a new ServiceNow custom table (label "u_oracle_schema", real internal name
# will be "u_u_oracle_schema" - ServiceNow auto-prefixes custom tables the
# same way it did for u_u_oracle_target, confirmed from that table's real
# dictionary entry). This is the schema-level companion to
# SNOW_sync_oracle_targets.yml, enabling a cascading dropdown: pick a
# host:database first, and the schema dropdown then only shows schemas that
# actually exist within that specific PDB.
#
# WHY oracle_maintained = 'N': rather than maintain a hardcoded list of
# Oracle's dozens of built-in system schemas (SYS, SYSTEM, XDB, APPQOSSYS,
# OUTLN, and many more, which also varies somewhat by installed features),
# dba_users has a column Oracle itself uses to mark exactly this distinction
# - real, user-created schemas vs. Oracle-supplied ones. Using it directly
# is far more robust than guessing at every possible system schema name.
#
# u_u_oracle_schema fields (must be created in ServiceNow before this runs):
#   u_target       - Reference field, pointing at u_u_oracle_target - THIS is
#                    what makes the cascading dropdown filter work natively,
#                    rather than string-matching two separate host/sid
#                    fields against each other
#   u_schema_name  - String, the real schema/username, e.g. SOURCE, HR
#   u_label        - String, display value, "host:PDB:SCHEMA", e.g.
#                    "lnx001:UAT:HR" - shown to the user in the dropdown
#
# IDEMPOTENT + SAFE PRUNING: same pattern as SNOW_sync_oracle_targets.yml -
# matches existing rows by u_target + u_schema_name, updates u_label if
# drifted, creates what's missing, and only prunes stale rows for PDBs that
# were successfully scanned this run (a PDB that couldn't be reached keeps
# its existing schema rows untouched rather than being wiped).
#
# NEEDS VALIDATION: this has not yet been run against real infrastructure -
# built following the exact proven structure of SNOW_sync_oracle_targets.yml,
# but the u_u_oracle_schema table itself doesn't exist in ServiceNow yet, so
# this cannot be tested until that table (and its u_target reference field
# specifically) is created there first.
# =============================================================================

- name: Sync real per-PDB schemas into ServiceNow u_u_oracle_schema
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars/main.yml

  tasks:

  - name: Pre-flight - verify instance is awake and credentials valid
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/sys_user?sysparm_limit=1"
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: sync_preflight
    failed_when: false

  - name: Abort with a clear message if the instance is unreachable
    ansible.builtin.fail:
      msg: >-
        ServiceNow pre-flight failed (HTTP {{ sync_preflight.status | default('n/a') }}). If the response was not JSON the PDI is probably HIBERNATING -- wake it at https://developer.servicenow.com and re-run.
    when: sync_preflight.status | default(0) != 200 or sync_preflight.json is not defined

  # -----------------------------------------------------------------
  # Pull the current, already-synced host:PDB targets directly from
  # u_u_oracle_target - this guarantees a schema row is NEVER created
  # for a host:PDB combination that isn't also a valid, known target,
  # and gives us each target's real sys_id for the reference field.
  # -----------------------------------------------------------------
  - name: "Fetch all currently-known targets from u_u_oracle_target"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/u_u_oracle_target?sysparm_fields=sys_id,u_host,u_oracle_sid,u_label&sysparm_limit=1000
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: sync_known_targets

  - name: Nothing to scan for schemas
    ansible.builtin.meta: end_play
    when: sync_known_targets.json.result | default([]) | length == 0

  # -----------------------------------------------------------------
  # For each known host:PDB, query real (non-system) schemas live via
  # dba_users, connecting to that specific PDB's container.
  # -----------------------------------------------------------------
  - name: "Ensure temp working dir exists on each host"
    ansible.builtin.file:
      path: "/tmp/snow_sync_oracle_schemas"
      state: directory
      mode: '0777'
    delegate_to: "{{ item.u_host }}"
    loop: "{{ sync_known_targets.json.result }}"
    loop_control:
      label: "{{ item.u_label }}"

  - name: "Write schema discovery SQL for each host:PDB"
    ansible.builtin.copy:
      dest: "/tmp/snow_sync_oracle_schemas/list_schemas_{{ item.u_oracle_sid }}.sql"
      mode: '0644'
      content: |
        SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF ECHO OFF LINESIZE 200 TRIMSPOOL ON
        WHENEVER SQLERROR EXIT SQL.SQLCODE
        ALTER SESSION SET CONTAINER = {{ item.u_oracle_sid }};
        SELECT username FROM dba_users
        WHERE oracle_maintained = 'N'
        ORDER BY username;
        EXIT;
    delegate_to: "{{ item.u_host }}"
    loop: "{{ sync_known_targets.json.result }}"
    loop_control:
      label: "{{ item.u_label }}"

  - name: "Write execution wrapper for each host:PDB"
    ansible.builtin.copy:
      dest: "/tmp/snow_sync_oracle_schemas/run_{{ item.u_oracle_sid }}.sh"
      mode: '0755'
      content: |
        #!/bin/bash
        export ORACLE_SID={{ oracle_instance_map[item.u_host].oracle_sid }}
        export ORACLE_HOME={{ oracle_instance_map[item.u_host].oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        "$ORACLE_HOME/bin/sqlplus" -S / AS SYSDBA @/tmp/snow_sync_oracle_schemas/list_schemas_{{ item.u_oracle_sid }}.sql
    delegate_to: "{{ item.u_host }}"
    loop: "{{ sync_known_targets.json.result }}"
    loop_control:
      label: "{{ item.u_label }}"

  - name: "Run schema discovery for each host:PDB as oracle"
    ansible.builtin.command: "bash /tmp/snow_sync_oracle_schemas/run_{{ item.u_oracle_sid }}.sh"
    delegate_to: "{{ item.u_host }}"
    become: true
    become_user: "{{ oracle_instance_map[item.u_host].oracle_user }}"
    loop: "{{ sync_known_targets.json.result }}"
    loop_control:
      label: "{{ item.u_label }}"
    register: sync_schema_exec
    failed_when: false
    changed_when: false

  - name: "WARN about any host:PDB where schema discovery failed"
    ansible.builtin.debug:
      msg: >-
        WARNING: could not list schemas for {{ item.item.u_label }} (rc={{ item.rc }}). This target contributes ZERO schema rows this run - existing rows for it are left untouched. stdout: {{ item.stdout | default('') | truncate(300) }} | stderr: {{ item.stderr | default('') | truncate(300) }}
    loop: "{{ sync_schema_exec.results }}"
    loop_control:
      label: "{{ item.item.u_label }}"
    when: item.rc != 0

  - name: "Clean discovered schema names (drop any blank/invalid lines)"
    ansible.builtin.set_fact:
      sync_schema_clean: >-
        {{ sync_schema_clean | default([]) + [ {
             'item': item.item,
             'stdout_lines': item.stdout_lines | default([]) | select('match', '^[A-Za-z0-9_$#]+$') | list
           } ] }}
    loop: "{{ sync_schema_exec.results }}"
    loop_control:
      label: "{{ item.item.u_label }}"
    when: item.rc == 0

  - name: "Build sync_schemas from discovered schemas (one row per host:PDB:schema)"
    ansible.builtin.set_fact:
      sync_schemas: >-
        {{ sync_schemas | default([]) + [ {
             'target_sys_id': item.0.item.sys_id,
             'schema': item.1,
             'label': item.0.item.u_label ~ ':' ~ item.1
           } ] }}
    loop: "{{ sync_schema_clean | default([]) | subelements('stdout_lines', skip_missing=True) }}"
    loop_control:
      label: "{{ item.0.item.u_label }}:{{ item.1 }}"

  - name: Show schemas to sync
    ansible.builtin.debug:
      msg: "{{ sync_schemas | default([]) | map(attribute='label') | list }}"

  - name: Nothing to sync
    ansible.builtin.meta: end_play
    when: sync_schemas | default([]) | length == 0

  - name: "Check whether each schema already exists in u_u_oracle_schema"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/u_u_oracle_schema?sysparm_query={{
          ('u_target=' + item.target_sys_id + '^u_schema_name=' + item.schema) | urlencode
        }}&sysparm_fields=sys_id,u_label&sysparm_limit=1
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    loop: "{{ sync_schemas }}"
    loop_control:
      label: "{{ item.label }}"
    register: sync_schema_lookup

  - name: Build create/update work list
    ansible.builtin.set_fact:
      sync_schema_jobs: >-
        {{ sync_schema_jobs | default([]) + [ item.item | combine({
             'existing_sys_id': (item.json.result | default([]) | first | default({})).sys_id | default(''),
             'existing_label':  (item.json.result | default([]) | first | default({})).u_label | default('')
           }) ] }}
    loop: "{{ sync_schema_lookup.results }}"
    loop_control:
      label: "{{ item.item.label }}"

  - name: Create new schema rows that don't exist yet
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_u_oracle_schema"
      method: POST
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        u_target: "{{ item.target_sys_id }}"
        u_schema_name: "{{ item.schema }}"
        u_label: "{{ item.label }}"
      status_code: 201
    loop: "{{ sync_schema_jobs }}"
    loop_control:
      label: "{{ item.label }}"
    when: item.existing_sys_id | length == 0
    register: sync_schema_created
    failed_when: false

  - name: Update schema rows whose label has drifted
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_u_oracle_schema/{{ item.existing_sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        u_label: "{{ item.label }}"
      status_code: 200
    loop: "{{ sync_schema_jobs }}"
    loop_control:
      label: "{{ item.label }}"
    when:
    - item.existing_sys_id | length > 0
    - item.existing_label != item.label
    failed_when: false

  # -----------------------------------------------------------------
  # Prune stale schema rows - only for host:PDB targets that were
  # successfully scanned this run, same safety principle as the
  # target-level sync.
  # -----------------------------------------------------------------
  - name: "Build list of successfully-scanned target sys_ids (safe to prune stale rows for)"
    ansible.builtin.set_fact:
      sync_scanned_target_ids: "{{ sync_schema_exec.results | selectattr('rc', 'equalto', 0) | map(attribute='item.sys_id') | list }}"

  - name: "Fetch ALL existing schema rows for successfully-scanned targets"
    ansible.builtin.uri:
      url: >-
        {{ sn_instance }}/api/now/table/u_u_oracle_schema?sysparm_query={{
          ('u_targetIN' + (sync_scanned_target_ids | join(','))) | urlencode
        }}&sysparm_fields=sys_id,u_target,u_schema_name,u_label&sysparm_limit=1000
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: sync_schema_existing_all
    when: sync_scanned_target_ids | length > 0

  - name: "Determine stale schema rows (exist in ServiceNow but not in the live schema list)"
    ansible.builtin.set_fact:
      sync_schema_stale_rows: >-
        {{ (sync_schema_existing_all.json.result | default([]))
           | rejectattr('u_label', 'in', (sync_schemas | map(attribute='label') | list))
           | list }}
    when: sync_scanned_target_ids | length > 0

  - name: "Show stale schema rows that will be removed"
    ansible.builtin.debug:
      msg: "Removing stale schema: {{ item.u_label }} (no longer exists as a real schema)"
    loop: "{{ sync_schema_stale_rows | default([]) }}"
    loop_control:
      label: "{{ item.u_label }}"

  - name: "Delete stale schema rows"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/u_u_oracle_schema/{{ item.sys_id }}"
      method: DELETE
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      status_code: 204
    loop: "{{ sync_schema_stale_rows | default([]) }}"
    loop_control:
      label: "{{ item.u_label }}"
    failed_when: false

  - name: Clean up temp files on each host
    ansible.builtin.file:
      path: "/tmp/snow_sync_oracle_schemas"
      state: absent
    delegate_to: "{{ item.u_host }}"
    loop: "{{ sync_known_targets.json.result }}"
    loop_control:
      label: "{{ item.u_host }}"
    failed_when: false

  - name: Final summary
    ansible.builtin.debug:
      msg:
      - "======================================================"
      - "  u_u_oracle_schema sync summary"
      - "======================================================"
      - "  Schemas discovered            : {{ sync_schemas | length }}"
      - "  Created                       : {{ sync_schema_jobs | selectattr('existing_sys_id', 'equalto', '') | list | length }}"
      - "  Already existed               : {{ sync_schema_jobs | rejectattr('existing_sys_id', 'equalto', '') | list | length }}"
      - "  Removed (stale/dropped)       : {{ sync_schema_stale_rows | default([]) | length }}"
      - "======================================================"
