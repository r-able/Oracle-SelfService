---
# SNOW_CDP_reset_oracle_password.yml
#
# REWRITTEN (August 2026) to target exactly ONE host:database per change,
# instead of resetting the same password across all six environment
# databases. Real-world usage showed users almost always request a
# password reset for one specific database, not a global reset - the
# old all-databases behavior was solving a problem nobody actually had,
# at the cost of a slower, riskier, harder-to-govern change.
#
# Also corrects stale documentation left over from an earlier Jira-to-
# ServiceNow migration - the actual intake mechanism (COMMON_snow_intake.yml)
# was already ServiceNow-based; only the comment block above it still
# referenced Jira variables that were never actually used by this code.
#
# NEW SPEC FORMAT (short_description):
#   "CDP | HOST:SERVICE | USERNAME_OR_FULL_NAME"
#   Example (already knows their username):  "CDP | lnx001:PRO | SYRIAM"
#   Example (needs it derived from a name):  "CDP | lnx002:DW1_PERF | Vlad Grigorian"
#
# USERNAME RESOLUTION - two supported modes in the third field:
#   1. Single word (no spaces): treated as the real Oracle username
#      directly - the requester already knows it, e.g. "SYRIAM".
#   2. Two or more words: treated as a full name, and the Oracle username
#      is DERIVED using the same convention CAU provisioning already
#      uses - first letter of first name + entire last name, upper-cased
#      (e.g. "Vlad Grigorian" -> "VGRIGORIAN"). This covers requesters
#      who know the person's name but not their database username.
#
# Required vars (vars/main.yml):
#   oracle_instance_map: { <host>: { oracle_sid, oracle_home, oracle_user }, ... }
#   oracle_dba_user, oracle_dba_pass
#   sn_instance, sn_username, sn_password, followup_log_dir
#
# Requirements:
#   pip install oracledb --break-system-packages   # thin driver, no Oracle Client needed
#
# Usage:
#   ansible-playbook SNOW_CDP_reset_oracle_password.yml --ask-vault-pass

- name: ServiceNow -> Parse change -> Reset Oracle password in one database -> Close change
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    issue_outcomes: {} # { "CHG0012345": "done" | "failed" }

  tasks:

  # -- 0-1. ServiceNow intake and shepherd -----------------------------------
  - name: "0-1 | ServiceNow intake and shepherd for CDP"
    ansible.builtin.include_tasks: COMMON_snow_intake.yml
    vars:
      snow_tag: "CDP"
      sn_type: "standard"

  - name: "1 | Abort if no work found"
    ansible.builtin.debug:
      msg: "No ServiceNow change requests tagged 'CDP |' are ready to execute. Exiting cleanly."
    when: snow_work | length == 0

  - name: "1 | End play gracefully when queue is empty"
    ansible.builtin.meta: end_play
    when: snow_work | length == 0

  # -- 2. Parse "CDP | HOST:SERVICE | USERNAME_OR_NAME" ----------------------
  - name: "2 | WARN and skip changes with an unusable spec"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.number }} has an unusable spec
        (short_description: '{{ item.short_description }}') -- skipping.
        Expected 'CDP | HOST:SERVICE | USERNAME_OR_FULL_NAME'.
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_parts: "{{ item.short_description.split('|')[1:] }}"
    when: (cdp_parts | length) != 2

  - name: "2 | Build change -> Oracle target + user mapping"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([]) + [{
            'issue_key':    item.number,
            'sys_id':       item.sys_id,
            'host_service': cdp_parts[0] | trim,
            'target_host':  cdp_parts[0].split(':')[0] | trim,
            'target_service': cdp_parts[0].split(':')[1] | trim | upper,
            'name_or_user': cdp_parts[1] | trim,
            'oracle_user': (
              (cdp_parts[1] | trim).split(' ')[0][0] + (cdp_parts[1] | trim).split(' ')[-1]
              if ((cdp_parts[1] | trim).split(' ') | length) > 1
              else (cdp_parts[1] | trim)
            ) | upper
          }]
        }}
    loop: "{{ snow_work }}"
    loop_control:
      label: "{{ item.number }}"
    vars:
      cdp_parts: "{{ item.short_description.split('|')[1:] }}"
    when:
    - (cdp_parts | length) == 2
    - (cdp_parts[0] | trim).split(':') | length == 2

  - name: "2 | WARN and drop issues referencing an unknown host"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.issue_key }} references a host not in
        oracle_instance_map (known: {{ oracle_instance_map.keys() | list | join(', ') }}).
        target_host={{ item.target_host }} -- skipping.
    loop: "{{ issues_to_reset | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.target_host not in oracle_instance_map.keys()

  - name: "2 | Keep only issues referencing a known host"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset | default([])
          | selectattr('target_host', 'in', oracle_instance_map.keys() | list) | list
        }}

  - name: "2 | Nothing valid to process"
    ansible.builtin.meta: end_play
    when: issues_to_reset | default([]) | length == 0

  - name: "2 | Show reporter -> Oracle target + user mapping"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }} -> {{ item.target_host }}:{{ item.target_service }}
        | Oracle user: {{ item.oracle_user }}
        ({{ 'given directly' if (item.name_or_user.split(' ') | length) == 1 else 'derived from name "' + item.name_or_user + '"' }})
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }}"

  # -- ITIL classification ---------------------------------------------------
  # CI is the specific target database now, not just the Oracle account,
  # since this reset is scoped to one database rather than every environment.
  - name: "2b | ITIL | Classify each password reset (CI link, risk, impact, schedule)"
    ansible.builtin.include_tasks: COMMON_snow_itil_classify.yml
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }}"
    vars:
      itil_primary_key: "{{ item.issue_key }}"
      itil_sys_id: "{{ item.sys_id }}"
      itil_ci_name: "{{ item.target_host }}:{{ item.target_service }}"
      itil_risk: "low"
      itil_impact: "low"
      itil_planned_duration_hours: 1

  # -- 3. Generate one random password per issue -----------------------------
  - name: "3 | Generate random password for each Oracle user"
    ansible.builtin.shell:
      cmd: |
        upper=$(tr -dc 'A-Z'    </dev/urandom | head -c 1)
        lower=$(tr -dc 'a-z'    </dev/urandom | head -c 1)
        digit=$(tr -dc '0-9'    </dev/urandom | head -c 1)
        spec=$(tr  -dc '@#$%'   </dev/urandom | head -c 1)
        rest=$(tr  -dc 'A-Za-z0-9@#$%' </dev/urandom | head -c 12)
        pw="${upper}${lower}${digit}${spec}${rest}"
        echo "$pw" | fold -w1 | shuf | tr -d '\n'
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.oracle_user }}"
    register: generated_passwords
    no_log: true

  - name: "3 | Attach generated password to each issue entry"
    ansible.builtin.set_fact:
      issues_to_reset: >-
        {{
          issues_to_reset
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [ item.item | combine({ 'new_password': item.stdout }) ]
        }}
    loop: "{{ generated_passwords.results }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.oracle_user }}"
    no_log: true

  # -- 4. Reset the password in the ONE target database ----------------------
  - name: "4 | Reset Oracle password in the target database"
    ansible.builtin.shell:
      cmd: |
        python3 - << 'PYEOF'
        import sys, os
        try:
            import oracledb
            def connect(user, password, host, port, service):
                dsn = f"{host}:{port}/{service}"
                return oracledb.connect(user=user, password=password, dsn=dsn)
        except ImportError:
            import cx_Oracle
            def connect(user, password, host, port, service):
                dsn = cx_Oracle.makedsn(host, int(port), service_name=service)
                return cx_Oracle.connect(user=user, password=password, dsn=dsn)

        host        = os.environ["ORA_HOST"]
        port        = os.environ["ORA_PORT"]
        service     = os.environ["ORA_SERVICE"]
        dba_user    = os.environ["ORA_DBA_USER"]
        dba_pass    = os.environ["ORA_DBA_PASS"]
        target_user = os.environ["ORA_TARGET_USER"]
        new_pass    = os.environ["ORA_NEW_PASS"]

        try:
            conn = connect(dba_user, dba_pass, host, port, service)
        except Exception as e:
            print(f"ERROR: Could not connect to {host}:{service}: {e}", file=sys.stderr)
            sys.exit(1)

        cur = conn.cursor()

        cur.execute(
            "SELECT COUNT(*) FROM dba_users WHERE username = :uname",
            uname=target_user
        )
        if cur.fetchone()[0] == 0:
            print(f"ERROR: Oracle user '{target_user}' does not exist in "
                  f"{host}:{service}.", file=sys.stderr)
            sys.exit(1)

        cur.execute(f'ALTER USER "{target_user}" IDENTIFIED BY "{new_pass}"')
        conn.commit()
        print(f"OK: password reset for {target_user} in {host}:{service}")
        cur.close()
        conn.close()
        PYEOF
    environment:
      ORA_HOST: "{{ item.target_host }}"
      ORA_PORT: "{{ oracle_port | default(1521) | string }}"
      ORA_SERVICE: "{{ item.target_service }}"
      ORA_DBA_USER: "{{ oracle_dba_user }}"
      ORA_DBA_PASS: "{{ oracle_dba_pass }}"
      ORA_TARGET_USER: "{{ item.oracle_user }}"
      ORA_NEW_PASS: "{{ item.new_password }}"
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }} | {{ item.oracle_user }} @ {{ item.target_host }}:{{ item.target_service }}"
    register: oracle_reset_results
    ignore_errors: true
    no_log: true

  - name: "4b | Show password-reset outcome per issue"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.issue_key }} | {{ item.item.oracle_user }} @ {{ item.item.target_host }}:{{ item.item.target_service }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }} {% if item.rc != 0 %}| stderr: {{ item.stderr | default('(none)') | trim }}{% endif %}
    loop: "{{ oracle_reset_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }}"

  # -- 5. Post temporary password as a work note (success only) -------------
  - name: "5 | Post new temporary password as a work note"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ item.sys_id }}"
      method: PATCH
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      body_format: json
      body:
        work_notes: |
          Automated password reset completed successfully.

          Database            : {{ item.target_host }}:{{ item.target_service }}
          Oracle User         : {{ item.oracle_user }}
          Temporary Password  : {{ item.new_password }}
          Reset By            : {{ sn_username }} (Ansible automation)
          Timestamp           : {{ ansible_date_time.iso8601 }}

          Please change this password immediately after your first login.
          Do not share this password.
      status_code: 200
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'equalto', 0)
        | list
        | length
      ) > 0
    register: cdp_password_note
    no_log: true
    ignore_errors: true

  - name: "5 | WARN if the password work note could not be posted"
    ansible.builtin.debug:
      msg: >-
        WARNING: the temporary password work note failed to post for one or
        more changes. The password reset itself succeeded, but the
        requester will not see the new password on the change.
    when: cdp_password_note is defined and (cdp_password_note.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0)

  # -- 6. Compute per-issue outcome and transition ---------------------------
  - name: "6 | Mark issues DONE"
    ansible.builtin.set_fact:
      issue_outcomes: "{{ issue_outcomes | combine({ item.issue_key: 'done' }) }}"
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'equalto', 0)
        | list
        | length
      ) > 0

  - name: "6 | Mark issues FAILED"
    ansible.builtin.set_fact:
      issue_outcomes: "{{ issue_outcomes | combine({ item.issue_key: 'failed' }) }}"
    loop: "{{ issues_to_reset }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: >-
      (
        oracle_reset_results.results | default([])
        | selectattr('item.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'equalto', 0)
        | list
        | length
      ) == 0

  - name: "6 | Move SUCCESSFUL changes to review"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: review
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Close SUCCESSFUL changes (close_code successful)"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ snow_cr_map[item.key] }}"
      state: closed
      close_code: successful
      close_notes: |-
        Automated Oracle password reset COMPLETED - {{ ansible_date_time.iso8601 }}
        The temporary password is in the work notes on this change.
        Please change it immediately after first login.
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    failed_when: false

  - name: "6 | Post failure work note and close FAILED changes"
    block:
    - name: "6a | Post failure work note"
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/change_request/{{ snow_cr_map[item.key] }}"
        method: PATCH
        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: |
            Automated password reset FAILED.
            {% set r = (oracle_reset_results.results | default([]) | selectattr('item.issue_key', 'equalto', item.key) | list | first) %}
            {% if r %}
            Database : {{ r.item.target_host }}:{{ r.item.target_service }}
            Error    : {{ r.stderr | default('(none)') | trim }}
            {% endif %}

            No temporary password has been issued. A DBA repair follow-up
            change request is being raised.

            Timestamp: {{ ansible_date_time.iso8601 }}
        status_code: 200
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      ignore_errors: true
    - name: "6b | Close FAILED changes (close_code unsuccessful)"
      servicenow.itsm.change_request:
        instance:
          host: "{{ sn_instance }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        sys_id: "{{ snow_cr_map[item.key] }}"
        state: closed
        close_code: unsuccessful
        close_notes: "Automated password reset failed; see work notes and the DBA repair follow-up change. No temporary password was issued."
      loop: "{{ issue_outcomes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'failed'
      failed_when: false

  - name: "6c | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: snow_followup_enabled | default(true) | bool

  - name: "6c | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - snow_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "6c | Write failure report per FAILED issue (no stdout -- may contain credentials)"
    ansible.builtin.copy:
      content: |
        Automated Oracle Password Reset FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue : {{ item.key }}
        {% set r = (oracle_reset_results.results | default([]) | selectattr('item.issue_key', 'equalto', item.key) | list | first) %}
        {% if r %}
        Database : {{ r.item.target_host }}:{{ r.item.target_service }}
        rc       : {{ r.rc }}
        stderr   : {{ r.stderr | default('(none)') | trim }}
        {% endif %}

        No temporary password has been issued to the requester.
      dest: "{{ followup_log_dir }}/CDP_{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "6c | Create DBA follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_snow_create_followup.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - snow_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_tag: "CDP"
      fu_original_number: "{{ fu_item.key }}"
      fu_original_sys_id: "{{ snow_cr_map[fu_item.key] }}"
      fu_summary: "DBA repair required: Oracle password reset failed for {{ fu_item.key }}"
      fu_description: |-
        Automated Oracle password reset FAILED and the change request has
        been closed unsuccessful. Please investigate and repair, then
        reset the user's password manually.

        No temporary password was issued to the requester. The failure
        report (rc/stderr only) is attached to this change.
      fu_attach_files:
      - "{{ followup_log_dir }}/CDP_{{ fu_item.key }}_failure_{{ fu_run_ts }}.log"

  # -- 7. Final summary --------------------------------------------------------
  - name: "7 | Build summary outcome lines"
    ansible.builtin.set_fact:
      summary_lines: >-
        {{
          summary_lines | default([]) + [
            '  ' + item.key
            + '   ->   ' + (item.value | upper)
            + '   ('
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='oracle_user')
                | first
                | default('unknown')
              )
            + ' @ '
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='target_host')
                | first
                | default('?')
              )
            + ':'
            + (
                issues_to_reset
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='target_service')
                | first
                | default('?')
              )
            + ')'
          ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "7 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '======================================================',
          '  ServiceNow Oracle Password-Reset Summary',
          '======================================================',
          '  Run timestamp   : ' + ansible_date_time.iso8601,
          '  Changes found   : ' + (snow_work | length | string),
          '  Resets OK       : ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length | string),
          '  Resets FAILED   : ' + (oracle_reset_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length | string),
          '  --------------------------------------------------',
          '  Per-issue outcomes:'
        ]
        + (summary_lines | default(['  (none)']))
        + ['======================================================']
      }}
    loop_control:
      label: "summary"
