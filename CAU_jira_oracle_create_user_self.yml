---
# CAU_jira_oracle_create_user_self.yml
# Released under the MIT license. Copyright (c) 2026, Vlad von Grigorian <
#
# Workflow:
#   0. Pre-flight : validate Jira API token via /rest/api/2/myself
#   1. Search     : find all open issues matching the configured JQL
#   2. Fetch      : retrieve each issue - extract reporter displayName
#                   (Jira Cloud - reporter.name is absent on Cloud) and
#                   target databases from customfield_10348[].value
#   3. Generate   : create one random password per issue (shared across
#                   all target databases for that user)
#   4. Create     : for each issue x each target database:
#                     - if user does NOT exist -> CREATE USER ... IDENTIFIED BY ...
#                     - if user already exists -> skip CREATE, re-grant only
#                   then GRANT CONNECT, DBA TO "<user>" in both cases
#   5. Worklog    : post a worklog entry per issue listing every database
#                   the user was created/updated in, plus the temp password
#   6. Transition : move the issue to "Done" if ALL target databases
#                   succeeded, or "Failed" if ANY database failed
#   7. Summary    : print a final outcome table
#
# Assumptions:
#   - This is a Jira Cloud instance. reporter.displayName is used as the
#     Oracle username (reporter.name is not populated on Jira Cloud).
#   - Target databases are stored in customfield_10348 as a list of
#     checkbox option objects: [ { "id": "...", "value": "DEV" }, ... ]
#     Values are matched against oracle_databases keys (case-insensitive).
#   - vars/main.yml defines oracle_databases as a dict keyed by the
#     environment name - see "Required vars" below.
#
# Required vars (vars/main.yml - vault-encrypt sensitive values):
#   jira_url          : "https://yourorg.atlassian.net"
#   jira_user         : "ansible-svc@yourorg.com"
#   jira_api_token    : !vault |  ...
#   jira_jql          : "project = CNU AND issuetype = Task AND status = 'To Do'"
#   jira_max_results  : 50
#   jira_cloud        : true
#   jira_status_done  : "Done"
#   jira_status_failed: "Failed"
#   oracle_host       : "db.yourorg.internal"
#   oracle_port       : 1521
#   oracle_dba_user   : "system"
#   oracle_dba_pass   : !vault |  ...
#   oracle_databases:
#     DEV: "DEVDB"      # Oracle service name for each environment
#     UAT: "UATDB"
#     SIT: "SITDB"
#     STG: "STGDB"
#     CER: "CERDB"
#     PRO: "PRODB"
#
# Usage:
#   ansible-playbook jira_oracle_create_user.yml --ask-vault-pass
#
# Requirements:
#   ansible-galaxy collection install community.general
#   pip install oracledb        # thin driver — no Oracle Client needed
#   # OR: pip install cx_Oracle # requires Oracle Instant Client on host

- name: Jira → Get reporter + components → Create Oracle user → Transition issue
  hosts: localhost
  gather_facts: true
  vars_files:
  - vars/main.yml

  vars:
    # Built at runtime — do not edit
    issue_outcomes: {} # { "OPS-123": "done" | "failed" }
    db_results_flat: [] # [ { issue_key, oracle_user, db_name, rc, stdout, stderr }, … ]

  # ═══════════════════════════════════════════════════════════════════════════
  tasks:

  # ── PRE-FLIGHT: validate API token ───────────────────────────────────────
  # community.general.jira silently returns zero results on auth failure.
  # Hitting /myself first gives an explicit HTTP 401 and a clear message.

  - name: "PRE-FLIGHT | Validate Jira API token via /rest/api/2/myself"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/myself"
      method: GET
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      status_code: 200
      return_content: true
    register: jira_auth_check
    no_log: true

  - name: "PRE-FLIGHT | Confirm authenticated identity"
    ansible.builtin.debug:
      msg: >-
        Jira authentication OK — connected as '{{ jira_auth_check.json.displayName }}' ({{ jira_auth_check.json.emailAddress }})

  # ── 1. Search Jira ───────────────────────────────────────────────────────

  - name: "1 | Search for open Jira issues matching JQL"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: search
      jql: "{{ jira_jql_cnu }}"
      maxresults: "{{ jira_max_results }}"
      cloud: "{{ jira_cloud }}"
    register: jira_search

  - name: "1 | Abort if no issues found"
    ansible.builtin.fail:
      msg: >-
        No Jira issues matched JQL: {{ jira_jql_cnu }}

        API token is VALID (pre-flight passed as {{ jira_auth_check.json.displayName }}), so this is a genuine JQL / data issue — not an auth problem.

        Things to check:
          1. Project key casing  → use: project = OPS  (no quotes around the key)
          2. Status names        → verify exact names in your Jira project settings
          3. issuetype name      → must match exactly (mind spaces and capitalisation)
          4. Permissions         → confirm {{ jira_auth_check.json.emailAddress }}
                                   has Browse access to the project
    when: jira_search.meta.issues | length == 0

  - name: "1 | Show issues found"
    ansible.builtin.debug:
      msg: >-
        Found {{ jira_search.meta.issues | length }} issue(s): {{ jira_search.meta.issues | map(attribute='key') | list | join(', ') }}

  # -- 2. Fetch full issue data - reporter + customfield_10348 ----------------
  # Jira Cloud does not populate reporter.name - displayName is used as the
  # Oracle username instead.
  #
  # Target databases come from customfield_10348: a list of checkbox option
  # objects with a "value" key (e.g. "DEV", "UAT", "SIT", "STG", "CER", "PRO").
  # Values are uppercased and intersected against oracle_databases keys;
  # unrecognised values are silently ignored.
  - name: "2 | Fetch full details for each issue"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: fetch
      issue: "{{ item.key }}"
      cloud: "{{ jira_cloud }}"
    loop: "{{ jira_search.meta.issues }}"
    loop_control:
      label: "{{ item.key }}"
    register: jira_issue_details

  - name: "2 | Build issue -> reporter + target databases mapping"
    ansible.builtin.set_fact:
      issues_to_process: >-
        {{
          issues_to_process | default([]) + [{
            'issue_key':   item.meta.key,
            'oracle_user': item.meta.fields.reporter.displayName | upper,
            'target_dbs': (
              item.meta.fields.customfield_10348
              | default([])
              | map(attribute='value')
              | map('upper')
              | select('in', oracle_databases.keys() | list)
              | list
            )
          }]
        }}
    loop: "{{ jira_issue_details.results }}"
    loop_control:
      label: "{{ item.meta.key }}"

  - name: "2 | Warn on issues with no recognised values in customfield_10348"
    ansible.builtin.debug:
      msg: >-
        WARNING: {{ item.issue_key }} - no recognised database values found in customfield_10348 (got: {{ jira_issue_details.results
          | selectattr('meta.key', 'equalto', item.issue_key)
          | map(attribute='meta.fields.customfield_10348')
          | first | default([]) | map(attribute='value') | list | join(', ') | default('none') }}).
        Valid values are: {{ oracle_databases.keys() | list | join(', ') }}. This issue will be skipped.
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.target_dbs | length == 0

  - name: "2 | Show reporter → Oracle user → target databases mapping"
    ansible.builtin.debug:
      msg: >-
        {{ item.issue_key }} → user: {{ item.oracle_user }} | databases: {{ item.target_dbs | join(', ') }}
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.target_dbs | length > 0

  # ── 3. Generate one random password per issue ─────────────────────────────
  # The same password is used across all target databases for a given issue
  # so the user only needs to remember one credential set.
  #
  # Password policy: 16 chars — guaranteed upper + lower + digit + special.
  # Special chars limited to @ # $ % to avoid shell-metacharacter issues.
  # no_log: true keeps passwords out of Ansible logs throughout.

  - name: "3 | Generate random password for each issue"
    ansible.builtin.shell:
      cmd: |
        upper=$(tr -dc 'A-Z'          </dev/urandom | head -c 1)
        lower=$(tr -dc 'a-z'          </dev/urandom | head -c 1)
        digit=$(tr -dc '0-9'          </dev/urandom | head -c 1)
        spec=$(tr  -dc '@#$%'         </dev/urandom | head -c 1)
        rest=$(tr  -dc 'A-Za-z0-9@#$%' </dev/urandom | head -c 12)
        pw="${upper}${lower}${digit}${spec}${rest}"
        echo "$pw" | fold -w1 | shuf | tr -d '\n'
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }} / {{ item.oracle_user }}"
    when: item.target_dbs | length > 0
    register: generated_passwords
    no_log: true

  - name: "3 | Attach generated password to each issue entry"
    ansible.builtin.set_fact:
      issues_to_process: >-
        {{
          issues_to_process | default([])
          | rejectattr('issue_key', 'equalto', item.item.issue_key)
          | list
          + [{
              'issue_key':    item.item.issue_key,
              'oracle_user':  item.item.oracle_user,
              'target_dbs':   item.item.target_dbs,
              'new_password': item.stdout
            }]
        }}
    loop: "{{ generated_passwords.results | default([]) }}"
    loop_control:
      label: "{{ item.item.issue_key }} / {{ item.item.oracle_user }}"
    when: not (item.skipped | default(false))
    no_log: true

  # ── 4. Create user in each target database ────────────────────────────────
  # We loop over every (issue, database) combination using subelements so
  # each pair gets its own task result and can succeed/fail independently.
  #
  # Logic inside the Python script:
  #   1. Connect to the target database service
  #   2. Check dba_users for the target username
  #   3a. User absent  → CREATE USER "X" IDENTIFIED BY "P"
  #   3b. User present → skip CREATE, print a notice
  #   4.  GRANT CONNECT, DBA TO "X"  (idempotent — safe to run either way)
  #
  # All identifiers and passwords come from environment variables so no
  # Jinja2 interpolation happens inside the heredoc (PYEOF is single-quoted).
  # no_log: true keeps the DBA password and new password out of Ansible logs.

  - name: "4 | Create Oracle user and grant privileges in each target database"
    ansible.builtin.shell:
      cmd: |
        python3 - << 'PYEOF'
        import sys, os

        try:
            import oracledb
            def connect(user, password, host, port, service):
                dsn = f"{host}:{port}/{service}"
                return oracledb.connect(user=user, password=password, dsn=dsn)
        except ImportError:
            import cx_Oracle
            def connect(user, password, host, port, service):
                dsn = cx_Oracle.makedsn(host, int(port), service_name=service)
                return cx_Oracle.connect(user=user, password=password, dsn=dsn)

        host        = os.environ["ORA_HOST"]
        port        = os.environ["ORA_PORT"]
        service     = os.environ["ORA_SERVICE"]
        dba_user    = os.environ["ORA_DBA_USER"]
        dba_pass    = os.environ["ORA_DBA_PASS"]
        target_user = os.environ["ORA_TARGET_USER"]
        new_pass    = os.environ["ORA_NEW_PASS"]
        db_name     = os.environ["ORA_DB_NAME"]

        try:
            conn = connect(dba_user, dba_pass, host, port, service)
        except Exception as e:
            print(f"ERROR: [{db_name}] Could not connect to Oracle service '{service}': {e}",
                  file=sys.stderr)
            sys.exit(1)

        cur = conn.cursor()

        # Check whether the user already exists
        cur.execute(
            "SELECT COUNT(*) FROM dba_users WHERE username = :uname",
            uname=target_user
        )
        user_exists = cur.fetchone()[0] > 0

        if user_exists:
            print(f"NOTICE: [{db_name}] User '{target_user}' already exists — "
                  f"skipping CREATE USER, re-granting privileges only.")
        else:
            # CREATE USER — identifiers cannot use bind variables
            cur.execute(
                f'CREATE USER "{target_user}" IDENTIFIED BY "{new_pass}" '
                f'DEFAULT TABLESPACE USERS '
                f'TEMPORARY TABLESPACE TEMP'
            )
            print(f"OK: [{db_name}] User '{target_user}' created successfully.")

        # GRANT — always applied so existing users get any missing privileges
        cur.execute(f'GRANT CONNECT, DBA TO "{target_user}"')
        conn.commit()
        print(f"OK: [{db_name}] Granted CONNECT, DBA to '{target_user}'.")

        cur.close()
        conn.close()
        PYEOF
    environment:
      ORA_HOST: "{{ oracle_host }}"
      ORA_PORT: "{{ oracle_port | string }}"
      ORA_SERVICE: "{{ oracle_databases[item.1] }}"
      ORA_DBA_USER: "{{ oracle_dba_user }}"
      ORA_DBA_PASS: "{{ oracle_dba_pass }}"
      ORA_TARGET_USER: "{{ item.0.oracle_user }}"
      ORA_NEW_PASS: "{{ item.0.new_password }}"
      ORA_DB_NAME: "{{ item.1 }}"
    loop: "{{ issues_to_process | default([]) | subelements('target_dbs') }}"
    loop_control:
      label: "{{ item.0.issue_key }} | {{ item.0.oracle_user }} → {{ item.1 }}"
    register: oracle_create_results
    ignore_errors: true
    no_log: true

  # ── 4b. Show sanitised per-database outcome (no passwords) ───────────────

  - name: "4b | Show create-user outcome per issue per database"
    ansible.builtin.debug:
      msg: >-
        {{ item.item.0.issue_key }} | {{ item.item.0.oracle_user }} → {{ item.item.1 }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED (rc=' + (item.rc | string) + ')' }} {% if item.rc == 0 %}| {{ item.stdout | default('') | trim }}{% endif %} {% if item.rc != 0 %}| stderr: {{ item.stderr | default('(none)') | trim }}{% endif %}
    loop: "{{ oracle_create_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.0.issue_key }} / {{ item.item.1 }}"

  # ── 5. Post worklog entry summarising all database outcomes ───────────────
  # One worklog entry per issue, listing every database attempted with its
  # individual outcome.  The new password is included so the DBA team has
  # an audit trail inside Jira.
  #
  # We group oracle_create_results.results by issue_key using a set_fact
  # loop first, then post one worklog per issue.
  # no_log: true keeps the password out of Ansible output.

  - name: "5 | Group database results by issue key"
    ansible.builtin.set_fact:
      results_by_issue: >-
        {{
          results_by_issue | default({}) | combine({
            item.item.0.issue_key: (
              results_by_issue | default({})
              | dict2items
              | selectattr('key', 'equalto', item.item.0.issue_key)
              | map(attribute='value')
              | first
              | default([])
            ) + [{
              'db_name': item.item.1,
              'rc':      item.rc,
              'stdout':  item.stdout | default(''),
              'stderr':  item.stderr | default('')
            }]
          })
        }}
    loop: "{{ oracle_create_results.results | default([]) }}"
    loop_control:
      label: "{{ item.item.0.issue_key }} / {{ item.item.1 }}"

  - name: "5 | Post worklog entry per issue with full database outcome (plain text)"
    ansible.builtin.uri:
      url: "{{ jira_url }}/rest/api/2/issue/{{ item.issue_key }}/worklog"
      method: POST
      user: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      force_basic_auth: true
      status_code: 201
      headers:
        Content-Type: "application/json"
      body_format: json
      body:
        timeSpentSeconds: 60
        comment: |-
          Automated Oracle User Provisioning - {{ ansible_date_time.iso8601 }}

          User {{ item.oracle_user }} has been provisioned by the Ansible automation service account ({{ jira_auth_check.json.displayName }}).

          Database outcomes:
          {% for db in item.target_dbs %}
          {{ db }} ({{ oracle_databases[db] }}): {{ 'SUCCESS' if (results_by_issue[item.issue_key] | selectattr('db_name','equalto',db) | map(attribute='rc') | first | default(1)) == 0 else 'FAILED' }} - {{ (results_by_issue[item.issue_key] | selectattr('db_name','equalto',db) | map(attribute='stdout') | first | default('')) | trim }}
          {% endfor %}

          Oracle Username: {{ item.oracle_user }}
          Temporary Password: {{ item.new_password }}
          Privileges Granted: CONNECT, DBA
          Provisioned By: {{ jira_auth_check.json.displayName }}
          Timestamp: {{ ansible_date_time.iso8601 }}

          Please log in and change this password immediately after first use.
          Do not share this worklog entry with anyone outside the team.
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when: item.target_dbs | length > 0
    no_log: true
    ignore_errors: true

  # ── 6. Compute per-issue outcome and transition ───────────────────────────
  # An issue is "done"   only if ALL its target databases returned rc == 0.
  # An issue is "failed" if ANY database returned rc != 0.

  - name: "6 | Mark issues DONE (all databases succeeded)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'done' }) }}
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when:
    - item.target_dbs | length > 0
    - >-
      (
        oracle_create_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) == 0

  - name: "6 | Mark issues FAILED (one or more databases failed)"
    ansible.builtin.set_fact:
      issue_outcomes: >-
        {{ issue_outcomes | combine({ item.issue_key: 'failed' }) }}
    loop: "{{ issues_to_process | default([]) }}"
    loop_control:
      label: "{{ item.issue_key }}"
    when:
    - item.target_dbs | length > 0
    - >-
      (
        oracle_create_results.results | default([])
        | selectattr('item.0.issue_key', 'equalto', item.issue_key)
        | selectattr('rc', 'ne', 0)
        | list
        | length
      ) > 0

  - name: "6 | Transition SUCCESSFUL issues to '{{ jira_status_done }}'"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: transition
      issue: "{{ item.key }}"
      status: "{{ jira_status_done }}"
      cloud: "{{ jira_cloud }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'done'
    ignore_errors: true

  - name: "6 | Post failure comment for FAILED issues"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: comment
      issue: "{{ item.key }}"
      comment: |
        Automated Oracle user provisioning FAILED for one or more databases.

        The Ansible playbook encountered errors while creating the Oracle user.
        Please review the worklog entry for the per-database breakdown and
        retry the failed databases manually.

        Timestamp: {{ ansible_date_time.iso8601 }}
        Automation account: {{ jira_auth_check.json.displayName }}
      cloud: "{{ jira_cloud }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'failed'
    ignore_errors: true

  - name: "6 | Transition FAILED issues to '{{ jira_status_failed }}'"
    community.general.jira:
      uri: "{{ jira_url }}"
      username: "{{ jira_user }}"
      password: "{{ jira_api_token }}"
      operation: transition
      issue: "{{ item.key }}"
      status: "{{ jira_status_failed }}"
      cloud: "{{ jira_cloud }}"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when: item.value == 'failed'
    ignore_errors: true

  # ── 6c. Create DBA repair follow-up task per FAILED issue ──────────────────
  #
  # One follow-up per failed issue, created in the same project, in "To Do",
  # for the Database Administrators, with a per-database failure report
  # attached. Passwords are never written to the report (rc/stdout/stderr of
  # the create-user step contain no credentials).

  - name: "6c | Set follow-up run timestamp"
    ansible.builtin.set_fact:
      fu_run_ts: "{{ '%Y%m%dT%H%M%S' | strftime }}"
    when: jira_followup_enabled | default(true) | bool

  - name: "6c | Ensure follow-up log dir exists on controller"
    ansible.builtin.file:
      path: "{{ followup_log_dir }}"
      state: directory
      mode: "0750"
    when:
    - jira_followup_enabled | default(true) | bool
    - issue_outcomes | dict2items | selectattr('value', 'equalto', 'failed') | list | length > 0

  - name: "6c | Write failure report per FAILED issue"
    ansible.builtin.copy:
      content: |
        Automated Oracle User Provisioning FAILURE LOG - {{ ansible_date_time.iso8601 }}
        Issue : {{ item.key }}

        Per-database results:
        {% for r in oracle_create_results.results | default([]) if r.item.0.issue_key == item.key %}
        ─── {{ r.item.1 }} : {{ 'SUCCESS' if r.rc == 0 else 'FAILED' }} (rc={{ r.rc }}) ───
        stdout: {{ r.stdout | default('(none)') | trim }}
        {% if r.rc != 0 %}
        stderr: {{ r.stderr | default('(none)') | trim }}
        {% endif %}
        {% endfor %}
      dest: "{{ followup_log_dir }}/{{ item.key }}_failure_{{ fu_run_ts }}.log"
      mode: "0640"
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"
    when:
    - jira_followup_enabled | default(true) | bool
    - item.value == 'failed'

  - name: "6c | Create DBA follow-up task for FAILED issues"
    ansible.builtin.include_tasks: COMMON_jira_create_followup_task.yml
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      loop_var: fu_item
      label: "{{ fu_item.key }}"
    when:
    - jira_followup_enabled | default(true) | bool
    - fu_item.value == 'failed'
    vars:
      fu_original_key: "{{ fu_item.key }}"
      fu_summary: "DBA repair required: Oracle user provisioning failed for {{ fu_item.key }}"
      fu_description: |-
        Automated Oracle user provisioning FAILED in one or more databases and
        the original issue has been transitioned to "{{ jira_status_failed }}".
        Please investigate and repair.

        Databases attempted : {{ oracle_create_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | list | length }}
        Databases failed    : {{ oracle_create_results.results | default([]) | selectattr('item.0.issue_key', 'equalto', fu_item.key) | selectattr('rc', 'ne', 0) | list | length }}

        The per-database failure report is attached to this task. The user's
        credentials are in the worklog entry on {{ fu_item.key }}.
      fu_attach_files:
      - "{{ followup_log_dir }}/{{ fu_item.key }}_failure_{{ fu_run_ts }}.log"

  # ── 7. Final summary ──────────────────────────────────────────────────────

  - name: "7 | Build per-issue summary lines"
    ansible.builtin.set_fact:
      summary_lines: >-
        {{
          summary_lines | default([]) + [
            '  ' + item.key + '   →   ' + (item.value | upper)
            + '   (user: '
            + (
                issues_to_process
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='oracle_user')
                | first | default('unknown')
              )
            + '  |  dbs: '
            + (
                issues_to_process
                | selectattr('issue_key', 'equalto', item.key)
                | map(attribute='target_dbs')
                | first | default([]) | join(', ')
              )
            + ')'
          ]
        }}
    loop: "{{ issue_outcomes | dict2items }}"
    loop_control:
      label: "{{ item.key }}"

  - name: "7 | Print final summary"
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop: >-
      {{
        [
          '══════════════════════════════════════════════════════',
          '  Jira Oracle User Provisioning Summary',
          '══════════════════════════════════════════════════════',
          '  Run timestamp    : ' + ansible_date_time.iso8601,
          '  Issues found     : ' + (jira_search.meta.issues | length | string),
          '  DB ops attempted : ' + (oracle_create_results.results | default([]) | length | string),
          '  DB ops OK        : ' + (oracle_create_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length | string),
          '  DB ops FAILED    : ' + (oracle_create_results.results | default([]) | selectattr('rc', 'ne', 0) | list | length | string),
          '  ──────────────────────────────────────────────────',
          '  Per-issue outcomes:'
        ]
        + (summary_lines | default(['  (none)']))
        + ['══════════════════════════════════════════════════════']
      }}
    loop_control:
      label: "summary"
