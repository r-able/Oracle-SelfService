---
# MINIMAL PROOF -- does new -> scheduled -> implement work?
#
# Deliberately uses ONLY parameters the servicenow.itsm.change_request module
# documents as supported. assigned_to is omitted entirely (it is NOT a module
# parameter; it can only be set via `other:`), because it is irrelevant to the
# question this test answers and has masked the real result twice.
#
# Run:  ansible-playbook SNOW_DCR_diag_walk.yml 2>&1 | grep '"msg"'
# Delete after use.
- name: "Prove the DCR state walk"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars/main.yml
  tasks:
  - name: "Create test change"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      type: "{{ sn_dcr_type | default('normal') }}"
      state: new
      short_description: "DCR | DEV | state walk proof"
      description: "BULK-TEST-CR state-walk proof. Safe to delete."
      assignment_group: "{{ snow_assignment_group }}"
      category: other
      risk: low
    register: w_create

  - name: "Created"
    ansible.builtin.debug:
      msg: "Created {{ w_create.record.number }} type={{ w_create.record.type }} state={{ w_create.record.state }}"

  - name: "Step 1: new -> scheduled"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ w_create.record.sys_id }}"
      state: scheduled
      assignment_group: "{{ snow_assignment_group }}"
      category: other
      risk: low
    register: w_sched
    ignore_errors: true

  - name: "scheduled result"
    ansible.builtin.debug:
      msg: "{{ 'OK -> scheduled' if not (w_sched.failed | default(false)) else ('REJECTED: ' + (w_sched.msg | default('?'))) }}"

  - name: "Step 2: scheduled -> implement"
    servicenow.itsm.change_request:
      instance:
        host: "{{ sn_instance }}"
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
      sys_id: "{{ w_create.record.sys_id }}"
      state: implement
      assignment_group: "{{ snow_assignment_group }}"
      category: other
      risk: low
    register: w_impl
    ignore_errors: true

  - name: "implement result"
    ansible.builtin.debug:
      msg: "{{ 'OK -> implement' if not (w_impl.failed | default(false)) else ('REJECTED: ' + (w_impl.msg | default('?'))) }}"

  - name: "Re-read final state"
    ansible.builtin.uri:
      url: "{{ sn_instance }}/api/now/table/change_request/{{ w_create.record.sys_id }}?sysparm_fields=number,type,state"
      method: GET
      user: "{{ sn_username }}"
      password: "{{ sn_password }}"
      force_basic_auth: true
      return_content: true
      status_code: 200
    register: w_final

  - name: "FINAL"
    ansible.builtin.debug:
      msg: "{{ w_final.json.result.number }} type={{ w_final.json.result.type }} state={{ w_final.json.result.state }}  (-5=new -2=scheduled -1=implement)"
